<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcaea图片类处理工具箱</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-sub: #555555;
            --border-color: #000000;
            --border-width: 3px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .page-header { text-align: center; margin-bottom: 10px; }
        .page-header h1 { font-size: 28px; letter-spacing: -1px; }
        .page-header p { font-size: 14px; color: var(--text-sub); margin-top: 8px; }

        /* 核心卡片样式 */
        .card {
            background: var(--card-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 8px 8px 0px var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-title { font-size: 20px; font-weight: 800; }
        .badge {
            background: var(--border-color);
            color: var(--card-bg);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; color: var(--text-sub); font-weight: 600; }
        
        /* 输入框与颜色选择器样式 */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            font-size: 14px;
        }
        
        input[type="color"] {
            width: 100%;
            height: 44px;
            padding: 4px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        input[type="number"]:focus { box-shadow: 4px 4px 0px var(--border-color); }

        /* 按钮样式 */
        .action-bar { display: flex; gap: 12px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 14px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--card-bg);
            color: var(--text-main);
        }
        button:hover {
            background: var(--border-color);
            color: var(--card-bg);
        }
        .btn-download { display: none; }

        /* 预览区域 */
        .preview-area {
            margin-top: 25px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .preview-container {
            display: inline-block;
            border: var(--border-width) solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: #f9f9f9;
            background-image: 
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        canvas { max-width: 100%; height: auto; display: block; }
        .preview-info { font-size: 13px; color: var(--text-sub); font-weight: 600; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .action-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>Arcaea图片类处理工具</h1>
        <p>纯前端本地处理</p>
    </div>

    <!-- 卡片 1：居中裁切 -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">1. 居中裁切 (374x750)</span>
            <span class="badge">固定尺寸</span>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>上传图片</label>
                <input type="file" id="tool1-file" accept="image/*">
            </div>
        </div>
        <div class="action-bar">
            <button class="btn-process" onclick="processTool1()">生成并预览</button>
            <button class="btn-download" id="tool1-download">下载图片</button>
        </div>
        <div class="preview-area" id="tool1-preview">
            <div class="preview-container">
                <canvas id="tool1-canvas"></canvas>
            </div>
            <span class="preview-info" id="tool1-info"></span>
        </div>
    </div>

    <!-- 卡片 2：渐变边框特效 -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">2. 自定义渐变边框特效</span>
            <span class="badge">Arcaea 风格</span>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>上传图片</label>
                <input type="file" id="tool2-file" accept="image/*">
            </div>
            <div class="form-group">
                <label>外框颜色</label>
                <input type="color" id="tool2-borderColor" value="#ffffff">
            </div>
            <div class="form-group">
                <label>向内渐变颜色</label>
                <input type="color" id="tool2-fadeColor" value="#d3d3d3">
            </div>
            <div class="form-group">
                <label>边框厚度 (1-10px)</label>
                <input type="number" id="tool2-thickness" value="2" min="1" max="10">
            </div>
            <div class="form-group">
                <label>渐变范围 (10-50px)</label>
                <input type="number" id="tool2-range" value="15" min="5" max="100">
            </div>
        </div>
        <div class="action-bar">
            <button class="btn-process" onclick="processTool2()">生成并预览</button>
            <button class="btn-download" id="tool2-download">下载图片</button>
        </div>
        <div class="preview-area" id="tool2-preview">
            <div class="preview-container">
                <canvas id="tool2-canvas"></canvas>
            </div>
            <span class="preview-info" id="tool2-info"></span>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // 工具 1：居中裁切 + 顶部加深 + 切角
    // ==========================================
    const tool1Canvas = document.getElementById('tool1-canvas');
    const tool1Ctx = tool1Canvas.getContext('2d', { willReadFrequently: true });
    const TARGET_W = 374;
    const TARGET_H = 750;

    async function processTool1() {
        const fileInput = document.getElementById('tool1-file');
        if (!fileInput.files || !fileInput.files[0]) { alert("请先选择一张图片！"); return; }
        
        const file = fileInput.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(resolve => img.onload = resolve);

        tool1Canvas.width = TARGET_W;
        tool1Canvas.height = TARGET_H;
        tool1Ctx.clearRect(0, 0, TARGET_W, TARGET_H);

        const scale = Math.max(TARGET_W / img.width, TARGET_H / img.height);
        const newW = img.width * scale;
        const newH = img.height * scale;
        const offsetX = (TARGET_W - newW) / 2;
        const offsetY = (TARGET_H - newH) / 2;
        
        tool1Ctx.drawImage(img, offsetX, offsetY, newW, newH);
        let imgData = tool1Ctx.getImageData(0, 0, TARGET_W, TARGET_H);
        let data = imgData.data;

        // 顶部 105px 加深
        for (let y = 0; y < 105; y++) {
            for (let x = 0; x < TARGET_W; x++) {
                const i = (y * TARGET_W + x) * 4;
                data[i] = Math.round(data[i] * 0.53);
                data[i+1] = Math.round(data[i+1] * 0.53);
                data[i+2] = Math.round(data[i+2] * 0.53);
            }
        }

        // 切去四个角 (24x42)
        const cw = 24, ch = 42;
        function cutCorner(x, y) {
            const i = (y * TARGET_W + x) * 4;
            data[i+3] = 0; 
        }
        for(let x=0; x<cw; x++) { let h = ch * (1 - x/cw); for(let y=0; y<h; y++) cutCorner(x,y); }
        for(let x=0; x<cw; x++) { let h = ch * (x/cw); for(let y=TARGET_H-h; y<TARGET_H; y++) cutCorner(TARGET_W-cw+x, y); }
        for(let x=0; x<cw; x++) { let h = ch * (x/cw); for(let y=TARGET_H-h; y<TARGET_H; y++) cutCorner(x, y); }
        for(let x=0; x<cw; x++) { let h = ch * (1 - x/cw); for(let y=TARGET_H-h; y<TARGET_H; y++) cutCorner(TARGET_W-cw+x, y); }

        tool1Ctx.putImageData(imgData, 0, 0);
        
        document.getElementById('tool1-preview').style.display = 'flex';
        document.getElementById('tool1-info').innerText = `输出尺寸: ${TARGET_W}x${TARGET_H}`;
        setupDownload('tool1-download', tool1Canvas, 'processed_crop.png');
    }

    // ==========================================
    // 工具 2：自定义渐变边框 (复刻 Python 逻辑)
    // ==========================================
    const tool2Canvas = document.getElementById('tool2-canvas');
    const tool2Ctx = tool2Canvas.getContext('2d', { willReadFrequently: true });

    function calculateDistanceMap(binaryMap) {
        const height = binaryMap.length;
        const width = binaryMap[0].length;
        let distMap = new Array(height).fill(0).map(() => new Array(width).fill(0));
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                distMap[y][x] = binaryMap[y][x] ? 0 : Infinity;
            }
        }
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                if (y > 0) distMap[y][x] = Math.min(distMap[y][x], distMap[y-1][x] + 1);
                if (x > 0) distMap[y][x] = Math.min(distMap[y][x], distMap[y][x-1] + 1);
            }
        }
        for (let y = height - 1; y >= 0; y--) {
            for (let x = width - 1; x >= 0; x--) {
                if (y < height - 1) distMap[y][x] = Math.min(distMap[y][x], distMap[y+1][x] + 1);
                if (x < width - 1) distMap[y][x] = Math.min(distMap[y][x], distMap[y][x+1] + 1);
            }
        }
        return distMap;
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    }

    async function processTool2() {
        const fileInput = document.getElementById('tool2-file');
        if (!fileInput.files || !fileInput.files[0]) { alert("请先选择一张图片！"); return; }
        
        const file = fileInput.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(resolve => img.onload = resolve);

        const width = img.width;
        const height = img.height;
        
        tool2Canvas.width = width;
        tool2Canvas.height = height;
        tool2Ctx.drawImage(img, 0, 0);
        
        let imgData = tool2Ctx.getImageData(0, 0, width, height);
        let data = imgData.data;
        
        const borderColor = hexToRgb(document.getElementById('tool2-borderColor').value);
        const fadeColor = hexToRgb(document.getElementById('tool2-fadeColor').value);
        const thickness = parseInt(document.getElementById('tool2-thickness').value);
        const fadeRange = parseInt(document.getElementById('tool2-range').value);
        
        if (!borderColor || !fadeColor) return;

        let binaryMask = [];
        for (let y = 0; y < height; y++) {
            let row = [];
            for (let x = 0; x < width; x++) {
                row.push(data[(y * width + x) * 4 + 3] === 255);
            }
            binaryMask.push(row);
        }
        
        let hasOpaque = binaryMask.some(row => row.some(val => val));
        if (!hasOpaque) { alert("图片中没有完全不透明的像素，无法生成边框！"); return; }

        let currentMask = binaryMask.map(row => [...row]);
        for (let i = 0; i < thickness; i++) {
            let nextMask = [];
            for (let y = 0; y < height; y++) {
                let row = [];
                for (let x = 0; x < width; x++) {
                    let center = currentMask[y][x];
                    let top = y > 0 ? currentMask[y-1][x] : false;
                    let bottom = y < height-1 ? currentMask[y+1][x] : false;
                    let left = x > 0 ? currentMask[y][x-1] : false;
                    let right = x < width-1 ? currentMask[y][x+1] : false;
                    row.push(center && top && bottom && left && right);
                }
                nextMask.push(row);
            }
            currentMask = nextMask;
        }
        let innerMask = currentMask;

        let distMap = calculateDistanceMap(innerMask);
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;
                
                if (binaryMask[y][x] && !innerMask[y][x]) {
                    data[idx] = borderColor.r;
                    data[idx+1] = borderColor.g;
                    data[idx+2] = borderColor.b;
                    data[idx+3] = 255;
                } else if (innerMask[y][x]) {
                    const dist = distMap[y][x];
                    let alpha = 255 * (1.0 - Math.min(dist / fadeRange, 1));
                    alpha = Math.round(alpha);
                    
                    data[idx] = fadeColor.r;
                    data[idx+1] = fadeColor.g;
                    data[idx+2] = fadeColor.b;
                    data[idx+3] = alpha;
                }
            }
        }
        
        tool2Ctx.putImageData(imgData, 0, 0);
        
        document.getElementById('tool2-preview').style.display = 'flex';
        document.getElementById('tool2-info').innerText = `输出尺寸: ${width}x${height}`;
        setupDownload('tool2-download', tool2Canvas, 'processed_gradient.png');
    }

    // ==========================================
    // 通用：处理图片下载
    // ==========================================
    function setupDownload(btnId, canvas, filename) {
        const btn = document.getElementById(btnId);
        btn.style.display = 'block';
        
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        
        newBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };
    }
</script>

</body>
</html>
