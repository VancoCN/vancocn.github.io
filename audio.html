<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频播放器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

/* 主区域 */
.main { display: flex; flex: 1; overflow: hidden; }

/* 侧边栏 */
.sidebar { width: 220px; background: #16213e; padding: 16px 0; display: flex; flex-direction: column; }
.sidebar h2 { padding: 0 16px; font-size: 14px; font-weight: 500; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
.playlist-item { padding: 8px 16px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.playlist-item:hover { background: #0f3460; }
.playlist-item.active { background: #0f3460; color: #fff; }
.playlist-item .del { color: #555; font-size: 12px; padding: 2px 6px; }
.playlist-item .del:hover { color: #e74c3c; }
.new-playlist { margin: 12px 16px; padding: 8px; background: #0f3460; border: 1px dashed #555; border-radius: 4px; color: #aaa; cursor: pointer; font-size: 13px; text-align: center; }
.new-playlist:hover { border-color: #777; color: #ddd; }

/* 内容区 */
.content { flex: 1; padding: 24px; overflow-y: auto; }
.content h1 { font-size: 18px; margin-bottom: 16px; font-weight: 500; }

/* 添加区域 */
.add-area { background: #16213e; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
.add-area label { font-size: 13px; color: #aaa; display: block; margin-bottom: 6px; }
.add-area input[type="text"], .add-area select { width: 100%; padding: 8px 10px; background: #1a1a2e; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-size: 13px; margin-bottom: 10px; }
.add-area input:focus, .add-area select:focus { outline: none; border-color: #0f3460; }
.file-drop { border: 1.5px dashed #444; border-radius: 4px; padding: 20px; text-align: center; color: #666; font-size: 13px; cursor: pointer; margin-bottom: 10px; transition: border-color .2s; }
.file-drop:hover, .file-drop.drag { border-color: #0f3460; color: #aaa; }
.file-drop input { display: none; }
.add-btn { padding: 8px 20px; background: #0f3460; border: none; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 13px; }
.add-btn:hover { background: #1a4a7a; }

/* 歌曲列表 */
.song-item { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 14px; }
.song-item:hover { background: #16213e; }
.song-item.playing { color: #5b8def; }
.song-item .tag { font-size: 11px; padding: 1px 5px; border-radius: 3px; margin-right: 8px; }
.song-item .tag.local { background: #1a3a1a; color: #5a5; }
.song-item .tag.remote { background: #1a2a3a; color: #5ab; }
.song-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song-item .remove { color: #444; padding: 2px 6px; font-size: 12px; }
.song-item .remove:hover { color: #e74c3c; }

/* 底部播放器 */
.player { height: 64px; background: #0f0f23; border-top: 1px solid #222; display: flex; align-items: center; padding: 0 20px; gap: 16px; }
.player .info { width: 180px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #aaa; }
.player .controls { display: flex; align-items: center; gap: 10px; }
.player button { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 4px 8px; }
.player button:hover { color: #fff; }
.player .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #666; }
.player input[type="range"] { flex: 1; accent-color: #0f3460; }
.player .volume { width: 100px; accent-color: #0f3460; }
</style>
</head>
<body>

<div class="main">
  <div class="sidebar">
    <h2>歌单</h2>
    <div id="playlists"></div>
    <div class="new-playlist" onclick="createPlaylist()">+ 新建歌单</div>
  </div>
  <div class="content">
    <h1 id="currentPlaylistName">默认歌单</h1>

    <div class="add-area">
      <div class="file-drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <span id="dropText">点击选择文件或拖拽音频到此处</span>
        <input type="file" id="fileInput" accept="audio/*" multiple onchange="handleFiles(this.files)">
      </div>
      <label>或添加外链音频</label>
      <input type="text" id="remoteUrl" placeholder="https://example.com/song.mp3">
      <input type="text" id="remoteName" placeholder="歌名（可选）">
      <label style="margin-top:10px;">添加到歌单</label>
      <select id="targetPlaylist"></select>
      <div style="margin-top:12px;">
        <button class="add-btn" onclick="addRemote()">添加外链</button>
      </div>
    </div>

    <div id="songList"></div>
  </div>
</div>

<div class="player">
  <div class="info" id="nowPlaying">未播放</div>
  <div class="controls">
    <button onclick="prevSong()">&#9194;</button>
    <button onclick="togglePlay()" id="playBtn">&#9654;</button>
    <button onclick="nextSong()">&#9193;</button>
  </div>
  <div class="progress-wrap">
    <span id="currentTime">0:00</span>
    <input type="range" id="progress" min="0" max="100" value="0" onchange="seek(this.value)">
    <span id="duration">0:00</span>
  </div>
  <input type="range" class="volume" id="volume" min="0" max="1" step="0.05" value="0.8" onchange="setVolume(this.value)">
</div>

<audio id="audio"></audio>

<script>
const STORAGE_KEY = 'audioPlayerData';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  playlists: [{ id: 'default', name: '默认歌单', songs: [] }],
  currentPlaylist: 'default'
};
let currentSongIndex = -1;
let isPlaying = false;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');

// 初始化
renderPlaylists();
renderSongs();
populatePlaylistSelect();

// 拖拽
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function renderPlaylists() {
  const el = document.getElementById('playlists');
  el.innerHTML = data.playlists.map(p => `
    <div class="playlist-item ${p.id === data.currentPlaylist ? 'active' : ''}" onclick="switchPlaylist('${p.id}')">
      <span>${p.name}</span>
      ${p.id !== 'default' ? `<span class="del" onclick="event.stopPropagation();deletePlaylist('${p.id}')">x</span>` : ''}
    </div>
  `).join('');
}

function populatePlaylistSelect() {
  const sel = document.getElementById('targetPlaylist');
  sel.innerHTML = data.playlists.map(p => `<option value="${p.id}" ${p.id === data.currentPlaylist ? 'selected' : ''}>${p.name}</option>`).join('');
}

function switchPlaylist(id) {
  data.currentPlaylist = id;
  save();
  renderPlaylists();
  renderSongs();
  populatePlaylistSelect();
  document.getElementById('currentPlaylistName').textContent = data.playlists.find(p => p.id === id).name;
}

function createPlaylist() {
  const name = prompt('歌单名称：');
  if (!name) return;
  const id = 'pl_' + Date.now();
  data.playlists.push({ id, name, songs: [] });
  save();
  renderPlaylists();
  populatePlaylistSelect();
}

function deletePlaylist(id) {
  if (!confirm('删除此歌单？')) return;
  data.playlists = data.playlists.filter(p => p.id !== id);
  if (data.currentPlaylist === id) { data.currentPlaylist = 'default'; }
  save();
  renderPlaylists();
  renderSongs();
  populatePlaylistSelect();
}

function handleFiles(files) {
  const targetId = document.getElementById('targetPlaylist').value;
  const playlist = data.playlists.find(p => p.id === targetId);
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      playlist.songs.push({ name: file.name, src: e.target.result, type: 'local' });
      save();
      if (targetId === data.currentPlaylist) renderSongs();
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('dropText').textContent = '点击选择文件或拖拽音频到此处';
}

function addRemote() {
  const url = document.getElementById('remoteUrl').value.trim();
  if (!url) return;
  const name = document.getElementById('remoteName').value.trim() || url.split('/').pop().split('?')[0] || '未知';
  const targetId = document.getElementById('targetPlaylist').value;
  const playlist = data.playlists.find(p => p.id === targetId);
  playlist.songs.push({ name, src: url, type: 'remote' });
  save();
  if (targetId === data.currentPlaylist) renderSongs();
  document.getElementById('remoteUrl').value = '';
  document.getElementById('remoteName').value = '';
}

function renderSongs() {
  const playlist = data.playlists.find(p => p.id === data.currentPlaylist);
  const el = document.getElementById('songList');
  el.innerHTML = playlist.songs.map((s, i) => `
    <div class="song-item ${i === currentSongIndex ? 'playing' : ''}" ondblclick="playSong(${i})">
      <span class="tag ${s.type}">${s.type === 'local' ? '本地' : '外链'}</span>
      <span class="name">${s.name}</span>
      <span class="remove" onclick="removeSong(${i})">x</span>
    </div>
  `).join('');
}

function removeSong(i) {
  const playlist = data.playlists.find(p => p.id === data.currentPlaylist);
  playlist.songs.splice(i, 1);
  if (i === currentSongIndex) { audio.pause(); currentSongIndex = -1; isPlaying = false; playBtn.innerHTML = '&#9654;'; }
  save();
  renderSongs();
}

function playSong(i) {
  const playlist = data.playlists.find(p => p.id === data.currentPlaylist);
  const song = playlist.songs[i];
  if (!song) return;
  currentSongIndex = i;
  audio.src = song.src;
  audio.play();
  isPlaying = true;
  playBtn.innerHTML = '&#9646;&#9646;';
  document.getElementById('nowPlaying').textContent = song.name;
  renderSongs();
}

function togglePlay() {
  if (currentSongIndex < 0) {
    const playlist = data.playlists.find(p => p.id === data.currentPlaylist);
    if (playlist.songs.length > 0) playSong(0);
    return;
  }
  if (isPlaying) { audio.pause(); isPlaying = false; playBtn.innerHTML = '&#9654;'; }
  else { audio.play(); isPlaying = true; playBtn.innerHTML = '&#9646;&#9646;'; }
}

function prevSong() {
  if (currentSongIndex > 0) playSong(currentSongIndex - 1);
}
function nextSong() {
  const playlist = data.playlists.find(p => p.id === data.currentPlaylist);
  if (currentSongIndex < playlist.songs.length - 1) playSong(currentSongIndex + 1);
}

audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime, dur = audio.duration || 0;
  document.getElementById('currentTime').textContent = formatTime(cur);
  document.getElementById('duration').textContent = formatTime(dur);
  document.getElementById('progress').value = dur ? cur / dur * 100 : 0;
});
audio.addEventListener('ended', nextSong);

function seek(v) { audio.currentTime = audio.duration * v / 100; }
function setVolume(v) { audio.volume = v; }
function formatTime(s) { const m = Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') prevSong();
  if (e.code === 'ArrowRight') nextSong();
});
</script>
</body>
</html>
