<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>祝福：雪夜问魂</title>
<style>
/* ============================================================
   《祝福：雪夜问魂》· 以字代物版
   视觉小说 + 轻解谜 ｜ 单文件 ｜ 无外部依赖
   - 不用任何图片 / SVG / emoji，所有"物"都是汉字
   - 排版全用 grid / flex 流式，无固定坐标，手机桌面都不会错位
   ============================================================ */

:root{
  --ink:#070b0e;            /* 夜 */
  --ink2:#121b21;           /* 次夜 */
  --snow:#dfe6e8;           /* 雪白 */
  --paper:rgba(226,220,206,.075);  /* 宣纸 */
  --red:#8e2b2b;            /* 暗红 */
  --red2:#b8453c;
  --gold:#c8a86b;           /* 烛 */
  --grey:#8b969c;
  --line:rgba(142,43,43,.5);
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC","WenQuanYi Micro Hei",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",var(--serif);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:radial-gradient(125% 95% at 50% 0%, #1c272e 0%, #0d1418 55%, #050809 100%);
  color:var(--snow);
  font-family:var(--serif);
  font-size:16px;line-height:1.95;
  letter-spacing:.02em;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
/* 木刻刻痕噪点 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 1px, transparent 1px 4px);
  mix-blend-mode:overlay;
}
/* 暗角 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(82% 72% at 50% 42%, transparent 42%, rgba(0,0,0,.7) 100%);
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:2;}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
  background:radial-gradient(62% 52% at 70% 18%, #ffd9a8 0%, rgba(255,120,60,.22) 42%, transparent 72%);}
#flash.on{animation:flash .5s ease-out;}
@keyframes flash{0%{opacity:0}12%{opacity:.7}100%{opacity:0}}

/* ============================================================
   背景层：纯 CSS 绘制的简化剪影 + 大字水印
   固定定位、不接收事件、不参与任何排版 —— 不会影响布局
   层次：#bg(0) < 噪点/暗角(1) < 雪(2) < 闪光(3) < 内容(4)
   ============================================================ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  --sky1:#1c272e; --sky2:#050809; --sil:#080d11;
  background:var(--sky2);}
#bg > div{position:absolute;inset:0;transition:opacity 1s ease, background 1s ease;}

/* 天色 */
.b-sky{background:radial-gradient(125% 78% at 50% 0%, var(--sky1) 0%, var(--sky2) 72%);}

/* 背景大字水印 —— 「以字代物」的背景版 */
.b-glyph{display:flex;align-items:center;justify-content:center;}
.b-glyph::after{
  content:"";font-family:var(--kai);font-weight:600;line-height:1;
  font-size:min(66vh,54vw);transform:translateY(-3%);
  color:rgba(255,255,255,.04);
  text-shadow:0 0 70px rgba(0,0,0,.7);
  transition:opacity 1s ease, color 1s ease;
  opacity:0;
}
#bg.town      .b-glyph::after{content:"福";color:rgba(184,69,60,.10);opacity:1}
#bg.study     .b-glyph::after{content:"福";color:rgba(184,69,60,.12);opacity:1}
#bg.bless     .b-glyph::after{content:"福";color:rgba(184,69,60,.14);opacity:1}
#bg.snowfield .b-glyph::after{content:"雪";color:rgba(223,230,232,.075);opacity:1}
#bg.temple    .b-glyph::after{content:"廟";color:rgba(200,168,107,.10);opacity:1}
#bg.river     .b-glyph::after{content:"魂";color:rgba(223,230,232,.055);opacity:1}

/* 远景剪影：马头墙 / 山坳 */
.b-far{top:auto;height:62%;opacity:0;background:var(--sil);}
#bg.town .b-far{
  opacity:.9;
  background-color:#0a1014;
  /* 阶梯状马头墙轮廓 */
  clip-path:polygon(0 100%,0 62%,7% 62%,7% 50%,13% 50%,13% 66%,24% 66%,24% 48%,32% 48%,
    32% 34%,42% 34%,42% 58%,54% 58%,54% 42%,64% 42%,64% 62%,76% 62%,76% 48%,86% 48%,
    86% 64%,100% 64%,100% 100%);
  /* 窗里的灯火 */
  background-image:
    radial-gradient(circle 8px at 10% 76%, rgba(255,186,92,.42), transparent 72%),
    radial-gradient(circle 6px at 28% 80%, rgba(255,186,92,.3),  transparent 72%),
    radial-gradient(circle 9px at 47% 74%, rgba(255,186,92,.24), transparent 72%),
    radial-gradient(circle 7px at 70% 80%, rgba(255,186,92,.28), transparent 72%),
    radial-gradient(circle 6px at 90% 76%, rgba(255,186,92,.2),  transparent 72%);
}
#bg.snowfield .b-far{
  opacity:.92;background-color:#0b1216;
  clip-path:polygon(0 100%,0 54%,14% 36%,26% 50%,40% 28%,52% 46%,66% 32%,80% 50%,92% 38%,100% 52%,100% 100%);
}
#bg.river .b-far{opacity:.75;background-color:#090e12;
  clip-path:polygon(0 100%,0 66%,18% 58%,34% 64%,52% 56%,70% 64%,86% 58%,100% 64%,100% 100%);}
/* 近景暗影 */
.b-near{top:auto;height:24%;opacity:0;
  background:linear-gradient(180deg,#050809,#010304);
  clip-path:polygon(0 42%,10% 22%,22% 38%,36% 16%,50% 34%,64% 20%,78% 36%,90% 22%,100% 42%,100% 100%,0 100%);}
#bg.town .b-near,#bg.snowfield .b-near,#bg.river .b-near{opacity:1}

/* 雪地 */
.b-ground{top:auto;height:36%;opacity:0;
  background:linear-gradient(180deg, rgba(203,216,221,.17), rgba(203,216,221,.05) 62%, transparent);
  clip-path:polygon(0 24%,12% 14%,26% 24%,40% 10%,56% 22%,70% 12%,86% 24%,100% 16%,100% 100%,0 100%);}
#bg.snowfield .b-ground,#bg.town .b-ground,#bg.river .b-ground{opacity:1}

/* 河面 */
.b-water{inset:auto;top:64%;height:11%;opacity:0;filter:blur(4px);
  background:linear-gradient(180deg, rgba(126,156,166,.2), rgba(126,156,166,.04));}
#bg.river .b-water{opacity:1}

/* 土地庙：拱门 */
.b-gate{inset:auto;left:50%;bottom:6%;width:min(300px,62vw);height:min(360px,56vh);
  transform:translateX(-50%);opacity:0;
  background:linear-gradient(180deg,#2b2018,#150e09);
  border:2px solid rgba(200,168,107,.22);
  border-radius:50% 50% 4px 4px / 38% 38% 3px 3px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.8);}
#bg.temple .b-gate{opacity:.7}

/* 红烛 */
.b-candle{inset:auto;bottom:0;height:32%;opacity:0;
  display:flex;align-items:flex-end;justify-content:center;gap:min(24vw,190px);}
.b-candle i{position:relative;display:block;width:min(26px,5vw);height:72%;
  background:linear-gradient(180deg,#a83a34,#5d1c1c);border-radius:2px 2px 0 0;}
.b-candle i::before{content:"";position:absolute;left:50%;top:-15px;margin-left:-7px;
  width:14px;height:26px;border-radius:50% 50% 45% 45%;
  background:radial-gradient(60% 40% at 50% 80%, #fff2c0 0%, #ffb347 45%, rgba(184,69,60,0) 78%);
  animation:flick 1.7s infinite ease-in-out;}
.b-candle i::after{content:"";position:absolute;left:50%;top:-46px;margin-left:-60px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,180,90,.2), transparent 68%);
  animation:flick 2.1s infinite ease-in-out;}
#bg.bless .b-candle,#bg.study .b-candle{opacity:1}
@keyframes flick{0%,100%{transform:scale(1);opacity:.95}
  25%{transform:scale(1.08,.94);opacity:1}50%{transform:scale(.94,1.08)}75%{transform:scale(1.05,.97)}}

/* 香烟 */
.b-smoke{inset:auto;bottom:6%;height:56%;opacity:0;filter:blur(7px);
  background:linear-gradient(100deg, transparent 40%, rgba(226,226,220,.06) 49%, transparent 58%);
  animation:smoke 15s linear infinite;}
#bg.bless .b-smoke,#bg.temple .b-smoke{opacity:1}
@keyframes smoke{0%{transform:translateY(16%) skewX(-9deg)}50%{transform:translateY(0) skewX(4deg)}
  100%{transform:translateY(-16%) skewX(9deg)}}

/* 地面暖光 / 冷光 */
.b-glow{--glow:transparent;opacity:0;
  background:radial-gradient(54% 34% at 50% 90%, var(--glow), transparent 72%);}
#bg.bless .b-glow{opacity:1;--glow:rgba(255,170,80,.15)}
#bg.study .b-glow{opacity:1;--glow:rgba(255,170,80,.1)}
#bg.temple .b-glow{opacity:1;--glow:rgba(200,168,107,.1)}
#bg.river .b-glow{opacity:1;--glow:rgba(140,180,195,.08)}

/* 完满结局：天要亮了 */
#bg.dawn{--sky1:#313d46;--sky2:#0f151a}
#bg.dawn .b-far{opacity:.85;background-color:#0e161b;
  clip-path:polygon(0 100%,0 66%,8% 66%,8% 52%,15% 52%,15% 70%,27% 70%,27% 50%,36% 50%,
    36% 36%,46% 36%,46% 60%,58% 60%,58% 44%,68% 44%,68% 66%,80% 66%,80% 52%,90% 52%,
    90% 68%,100% 68%,100% 100%);
  background-image:
    radial-gradient(circle 8px at 12% 78%, rgba(255,200,120,.34), transparent 72%),
    radial-gradient(circle 7px at 47% 76%, rgba(255,200,120,.2),  transparent 72%),
    radial-gradient(circle 6px at 82% 78%, rgba(255,200,120,.16), transparent 72%);}
#bg.dawn .b-ground{opacity:1}
#bg.dawn .b-near{opacity:1}
#bg.dawn .b-glow{opacity:1;--glow:rgba(255,196,120,.2)}
#bg.dawn .b-glyph::after{content:"旦";color:rgba(255,238,210,.11);opacity:1}

/* 各场景天色微调 */
#bg.study{--sky1:#1f2530;--sky2:#070a0d}
#bg.bless{--sky1:#2a1f22;--sky2:#0a0708}
#bg.temple{--sky1:#221c17;--sky2:#080605}
#bg.snowfield{--sky1:#243039;--sky2:#0a1014}
#bg.river{--sky1:#1a2831;--sky2:#060a0d}
#bg.blank{--sky1:#141c22;--sky2:#05080a}
@media (prefers-reduced-motion:reduce){
  .b-candle i::before,.b-candle i::after,.b-smoke{animation:none}
}

/* 雪幕（烧纸 / 隐藏结局） */
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 3.4s ease;
  background:linear-gradient(180deg, rgba(226,233,235,.14) 0%, rgba(226,233,235,.6) 46%, rgba(226,233,235,.9) 100%);}
.veil.on{opacity:1;}

#app{position:relative;z-index:4;max-width:760px;margin:0 auto;
  padding:16px 14px calc(48px + env(safe-area-inset-bottom));
  min-height:100dvh;display:flex;flex-direction:column;}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;margin-bottom:12px;
  background:rgba(12,17,21,.6);border:1px solid var(--line);border-radius:2px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.4);
  font-size:12.5px;color:#b9c4c8;
}
.topbar .chap{color:var(--gold);letter-spacing:.14em;}
.topbar .sp{flex:1 1 20px}
.mini{
  font-family:var(--serif);cursor:pointer;background:transparent;
  border:1px solid var(--line);color:#c9d2d5;padding:5px 10px;border-radius:2px;
  font-size:12.5px;letter-spacing:.1em;transition:.18s;white-space:nowrap;
}
.mini:hover{background:rgba(142,43,43,.28);color:#fff;border-color:var(--red2);}
.mini:active{transform:translateY(1px)}
.frag{color:var(--red2);white-space:nowrap;}
/* 「念」：完满路线的六个记号。不说破，只报数 */
.path{display:inline-block;color:#7d888d;letter-spacing:.14em;opacity:.72;white-space:nowrap;
  transition:color .3s,opacity .3s;}
.path.bump{animation:bump .7s ease-out;}
@keyframes bump{0%{transform:scale(1)}
  28%{transform:scale(1.32);color:var(--gold);opacity:1}
  100%{transform:scale(1)}}

/* ---------- 开始界面（纯字） ---------- */
#start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;text-align:center;padding:20px 0;}
.titleWrap{display:flex;align-items:stretch;gap:14px;justify-content:center;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 10px;}
.vtitle{writing-mode:vertical-rl;text-orientation:upright;margin:0;
  font-size:clamp(28px,6.6vw,44px);letter-spacing:.2em;color:#eef2f3;font-weight:600;line-height:1.2;
  text-shadow:0 0 22px rgba(180,70,60,.4), 2px 2px 0 #000;}
.vsub{writing-mode:vertical-rl;text-orientation:upright;margin:0;
  font-size:clamp(11px,2.6vw,13px);color:var(--grey);letter-spacing:.3em;}
.startbtns{display:flex;flex-direction:column;gap:10px;width:min(300px,84vw);}
.btn{font-family:var(--serif);cursor:pointer;width:100%;
  background:linear-gradient(180deg, rgba(142,43,43,.3), rgba(142,43,43,.08));
  border:1px solid var(--red);color:#f0e9e0;padding:13px 18px;font-size:16.5px;
  letter-spacing:.24em;border-radius:2px;transition:.22s;}
.btn:hover{background:linear-gradient(180deg, rgba(184,69,60,.45), rgba(142,43,43,.18));
  box-shadow:0 0 18px rgba(142,43,43,.45);letter-spacing:.3em;}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(226,220,206,.05);border-color:rgba(200,200,200,.26);}
.btn.ghost:hover{background:rgba(226,220,206,.12);box-shadow:none;}
.startnote{font-size:12.5px;color:#6f7a80;max-width:480px;line-height:2.1;letter-spacing:.05em;margin:0;}
.seal{margin-top:2px;display:inline-block;padding:10px 8px;border:2px solid var(--red);
  color:var(--red2);font-family:var(--kai);font-size:14px;letter-spacing:.2em;
  writing-mode:vertical-rl;border-radius:2px;transform:rotate(-3deg);opacity:.9;}

/* ---------- 主面板 ---------- */
#game{display:none;}
.panel{background:rgba(12,17,21,.62);border:1px solid var(--line);border-radius:2px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  box-shadow:inset 0 0 60px rgba(0,0,0,.5), 0 6px 30px rgba(0,0,0,.45);
  padding:20px 18px 18px;position:relative;}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;
  border:1px solid var(--red);opacity:.8;}
.panel::before{left:6px;top:6px;border-right:0;border-bottom:0;}
.panel::after{right:6px;bottom:6px;border-left:0;border-top:0;}
.sceneTitle{font-size:14.5px;color:var(--gold);letter-spacing:.28em;margin:0 0 3px;font-weight:600;}
.sceneSub{font-size:12px;color:#7d888d;letter-spacing:.14em;margin:0 0 14px;}
.textBox{font-size:16.5px;line-height:2.15;color:#e3e8ea;min-height:13em;}
.textBox p{margin:0 0 .8em;text-indent:2em;}
.textBox .quote{display:block;text-indent:0;color:#f0d9b0;font-family:var(--kai);font-size:17.5px;
  border-left:2px solid var(--red);padding:2px 0 2px 13px;margin:.6em 0 .9em;
  background:linear-gradient(90deg, rgba(142,43,43,.13), transparent 72%);}
.cursor{display:inline-block;width:.55em;background:var(--red2);
  animation:blink .8s steps(1) infinite;color:transparent;}
@keyframes blink{50%{opacity:0}}

/* ---------- 选项 ---------- */
#choices{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
.choice{font-family:var(--serif);text-align:left;cursor:pointer;width:100%;
  background:rgba(226,220,206,.055);border:1px solid rgba(226,220,206,.18);
  color:#dfe6e8;padding:12px 14px 12px 32px;font-size:15.5px;line-height:1.75;
  border-radius:2px;transition:.2s;position:relative;min-height:46px;}
.choice::before{content:"○";position:absolute;left:12px;top:12px;color:var(--red2);font-size:12.5px;}
.choice:hover{background:rgba(142,43,43,.22);border-color:var(--red);}
.choice:active{transform:translateY(1px)}

/* ---------- 状态条 ---------- */
.status{display:flex;gap:12px 18px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#8e999e;
  border-top:1px dashed rgba(226,220,206,.14);padding-top:10px;}
.bar{display:flex;align-items:center;gap:8px;}
.track{width:92px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;flex:none;}
.fill{display:block;height:100%;background:linear-gradient(90deg,#6d7f88,#c8d2d6);transition:width .5s;}
.fill.low{background:linear-gradient(90deg,#8e2b2b,#b8453c);}
.verdict{color:var(--red2);letter-spacing:.08em;}

/* ---------- 以字代物：字牌网格 ---------- */
#stage{margin-top:16px;border-top:1px dashed rgba(226,220,206,.16);padding-top:14px;}
.stageTip{font-size:12.5px;color:#8e999e;letter-spacing:.1em;margin-bottom:12px;line-height:1.8;}
.things{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:10px;}
.thing{
  cursor:pointer;background:rgba(226,220,206,.05);border:1px solid rgba(226,220,206,.18);
  border-radius:2px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;
  gap:4px;transition:.22s;user-select:none;min-height:74px;justify-content:center;
}
.thing .g{font-family:var(--kai);font-size:clamp(26px,7vw,32px);line-height:1.1;color:#e8eef0;transition:.22s;}
.thing .n{font-size:11px;color:var(--grey);letter-spacing:.12em;white-space:nowrap;}
.thing:hover{border-color:var(--red);background:rgba(142,43,43,.2);}
.thing:hover .g{color:#fff;text-shadow:0 0 14px rgba(200,168,107,.7);}
.thing.done{opacity:.45;pointer-events:none;border-style:dashed;}
.thing.done .g{color:var(--red2);}
.thing.found{border-color:var(--gold);background:rgba(200,168,107,.14);}
.thing.found .g{color:#ffe9b8;text-shadow:0 0 14px rgba(200,168,107,.8);}

/* 雪地：一片「雪」字 */
.snowfield{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:3px;}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-family:var(--kai);font-size:clamp(17px,4.6vw,22px);user-select:none;
  color:rgba(223,230,232,.3);border:1px solid transparent;transition:.2s;}
.cell:hover{color:#fff;border-color:rgba(142,43,43,.5);background:rgba(142,43,43,.12);}
.cell.swept{color:rgba(223,230,232,.1);pointer-events:none;}
.cell.real{color:var(--red2);pointer-events:none;
  border-color:var(--red);background:rgba(142,43,43,.22);text-shadow:0 0 12px rgba(184,69,60,.8);
  animation:found .5s ease-out;}
@keyframes found{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* 记忆段落 */
.mem{margin-top:12px;font-family:var(--kai);font-size:14.5px;color:#cbb98f;line-height:2;
  border-left:2px solid var(--gold);padding:8px 0 8px 12px;
  background:linear-gradient(90deg, rgba(200,168,107,.1), transparent 76%);
  animation:fadein .7s;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blocked{margin-top:12px;font-family:var(--kai);font-size:15.5px;color:#f0c9c2;text-align:center;
  letter-spacing:.12em;animation:shake .4s;padding:8px;border:1px dashed var(--red);
  background:rgba(142,43,43,.12);line-height:1.9;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{margin-top:10px;font-size:12.5px;color:#7d888d;letter-spacing:.1em;}

/* 供桌：一条横线 + 摆上去的字 */
.offerBar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.offerBar button{font-family:var(--serif);cursor:pointer;background:rgba(226,220,206,.06);
  border:1px solid rgba(226,220,206,.2);color:#e3e8ea;padding:7px 13px;font-size:14.5px;
  border-radius:2px;transition:.2s;font-family:var(--kai);}
.offerBar button:hover{background:rgba(142,43,43,.25);border-color:var(--red);}
.offerBar button.used{opacity:.3;pointer-events:none;text-decoration:line-through;}
.offerBar button.she{background:rgba(142,43,43,.28);border-color:var(--red2);}
.table{position:relative;border-top:1px solid rgba(200,168,107,.45);margin-top:34px;padding-top:10px;
  text-align:center;font-family:var(--kai);font-size:22px;color:#e8dcc4;letter-spacing:.5em;
  min-height:34px;word-break:break-all;}
.table::after{content:"供　桌";position:absolute;left:0;right:0;bottom:-22px;font-size:11px;

.tableLine{margin-bottom:14px;}

/* 攒钱 */
.tally{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.tally span{width:15px;height:15px;border:1px solid rgba(200,168,107,.55);border-radius:50%;}
.tally span.on{background:radial-gradient(circle at 34% 30%,#f0e2bd,#9a8a63);border-color:#c8a86b;
  animation:coin .4s ease-out;}
@keyframes coin{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}

/* 庙门 / 门槛 */
.templeRow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin:8px 0;}
.gate{border:2px dashed rgba(226,220,206,.32);border-radius:2px;padding:16px 22px;text-align:center;

.gate .big{display:block;font-size:34px;color:rgba(226,220,206,.35);letter-spacing:0;margin-bottom:4px;}
.gate.hot{border-color:var(--gold);background:rgba(200,168,107,.12);color:var(--gold);}
.gate.hot .big{color:#ffe9b8;}
.gate.done{border-style:solid;border-color:var(--gold);color:var(--gold);}
.gate.done .big{color:#ffe9b8;}
.beam{border:1px solid #2c0f0d;border-radius:2px;padding:14px 22px;cursor:grab;
  background:linear-gradient(180deg,#7d2b26,#4e1a17);box-shadow:0 4px 12px rgba(0,0,0,.6);

.beam:active{cursor:grabbing;box-shadow:0 10px 26px rgba(0,0,0,.85);}
.beam.locked{cursor:default;box-shadow:none;opacity:.85;border-color:var(--gold);}
/* 刻上的字 */

  color:#f0d9b0;letter-spacing:.1em;min-height:38px;margin-top:6px;}
.engraved b{font-weight:400;animation:carve .45s ease-out;text-shadow:0 0 12px rgba(200,168,107,.7);}
@keyframes carve{from{opacity:0;transform:scale(1.6) rotate(-8deg)}to{opacity:1;transform:none}}

/* 底部 */
.footer{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* ---------- 结局 ---------- */
#ending{display:none;}
.endTitle{margin:0 0 4px;font-size:clamp(24px,6vw,36px);letter-spacing:.3em;color:#f0e4cf;
  font-weight:600;text-align:center;word-break:break-word;}

  color:#fff;text-align:center;margin:32px 0 8px;animation:breathe 5s ease-in-out infinite;}
/* 完满结局：替她取名 */
.nameAsk{text-align:center;font-family:var(--kai);color:var(--gold);font-size:16px;
  letter-spacing:.2em;margin:26px 0 6px;}

  background:transparent;border:0;border-bottom:1px solid rgba(200,168,107,.6);

.echoQ{margin-top:18px}
@keyframes breathe{0%,100%{opacity:.6;letter-spacing:.42em}50%{opacity:1;letter-spacing:.5em}}
.snowed{opacity:0 !important;pointer-events:none !important;transition:opacity 2.4s ease;}
/* 雪幕升起后，文字转墨色保证可读 */

#ending.onWhite .endTag{color:#7d2b26 !important;}

@media (max-width:560px){

  .things{grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px}
  .snowfield{grid-template-columns:repeat(6,1fr)}
  .topbar{font-size:11.5px;gap:6px;padding:7px 9px}
}

<body>

<!-- 背景层：纯 CSS 剪影，固定不动，不参与排版 -->

<div id="app">

<script>
/* =========================================================================
   《祝福：雪夜问魂》· 以字代物版
   1) 雪 Canvas      2) Web Audio 环境音     3) 场景节点系统
   4) 文字小游戏（字牌 / 雪地寻字 / 摆供 / 攒钱 / 拖槛 / 刻字）
   5) 变量：耐心值、祭祀资格（恒 false）、记忆碎片、沉默标记
   6) localStorage 存档 + 重新开始
   ========================================================================= */

/* ---------------- 0. 全局状态 ---------------- */
const SAVE_KEY = 'zhufu_xueye_wenhun_v2';
let S = null;
let typing = false, typeTimer = null, crackerTimer = null;

function freshState(){
  return {
    scene:'prologue_arrive',
    frag:0,          // 记忆碎片 0-9
    patience:5,      // 周围人的耐心 0-5
    heard:0,         // 听阿毛故事的次数
    clean:false,     // 祭祀资格 —— 永远 false
    money:0,
    silentMarks:{},  // 关键沉默点 m1..m5
    silentCount:0,
    path:{},         // 完满路线的六个记号 p1..p6
    pathCount:0,
    givenName:'',    // 完满结局里你替她取的名字
    soul:null,       // 灵魂之问分支 a/b/c/d
    mg:{},           // 小游戏完成记录
    seen:{},
    log:[]
  };
}

/* ---------------- 1. 雪（Canvas） ---------------- */
const cv = document.getElementById('snow');
const cx = cv.getContext('2d');
let flakes = [], W = 0, H = 0, wind = .35, density = 1;

function resizeSnow(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function newFlake(init){
  return { x:Math.random()*W, y:init?Math.random()*H:-10,
    r:Math.random()*1.8+.5, sp:Math.random()*.85+.35,
    sw:Math.random()*1.5+.4, ph:Math.random()*Math.PI*2, a:Math.random()*.5+.22 };
}
function initSnow(){
  resizeSnow();
  flakes = [];
  const n = Math.max(40, Math.round(W*H/9000*density));
  for(let i=0;i<n;i++) flakes.push(newFlake(true));
}
function drawSnow(){
  cx.clearRect(0,0,W,H);
  cx.fillStyle = '#fff';
  for(const f of flakes){
    f.ph += .012;
    f.y += f.sp * density;
    f.x += Math.sin(f.ph)*f.sw*.35 + wind;
    if(f.y > H+6 || f.x > W+8 || f.x < -8) Object.assign(f, newFlake(false), {x:Math.random()*W});
    cx.globalAlpha = f.a;
    cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, Math.PI*2); cx.fill();
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(drawSnow);
}
window.addEventListener('resize', ()=>{ resizeSnow(); initSnow(); });
initSnow(); drawSnow();

function setSnow(mode){
  const want = mode==='heavy' ? 150 : mode==='calm' ? 45 : 90;
  density = mode==='heavy' ? 2.0 : mode==='calm' ? .6 : 1;
  wind    = mode==='heavy' ? .8  : mode==='calm' ? .15 : .35;
  // 同步粒子数量
  while(flakes.length < want) flakes.push(newFlake(true));
  while(flakes.length > want) flakes.pop();
}

/* ---------------- 2. Web Audio 环境音 ---------------- */
const Audio_ = {
  ctx:null, master:null, noise:null, muted:false, started:false,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : .9;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 3;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0); let last = 0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
    this.noise = buf;
  },
  startAmbient(){
    this.ensure(); if(!this.ctx || this.started) return;
    this.started = true;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const src = this.ctx.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const lp = this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 420;
    const g = this.ctx.createGain(); g.gain.value = .05;
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = .07;
    const lg = this.ctx.createGain(); lg.gain.value = .028;
    lfo.connect(lg).connect(g.gain);
    src.connect(lp).connect(g).connect(this.master); src.start(); lfo.start();
    const o = this.ctx.createOscillator(); o.type='sine'; o.frequency.value = 54;
    const og = this.ctx.createGain(); og.gain.value = .026;
    o.connect(og).connect(this.master); o.start();
  },
  cracker(){                       // 爆竹：带通噪声爆发
    if(!this.ctx){ flash(); return; }
    const t = this.ctx.currentTime, n = 1 + Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const st = t + i*(.06+Math.random()*.12);
      const src = this.ctx.createBufferSource(); src.buffer = this.noise; src.loop = true;
      const bp = this.ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = 900 + Math.random()*1400; bp.Q.value = 1.1;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(.0001, st);
      g.gain.linearRampToValueAtTime(this.muted?0:.32, st+.006);
      g.gain.exponentialRampToValueAtTime(.0008, st+.16+Math.random()*.12);
      src.connect(bp).connect(g).connect(this.master);
      src.start(st); src.stop(st+.45);
    }
    if(!this.muted) flash();
  },
  whisper(){                       // 低语：窄带噪声游走，像有人在耳边说话
    if(!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, dur = 1.6;
    const src = this.ctx.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 700; bp.Q.value = 6;
    const g = this.ctx.createGain(); g.gain.value = 0;
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 3.1;
    const lg = this.ctx.createGain(); lg.gain.value = .055;
    lfo.connect(lg).connect(g.gain);
    bp.frequency.setValueAtTime(520, t);
    bp.frequency.linearRampToValueAtTime(980, t+dur);
    src.connect(bp).connect(g).connect(this.master);
    g.gain.linearRampToValueAtTime(.05, t+.4);
    g.gain.linearRampToValueAtTime(0, t+dur);
    src.start(t); lfo.start(t); src.stop(t+dur+.1); lfo.stop(t+dur+.1);
  },
  bell(){                          // 庙钟 / 罄
    if(!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
    o1.type = o2.type = 'sine'; o1.frequency.value = 196; o2.frequency.value = 294;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(.13, t+.01);
    g.gain.exponentialRampToValueAtTime(.0005, t+2.6);
    o1.connect(g); o2.connect(g); g.connect(this.master);
    o1.start(t); o2.start(t); o1.stop(t+2.8); o2.stop(t+2.8);
  },
  toggle(){
    this.muted = !this.muted;
    if(this.master) this.master.gain.value = this.muted ? 0 : .9;
    return this.muted;
  }
};
function flash(){
  const f = document.getElementById('flash');
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}
function startCrackers(){ stopCrackers(); crackerTimer = setInterval(()=>{ if(Math.random()<.6) Audio_.cracker(); }, 2600); }
function stopCrackers(){ if(crackerTimer){ clearInterval(crackerTimer); crackerTimer = null; } }

/* ---------------- 3. 工具 ---------------- */
const $ = s => document.getElementById(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadSave(){ try{ const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/** 祭祀资格判定 —— 原著核心：无论她如何努力，结果恒为 false */
function judgePurity(){
  const reasons = ['再嫁之妇，不洁。','克夫克子，不祥。','败坏风俗，不净。','虽捐门槛，千人踏万人跨，仍不足以赎。'];
  return { ok:false, verdict:reasons[Math.min(S.log.length, reasons.length-1)] };
}
function addFrag(n){ S.frag = Math.min(9, S.frag + (n||1)); }
function markSilent(k){ if(!S.silentMarks[k]){ S.silentMarks[k] = true; S.silentCount++; } }
/** 隐藏结局条件：灵魂之问"说不清" + 终章沉默 + 至少三处沉默 */
function hiddenReady(){ return !!S.silentMarks.m4 && !!S.silentMarks.m5 && S.silentCount >= 3; }

/* 完满路线：六个记号，缺一个都到不了；走错一步，已有的记号也会掉下来 */
function syncPath(){ S.pathCount = Object.keys(S.path).length; }
function markPath(k){
  if(S.path[k]) return;
  S.path[k] = true; syncPath();
  const el = $('pathText');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  save();
}
/** 撤销一个记号——比如听了一半走开了 */
function dropPath(k){
  if(!S.path[k]) return;
  delete S.path[k]; syncPath();
  const el = $('pathText');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  save();
}
function perfectReady(){ return S.pathCount >= 6; }

/* ---------------- 4. 场景节点系统 ----------------
   节点字段：chapter / title / sub / fx[] / text[] / choices[] / game / onEnter
   text 元素为字符串；{q:'...'} 表示原著引文（楷体突出）
   ============================================================ */
const SCENES = {

/* ============ 序章 ============ */

chapter:'序章 · 雪夜归鲁镇', title:'一、鲁镇的年底', sub:'旧历的年底毕竟最像年底',

],
choices:[

]},

prologue_snow:{

text:[
'我拉住一个短工。他先是抬起头，看了我一眼，那眼神里没有悲哀，也没有惊慌，只有一种被年关榨干了的疲惫。',
{q:'“祥林嫂？老了。”'},
{q:'“死了？”我的心突然紧缩，几乎跳起来，脸上大约也变了色。'},
{q:'“什么时候？——昨天夜里，或者就是今天罢。——我说不清。”'},
{q:'“怎么死的？”——“还不是穷死的？”'},
'他淡然的回答，仍然没有抬头向我看，出去了。'
],
choices:[
{label:'追问：她是谁？', to:'prologue_study', act:()=>markPath('p1')},
{label:'不再问，走进书房', to:'prologue_study', act:()=>markSilent('m1')}
]},

prologue_study:{
chapter:'序章 · 雪夜归鲁镇', title:'二、书房', sub:'不早不迟，偏偏要在这时候',
fx:['snow','cracker'],
onEnter:()=>{ Audio_.whisper(); },
text:[
'书房里点着一对红烛。四叔在里间踱步，声音隔着一层板壁传过来，先是一声冷笑，随后是那句——',
{q:'“不早不迟，偏偏要在这时候，——这就可见是一个谬种！”'},
'我先前所见所感的鲁镇，是一个死气沉沉的鲁镇；这一句骂，倒使这死气有了一点活气：因为她死了，才有人需要骂一句。',
'然而我究竟不知道她是谁。她在我记忆里只有一个名字的残片——祥林嫂。这三个字是她丈夫的名字加上一个“嫂”，她自己叫什么，没有人记得。',
'烛火一跳。屋子里有几样旧物，我去看看它们。'
],
game:{type:'study', next:'prologue_who'}},

prologue_who:{
chapter:'序章 · 雪夜归鲁镇', title:'她是谁', sub:'一个没有名字的人',
fx:['snow-heavy'],
onEnter:()=>{ addFrag(1); },
text:[
'我把这些碎片拼在一起：一个女人，死了，在祝福的前夜；一个女人，被骂作谬种；一个女人，连名字都不曾有过。',
{q:'“她么，是祥林的媳妇。祥林死了，她婆婆要她回去，后来就卖到贺家墺去了。——这些事，镇上谁不知道。”'},
'我于是决心要弄清楚这一件事：她怎么活过来的，又是怎么死掉的。',
'然而事情并不像我想的那样有一条线索。她的故事是散的，散在雪地里，散在各人的舌头上，散在我自己不敢细看的记忆中。',
'——那是从前一年的冬初开始的。'
],
choices:[{label:'回到那一年冬初', to:'act1_first'}]},

/* ============ 第一幕 ============ */
act1_first:{
chapter:'第一幕 · 第一次来鲁镇', title:'一、冬初', sub:'她不是鲁镇人',
fx:['snow'],
onEnter:()=>{ addFrag(1); },
text:[
'她不是鲁镇人。有一年的冬初，四叔家里要换女工，做中人的卫老婆子带她进来了。',
'头上扎着白头绳，乌裙，蓝夹袄，月白背心，年纪大约二十六七，脸色青黄，但两颊却还是红的。卫老婆子叫她祥林嫂，说是自己母家的邻舍，死了当家人，所以出来做工了。',
'四叔皱了皱眉，四婶已经知道了他的意思，是在讨厌她是一个寡妇。但是她模样还周正，手脚都壮大，又只是顺着眼，不开一句口，很像一个安分耐劳的人，便不管四叔的皱眉，将她留下了。',
'试工期内，她整天的做，似乎闲着就无聊，又有力，简直抵得过一个男子，所以第三天就定局，每月工钱五百文。'
],
choices:[{label:'年底了，煮福礼的时候到了', to:'act1_fuli'}]},

act1_fuli:{
chapter:'第一幕 · 第一次来鲁镇', title:'二、福礼', sub:'祥林嫂，你放着罢！我来摆。',
fx:['snow','cracker'],
text:[
'年底，扫尘，洗地，杀鸡，宰鹅，彻夜的煮福礼，全是一人担当，竟没有添短工。然而她很满足，口角边渐渐的有了笑影，脸上也白胖了。',
'这是鲁镇年终的大典，致敬尽礼，迎接福神，拜求来年一年中的好运气。杀鸡，宰鹅，买猪肉，用心细细的洗，女人的臂膊都在水里浸得通红，有的还带着绞丝银镯子。',
'煮熟之后，横七竖八的插些筷子在这类东西上，可就称为“福礼”了，五更天陈列起来，并且点上香烛，恭请福神们来享用；拜的却只限于男人。',
'她想去插一双筷子。'
],
game:{type:'fuli', next:'act1_taken'}},

act1_taken:{
chapter:'第一幕 · 第一次来鲁镇', title:'三、被绑走', sub:'这有什么依不依',
fx:['snow-heavy'],
onEnter:()=>{ addFrag(1); },
text:[
'新年才过，她婆婆来了，说是要回去。卫老婆子居中说合，讲定把她嫁进深山，换八十千。',
{q:'“这有什么依不依。——闹是谁也总要闹一闹的；只要用绳子一捆，塞在花轿里，抬到男家，捺上花冠，拜堂，关上房门，就完事了。”'},
'她曾在河岸上反抗过。据说她一路只是嚎，骂，喉咙早哑了，还在骂；抬到男家，捺上花冠，拜堂，关上房门——后来就再没有声音。',
{q:'“她有小叔子，也得娶老婆。不嫁了她，哪有这一注钱来做聘礼？”'},
'我站在廊下，看着花轿拐出巷口。我懂的道理很多：人的解放、礼教的吃人、宗法的罪。然而我站着，什么也没有做。雪落下来，把轿子的印子盖平了。'
],
choices:[
{label:'（追出去）', to:'act1_chase', act:()=>markPath('p2')},
{label:'（站着不动）', to:'act2_hejiaao', act:()=>markSilent('m3a')}
]},

act1_chase:{
chapter:'第一幕 · 第一次来鲁镇', title:'追', sub:'雪盖平了印子',
fx:['snow-heavy'],
text:[
'我追出巷口。雪很大，风把爆竹的纸屑卷到半空，红的，像一群瞎眼的蝴蝶。',
'轿子已经看不见了。地上只剩下两行脚印，一行是抬轿的，一行是跟着走的。',
'我在雪里站了很久。我知道我追不上——不是腿追不上，是我没有理由追。一个读书人，凭什么去拦一桩“本家的事”，凭什么去拦一位“婆婆”？我凭的不过是一点说不清的难堪。',
'那点难堪，后来变成了一辈子的“说不清”。'
],
choices:[{label:'去问卫老婆子：后来呢？', to:'act2_hejiaao'}]},

/* ============ 第二幕 ============ */
act2_hejiaao:{
chapter:'第二幕 · 贺家墺与阿毛', title:'一、交了好运', sub:'她真是交了好运了',
fx:['snow'],
onEnter:()=>{ addFrag(1); },
text:[
'卫老婆子再来的时候，是满脸笑的。她说，祥林嫂真是交了好运了。',
{q:'“她婆婆来抓她回去的时候，是早已许给了贺家墺的贺老六了，所以回家之后不几天，也就装在花轿里抬去了。”'},
'“上头又没有婆婆；男人所有的是力气，会做活；房子是自家的。——唉唉，她真是交了好运气。”',
'我问：后来呢？卫老婆子的笑淡了淡：“后来么？后来——她男人是坚实人，谁知道年纪青青，就会断送在伤寒上？本来已经好了的，吃了一碗冷饭，复发了。幸亏有儿子；她又能做，打柴摘茶养蚕都来得，本来还可以守着，谁知道那孩子又会给狼衔去的呢？”',
'她说完，喝了一口茶，又补上一句：“现在她只剩了一个光身了。大伯来收屋，又赶她。她真是走投无路了，只好来求老主人。”'
],
choices:[{label:'去雪地里找一找那些东西', to:'act2_snow'}]},

act2_snow:{
chapter:'第二幕 · 贺家墺与阿毛', title:'二、雪地寻物', sub:'春天快完了，村上倒反来了狼',
fx:['snow-heavy'],
text:[
'贺家墺在山坳里。那年的雪化了又下，下到春天还没有停。',
'我要找的东西不多：一只小鞋，一只小篮，一点血。它们在雪下面。',
'（这一片都是雪。点开看看雪底下是什么。）'
],
game:{type:'snowfield', next:'act2_amao'}},

act2_amao:{
chapter:'第二幕 · 贺家墺与阿毛', title:'三、阿毛', sub:'我叫，阿毛！',
fx:['snow-heavy'],
onEnter:()=>{ addFrag(1); Audio_.whisper(); },
text:[
'春天快完了，村上倒反来了狼。',
{q:'“我一清早起来就开了门，拿小篮盛了一篮豆，叫我们的阿毛坐在门槛上剥豆去。他是很听话的，我的话句句听；他出去了。”'},
{q:'“我就在屋后劈柴，淘米，米下了锅，要蒸豆。我叫，阿毛！没有应。出去一看，只见豆撒得一地，没有我们的阿毛了。他是不到别家去玩的；各处去一问，果然没有。”'},
{q:'“我急了，央人去寻去。直到下半天，几个人寻到山坳里，看见刺柴上挂着一只他的小鞋。”'},
{q:'“大家都说，完了，怕是遭了狼了。再进去；果然，他躺在草窠里，肚里的五脏已经都给吃空了，可怜他手里还紧紧的捏着那只小篮呢。……”'},
'她于是淌下眼泪来，声音也呜咽了。'
],
choices:[{label:'她又回到鲁镇了', to:'act2_tell1'}]},

act2_tell1:{
chapter:'第二幕 · 贺家墺与阿毛', title:'四、讲（一）', sub:'这故事倒颇有效',
fx:['snow'],
onEnter:()=>{ S.heard++; },
text:[
'她又回到鲁镇，在四叔家做了女工。她开口了，说的永远是同一段。',
{q:'“我真傻，真的，”她说，“我单知道雪天是野兽在深山里没有食吃，会到村里来；我不知道春天也会有。”'},
'这故事倒颇有效。男人听到这里，往往敛起笑容，没趣的走了开去；女人们却不独宽恕了她似的，脸上立刻改换了鄙薄的神气，还要陪出许多眼泪来。有些老女人没有在街头听到她的话，便特意寻来，要听她这一段悲惨的故事。',
'直到她说到呜咽，她们也就一齐流下那停在眼角上的眼泪，叹息一番，满足的去了，一面还纷纷的评论着。'
],
choices:[
{label:'听她讲完', to:'act2_tell2', act:()=>{ markPath('p3'); S.patience=Math.max(0,S.patience-1); }},
{label:'默默走开', to:'act2_tell2', act:()=>{ markSilent('m2'); S.patience=Math.max(0,S.patience-1); }},
{label:'劝她：别再说了', to:'act2_tell2', act:()=>{ S.patience=Math.max(0,S.patience-2); }}
]},

act2_tell2:{
chapter:'第二幕 · 贺家墺与阿毛', title:'四、讲（二）', sub:'后来全镇的人们几乎都能背诵她的话',
fx:['snow'],
onEnter:()=>{ S.heard++; },
text:[
'她反复地说，一字不改。像一张磨坏了的唱片，针落在同一道槽里。',
'后来全镇的人们几乎都能背诵她的话，一听到就烦厌得头痛。',
{q:'“我真傻，真的……”'},
{q:'“是的，你是单知道雪天野兽在深山里没有食吃，才会到村里来的。”他们立即打断她的话，走开去了。'},
'她张着口怔怔的站着，直着眼睛看他们，接着也就走了，似乎自己也觉得没趣。'
],
choices:[
{label:'听她讲完', to:'act2_tell3', act:()=>{ S.patience=Math.max(0,S.patience-1); }},
{label:'默默走开', to:'act2_tell3', act:()=>{ dropPath('p3'); markSilent('m2'); S.patience=Math.max(0,S.patience-1); }},
{label:'替她把话说完（证明你听过了）', to:'act2_tell3', act:()=>{ dropPath('p3'); S.patience=Math.max(0,S.patience-2); }}
]},

act2_tell3:{
chapter:'第二幕 · 贺家墺与阿毛', title:'四、讲（三）', sub:'她的悲哀经大家咀嚼赏鉴了许多天，早已成为渣滓',
fx:['snow-heavy'],
onEnter:()=>{ S.heard++; },
text:[
'她的悲哀经大家咀嚼赏鉴了许多天，早已成为渣滓，只值得烦厌和唾弃；但从人们的笑影上，也仿佛觉得这又冷又尖，她自己再也没有开口的必要了。',
'她单是一瞥他们，并不回答一句话。',
'我还记得那时有人在背后笑：“她那时倒不如早点死了干净。”——说这话的人，后来也照常祝福，照常放爆竹，照常活得很好。',
'于是，她开始想办法。她要自己去买一样东西，一件可以赎罪的东西。'
],
choices:[
{label:'（她不再说了。你仍然站着。）', to:'act3_return'},
{label:'（随众人走开）', to:'act3_return', act:()=>{ dropPath('p3'); markSilent('m2'); S.patience=Math.max(0,S.patience-1); }}
]},

/* ============ 第三幕 ============ */
act3_return:{
chapter:'第三幕 · 捐门槛', title:'一、再来', sub:'四婶起初还踌蹰',
fx:['snow'],
onEnter:()=>{ addFrag(1); },
text:[
'她仍然头上扎着白头绳，乌裙，蓝夹袄，月白背心，脸色青黄，只是两颊上已经消失了血色，顺着眼，眼角上带些泪痕，眼光也没有先前那样精神了。',
'四婶起初还踌蹰，但后来到底还是留下了——因为实在没有一个女工肯做这等的苦活。',
'然而这一回，她的境遇却改变得非常大。上工之后的两三天，主人们就觉得她手脚已没有先前一样灵活，记性也坏得多，死尸似的脸上又整日没有笑影。',
'四婶的口气上，已颇有些不满了。而最要紧的，是祭祀的时候，她不再被允许沾手。'
],
choices:[{label:'柳妈来了', to:'act3_liuma'}]},

act3_liuma:{
chapter:'第三幕 · 捐门槛', title:'二、柳妈', sub:'阎罗大王只好把你锯开来',
fx:['snow'],
onEnter:()=>{ addFrag(1); Audio_.whisper(); },
text:[
'柳妈是个吃素、不杀生的善女人。她把手里的佛珠拨得平平稳稳，先问：“你额角上的伤疤，怎么来的？”',
{q:'“我问你：你那时怎么后来竟依了呢？”——“你到土地庙里去捐一条门槛，当作你的替身，给千人踏，万人跨，赎了这一世的罪名，免得死了去受苦。”'},
{q:'“你将来到阴司去，那两个死鬼的男人还要争，你给了谁好呢？阎罗大王只好把你锯开来，分给他们。”'},
'她脸上就显出恐怖的神色来。这是在山村里所未曾知道的。',
'第二天早上起来的时候，两眼上便都围着大黑圈。'
],
choices:[
{label:'告诉她：这是迷信', to:'act3_money', act:()=>{ markPath('p4'); S.log.push('rational'); }},
{label:'什么也不说', to:'act3_money', act:()=>{ markSilent('m3'); }},
{label:'陪她攒钱', to:'act3_money'}
]},

act3_money:{
chapter:'第三幕 · 捐门槛', title:'三、十二元鹰洋', sub:'她整日紧闭了嘴唇，默默地跑街，扫地，洗菜，淘米',
fx:['snow'],
text:[
'她大约从他们的笑容和声调上，也知道是在嘲笑她，所以总是瞪着眼睛，不说一句话，后来连头也不回了。',
'她整日紧闭了嘴唇，头上带着大家以为耻辱的记号的那伤痕，默默的跑街，扫地，洗菜，淘米。快够一年，她才从四婶手里支取了历来积存的工钱，换算了十二元鹰洋。',
'（替她把钱攒够 —— 需要六回）'
],
game:{type:'money', next:'act3_temple'}},

act3_temple:{
chapter:'第三幕 · 捐门槛', title:'四、土地庙', sub:'给千人踏，万人跨',
fx:['snow-heavy'],
text:[
'请假到镇的西头去，在一座土地庙里，她求神许愿。庙祝起初执意不允许，直到她急得流泪，才勉强答应了。',
'价目是大钱十二千。',
'（把这块“槛”拖到庙门口去。）'
],
game:{type:'temple', next:'act3_carve'}},

act3_carve:{
chapter:'第三幕 · 捐门槛', title:'五、刻字', sub:'捐 / 门 / 槛 / 赎',
fx:['snow'],
onEnter:()=>{ Audio_.bell(); },
text:[
'人捐了，门槛也抬来了。庙祝说，要刻上字，神明才认得清是谁赎的罪。',
'她不识字。她只看着那块暗红的木头发呆，好像看着自己被劈开、刨平、钉在那儿的一生。',
'（替她刻字 —— 一下一下地刻。）'
],
game:{type:'carve', next:'act3_blessing'}},

act3_blessing:{
chapter:'第三幕 · 捐门槛', title:'六、冬至的祭祖时节', sub:'你放着罢，祥林嫂！',
fx:['cracker','snow'],
onEnter:()=>{ addFrag(1); },
text:[
'捐了门槛之后，她便回来，神气很舒畅，眼光也分外有神，高兴似的对四婶说，自己已经在土地庙捐了门槛了。',
'冬至的祭祖时节，她做得更出力，看四婶装好祭品，和阿牛将桌子抬到堂屋中央，她便坦然的去拿酒杯和筷子。',
{q:'“你放着罢，祥林嫂！”四婶慌忙大声说。'},
'她像是受了炮烙似的缩手，脸色同时变作灰黑，也不再去取烛台，只是失神的站着。直到四叔上香的时候，教她走开，她才走开。',
'这一回她的变化非常大，第二天，不但眼睛窈陷下去，连精神也更不济了。而且很胆怯，不独怕暗夜，怕黑影，即使看见人，虽是自己的主人，也总惴惴的，有如在白天出穴游行的小鼠；否则呆坐着，直是一个木偶人。'
],
choices:[
{label:'替她说话', to:'act3_speak', act:()=>markPath('p5')},
{label:'（什么也说不出）', to:'act3_speak', act:()=>markSilent('m3b')}
]},

act3_speak:{
chapter:'第三幕 · 捐门槛', title:'七、没有一个人认为自己在作恶', sub:'各人有各人的道理',
fx:['snow'],
onEnter:()=>{ addFrag(1); },
text:[
'我说：她已经捐了门槛了。四婶看我一眼，像是看一个不懂事的孩子。',

   只给 #bg 换一个 class，画面由 CSS 渐变过渡，不影响任何排版

  prologue_study:'study', prologue_who:'study',
  act1_first:'town', act1_fuli:'bless', act1_taken:'snowfield', act1_chase:'snowfield',

  end_write:'study', end_burn:'snowfield', end_silence:'bless',
  end_shuoBuQing:'blank', end_perfect:'dawn'
};
function setBg(sceneId){
  const el = $('bg');
  if(!el) return;
  const b = BG_MAP[sceneId] || 'town';
  if(el.className !== b) el.className = b;   // 换 class，CSS 负责 1s 渐变
}

/* ---------------- 5. 打字机 ---------------- */
function typeBox(paras, done){
  const box = $('textBox');
  box.innerHTML = '';
  typing = true;
  let pi = 0, ci = 0, cur = null;

  function nextP(){
    if(pi >= paras.length){
      typing = false;
      cur && cur.lastChild && cur.lastChild.remove();
      done && done();
      return;
    }
    const item = paras[pi];
    cur = document.createElement('p');
    if(typeof item === 'object') cur.className = 'quote';
    const span = document.createElement('span');
    const caret = document.createElement('span');
    caret.className = 'cursor'; caret.textContent = '　';
    cur.appendChild(span); cur.appendChild(caret);
    box.appendChild(cur);
    ci = 0; step();

    function step(){
      const text = (typeof item === 'object') ? item.q : item;
      if(ci < text.length){
        span.textContent += text[ci++];
        typeTimer = setTimeout(step, 15);
      }else{
        pi++;
        typeTimer = setTimeout(nextP, 230);
      }
    }
  }
  nextP();
}
function skipTyping(){
  if(!typing) return;
  clearTimeout(typeTimer); typing = false;
  const sc = SCENES[S.scene]; if(!sc) return;
  const box = $('textBox'); box.innerHTML = '';
  (sc.text||[]).forEach(it=>{
    const p = document.createElement('p');
    if(typeof it === 'object'){ p.className = 'quote'; p.textContent = it.q; }
    else p.textContent = it;
    box.appendChild(p);
  });
  afterText(sc);
}

/* ---------------- 6. 场景调度 ---------------- */
function goto(id){
  const sc = SCENES[id];
  if(!sc){ console.warn('缺少场景', id); return; }
  S.scene = id; S.seen[id] = true; save();
  stopCrackers();

  // 氛围
  const fx = sc.fx || [];
  setBg(id);
  setSnow(fx.indexOf('snow-heavy') >= 0 ? 'heavy' : (fx.indexOf('snow') >= 0 ? 'normal' : 'calm'));
  if(fx.indexOf('cracker') >= 0) startCrackers();

  $('chapText').textContent = sc.chapter || '';
  $('fragText').textContent = '碎片 ' + S.frag + '/9';
  $('pathText').textContent = '念 ' + S.pathCount + '/6';

  sc.onEnter && sc.onEnter();

  $('sceneTitle').textContent = sc.title || '';
  $('sceneSub').textContent = sc.sub || '';
  $('stage').innerHTML = '';
  $('choices').innerHTML = '';
  renderStatus();

  if(sc.ending) return renderEnding(sc);

  $('start').style.display = 'none';
  $('game').style.display = 'block';
  $('ending').style.display = 'none';
  typeBox(sc.text || [], ()=>afterText(sc));
}
function afterText(sc){
  if(sc.game){
    const key = S.scene;
    if(S.mg[key]) return showContinue(sc.game.next);
    renderGame(sc.game, ()=>{ S.mg[key] = true; save(); showContinue(sc.game.next); });
  }else{
    showChoices(sc.choices || []);
  }
}
function showContinue(to){
  const c = $('choices'); c.innerHTML = '';
  const b = document.createElement('button');
  b.className = 'choice'; b.textContent = '（继续）';
  b.onclick = ()=>goto(to);
  c.appendChild(b);
}
function showChoices(list){
  const c = $('choices'); c.innerHTML = '';
  if(typeof list === 'function') list = list();   // 终章按条件生成选项
  (list || []).forEach(ch=>{
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = ch.label;
    b.onclick = ()=>{
      ch.act && ch.act();
      const to = (typeof ch.to === 'function') ? ch.to() : ch.to;
      save(); goto(to);
    };
    c.appendChild(b);
  });
}
/* 状态条：耐心值 + 祭祀资格（恒 false） */
function renderStatus(){
  const st = $('status'); st.innerHTML = '';
  if(S.scene.indexOf('act2_tell') === 0 || S.scene === 'act2_amao'){
    const d = document.createElement('div'); d.className = 'bar';
    const pct = Math.round(S.patience / 5 * 100);
    d.innerHTML = '<span>众人耐心</span><span class="track"><span class="fill' +
      (S.patience <= 2 ? ' low' : '') + '" style="width:' + pct + '%"></span></span><span>' + S.patience + '/5</span>';
    st.appendChild(d);
  }
  if(S.scene.indexOf('act1_fuli') === 0 || S.scene.indexOf('act3') === 0){
    const j = judgePurity();
    const d = document.createElement('div'); d.className = 'bar';
    d.innerHTML = '<span>祭祀资格</span><span class="verdict">' + j.verdict + '</span>';
    st.appendChild(d);
  }
}

/* ---------------- 7. 小游戏（全部以字代物） ---------------- */
function renderGame(g, onDone){
  const stage = $('stage');
  stage.innerHTML = '';
  const tip = document.createElement('div'); tip.className = 'stageTip'; stage.appendChild(tip);
  const msg = document.createElement('div'); stage.appendChild(msg);
  const fn = GAMES[g.type];
  if(!fn){ onDone(); return; }     // 未知小游戏：直接放行，绝不卡关
  fn(stage, tip, msg, onDone);
}
/** 生成一枚字牌：g=大字，n=小注 */
function tile(g, n, extraClass){
  const el = document.createElement('div');
  el.className = 'thing' + (extraClass ? ' ' + extraClass : '');
  el.innerHTML = '<span class="g">' + g + '</span><span class="n">' + n + '</span>';
  return el;
}

const GAMES = {

  /* --- 书房：四件旧物，每件就是一枚字牌 --- */
  study(stage, tip, msg, onDone){
    tip.textContent = '（书房里还剩几样旧东西 —— 至少看两样）';
    const grid = document.createElement('div'); grid.className = 'things'; stage.appendChild(grid);
    const items = [
      {g:'福', n:'朱红大“福”字',
       mem:'香案上方那个朱红的“福”字，年年新贴，年年一样。鲁镇人相信，只要字贴得端正，福神就会来。——她死的那一夜，字刚贴上，浆糊还没干。'},
      {g:'烛', n:'一对红烛',
       mem:'红烛的泪积成一小堆。烛火一跳，照见四叔的脸：不怒，不悲，只是不耐烦。他嫌她死得不是时候，坏了年下的规矩。'},
      {g:'迹', n:'雪地脚印',
       mem:'窗外雪地上一行脚印，从角门出去，一直通到河边，又折回来——不，没有折回来。只有去的那一行。'},
      {g:'篮', n:'旧竹篮',
       mem:'一只破空的竹篮，一只比她更破空的碗。竹篮还是去年那只，碗却早裂了口。她提着它，在鲁镇走了三年。'}
    ];
    let found = 0;
    items.forEach(it=>{
      const el = tile(it.g, it.n);
      grid.appendChild(el);
      el.onclick = ()=>{
        if(el.classList.contains('done')) return;
        el.classList.add('done'); found++; addFrag(1); save();
        const m = document.createElement('div'); m.className = 'mem'; m.textContent = it.mem;
        stage.insertBefore(m, msg);
        Audio_.whisper();
        if(found >= 2){
          tip.textContent = '碎片够了。烛火又跳了一下。';
          setTimeout(onDone, 500);
        }
      };
    });
  },

  /* --- 福礼：把供品一字字摆上供桌；让她来摆则被拦 --- */
  fuli(stage, tip, msg, onDone){
    tip.textContent = '（先把福礼摆上供桌；也可以试着让她来摆）';
    const goods = ['鸡','鹅','鱼','肉','酒','饭'];
    const bar = document.createElement('div'); bar.className = 'offerBar'; stage.appendChild(bar);
    const wrap = document.createElement('div'); stage.appendChild(wrap);
    const line = document.createElement('div'); line.className = 'table tableLine'; line.textContent = '　';
    wrap.appendChild(line);

    let placed = 0, blocked = 0, fin = false;
    function finish(){
      if(fin) return;              // 防止重复触发导致连跳两次
      fin = true;
      bar.querySelectorAll('button').forEach(b=>b.classList.add('used'));
      const j = judgePurity();
      msg.innerHTML = '<div class="mem">她把手收了回去，站在灶边，看别人把筷子插上。' +
        '祭祀资格判定：<span style="color:#b8453c">' + j.verdict + '</span>（系统判定：' + (j.ok ? '洁净' : '不洁净') + '）</div>';
      setTimeout(onDone, 1100);
    }
    goods.forEach(gd=>{
      const b = document.createElement('button'); b.textContent = gd;
      b.onclick = ()=>{
        b.classList.add('used'); placed++;
        line.textContent = goods.slice(0, placed).join('　');
        Audio_.cracker();
        if(placed >= 6 || (placed >= 3 && blocked >= 1)) finish();
      };
      bar.appendChild(b);
    });
    const sb = document.createElement('button');
    sb.className = 'she'; sb.textContent = '让祥林嫂来摆';
    sb.onclick = ()=>{
      blocked++;
      const lines = [
        '“祥林嫂，你放着罢！我来摆。”——四婶',
        '“祥林嫂，你放着罢！我来摆。”——四婶，又慌忙大声说',
        '“你放着罢，祥林嫂！”——四婶慌忙大声说'
      ];
      msg.innerHTML = '<div class="blocked">' + lines[Math.min(blocked-1, 2)] + '</div>';
      Audio_.whisper();
      if(placed >= 3 && blocked >= 1) finish();
    };
    bar.appendChild(sb);
  },

  /* --- 雪地：一整片「雪」字，三样东西藏在字里 --- */
  snowfield(stage, tip, msg, onDone){
    tip.textContent = '（这一片都是“雪”。点开看看雪底下是什么。）';
    const field = document.createElement('div'); field.className = 'snowfield'; stage.appendChild(field);
    const note = document.createElement('div'); note.className = 'note'; stage.appendChild(note);

    const TOTAL = 24;
    const targets = [
      {g:'履', n:'小鞋',  mem:'刺柴上挂着一只他的小鞋。鞋帮上还沾着泥，鞋口朝下，空空的。'},
      {g:'血', n:'一点血', mem:'草窠里有一小片黑。雪盖了半边，另外半边冻住了，是褐色的。——那是阿毛的。'},
      {g:'篮', n:'小篮',  mem:'他躺在草窠里，肚里的五脏已经都给吃空了，手里还紧紧的捏着那只小篮呢。'}
    ];
    // 三个目标随机撒进 24 格
    const pos = [];
    while(pos.length < 3){
      const p = Math.floor(Math.random() * TOTAL);
      if(pos.indexOf(p) < 0) pos.push(p);
    }
    const blanks = ['雪下只有雪。','手指冻得发麻，什么也没有。','雪片落进袖口，凉。',
      '扒开一层，底下还是一层。','一只冻僵的蚂蚱，别的没有。'];
    let swept = 0, found = 0, bi = 0;

    for(let i=0;i<TOTAL;i++){
      const idx = pos.indexOf(i);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = '雪';
      cell.onclick = ()=>{
        if(idx >= 0){
          const t = targets[idx];
          cell.classList.add('real'); cell.textContent = t.g; cell.title = t.n;
          found++; addFrag(1); save();
          const m = document.createElement('div'); m.className = 'mem';
          m.innerHTML = '<b style="color:#ffe9b8">' + t.g + '　' + t.n + '</b><br>' + t.mem;
          stage.insertBefore(m, msg);
          Audio_.whisper();
        }else{
          cell.classList.add('swept'); swept++;
          note.textContent = blanks[bi++ % blanks.length] + '（已扫开 ' + swept + '/' + (TOTAL-3) + '）';
        }
        if(found >= 3){
          field.querySelectorAll('.cell:not(.real)').forEach(c=>c.classList.add('swept'));
          note.textContent = '三样都在了。';
          const t = document.createElement('div'); t.className = 'mem';
          t.textContent = '春天，狼叼走了阿毛。她说的每一个字都是真的，只是没有人再愿意听。';
          stage.insertBefore(t, msg);
          setTimeout(onDone, 1200);
        }
      };
      field.appendChild(cell);
    }
    note.textContent = '雪很深。三样东西埋在里面。';
  },

  /* --- 攒钱：六回工钱，凑十二元鹰洋 --- */
  money(stage, tip, msg, onDone){
    tip.textContent = '（她默默的跑街，扫地，洗菜，淘米）';
    const box = document.createElement('div');
    box.style.cssText = 'font-size:13.5px;color:#c8d2d6';
    box.innerHTML = '历年积存的工钱　<b id="mnum" style="color:#c8a86b">0</b> / 12 元鹰洋';
    stage.appendChild(box);
    const tally = document.createElement('div'); tally.className = 'tally'; stage.appendChild(tally);
    for(let i=0;i<6;i++){ const s = document.createElement('span'); tally.appendChild(s); }

    const btn = document.createElement('button');
    btn.className = 'choice'; btn.style.marginTop = '12px';
    btn.textContent = '再干一阵活（+2 元）';
    btn.onclick = ()=>{
      if(S.money >= 12) return;
      S.money += 2;
      $('mnum').textContent = Math.min(12, S.money);
      const seg = tally.children[Math.floor((S.money-1)/2)];
      if(seg) seg.classList.add('on');
      Audio_.cracker();
      if(S.money >= 12){
        btn.remove();
        msg.innerHTML = '<div class="mem">快够一年，她才从四婶手里支取了历来积存的工钱，换算了十二元鹰洋。' +
          '她把这钱用手巾包了又包，藏在贴身的地方。她以为这是买命的钱。</div>';
        setTimeout(onDone, 1200);
      }
    };
    stage.appendChild(btn);
  },

  /* --- 土地庙：把「槛」拖到庙门口 --- */
  temple(stage, tip, msg, onDone){
    tip.textContent = '（按住这块“槛”，拖到庙门口去）';
    const row = document.createElement('div'); row.className = 'templeRow'; stage.appendChild(row);
    const gate = document.createElement('div'); gate.className = 'gate';
    gate.innerHTML = '<span class="big">庙</span>庙　门　口';
    const beam = document.createElement('div'); beam.className = 'beam'; beam.textContent = '槛';
    row.appendChild(gate); row.appendChild(beam);

    function succeed(){
      if(beam.classList.contains('locked')) return;
      beam.classList.add('locked');
      gate.classList.remove('hot'); gate.classList.add('done');
      gate.innerHTML = '<span class="big">门</span>已　捐';
      if(alt) alt.remove();
      Audio_.bell();
      msg.innerHTML = '<div class="mem">门槛横在庙门口了。她想：从今往后，千人踏，万人跨，我的罪就算赎了。' +
        '——她不知道，门槛是木头，人是人；木头替不了人。</div>';
      setTimeout(onDone, 1200);
    }
    // 拖拽
    let dragging = false;
    beam.addEventListener('pointerdown', e=>{
      dragging = true;
      try{ beam.setPointerCapture(e.pointerId); }catch(err){}
    });
    beam.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const r = gate.getBoundingClientRect();
      const hot = e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom;
      gate.classList.toggle('hot', hot);
    });
    const up = e=>{
      if(!dragging) return;
      dragging = false;
      const r = gate.getBoundingClientRect();
      if(e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) succeed();
      else gate.classList.remove('hot');
    };
    beam.addEventListener('pointerup', up);
    beam.addEventListener('pointercancel', up);

    // 兜底：拖不动就点，绝不卡关
    const alt = document.createElement('button');
    alt.className = 'mini'; alt.style.cssText = 'display:block;margin:14px auto 0';
    alt.textContent = '（拖不动？点此把门槛抬过去）';
    alt.onclick = succeed;
    stage.appendChild(alt);
  },

  /* --- 刻字：在门槛上一下一下刻出四个字 --- */
  carve(stage, tip, msg, onDone){
    tip.textContent = '（一下一下地刻）';
    const row = document.createElement('div'); row.className = 'templeRow'; stage.appendChild(row);
    const eng = document.createElement('div'); eng.className = 'engraved'; stage.appendChild(eng);
    const beam = tile('槛', '门　槛', '');
    beam.style.minWidth = '110px'; beam.style.cursor = 'pointer';
    row.appendChild(beam);

    const chars = ['捐','门','槛','赎'];
    let i = 0;
    beam.onclick = ()=>{
      if(i >= chars.length) return;
      const b = document.createElement('b'); b.textContent = chars[i++];
      eng.appendChild(b);
      Audio_.bell();
      if(i >= chars.length){
        beam.classList.add('done'); beam.onclick = null;
        msg.innerHTML = '<div class="mem">字刻好了：捐、门、槛、赎。她不认得这四个字，但她相信它们。' +
          '她如同脱了枷锁，眼里有了光——那光只亮了一天。</div>';
        setTimeout(onDone, 1200);
      }
    };
  }
};

/* ---------------- 8. 结局 ---------------- */
function renderEnding(sc){
  stopCrackers();
  $('start').style.display = 'none';
  $('game').style.display = 'none';
  $('ending').style.display = 'block';
  window.scrollTo(0, 0);

  const hid = !!sc.hidden || (hiddenReady() && (S.scene === 'end_silence' || S.scene === 'end_shuoBuQing'));
  const body = $('endBody'); body.innerHTML = '';
  const foot = $('endFoot'); foot.classList.remove('snowed');
  $('ending').classList.remove('onWhite');

  /* ---- 完满结局：天要亮了，你替她取一个名字 ---- */
  if(sc.perfect){
    $('endTitle').textContent = sc.title;
    $('endTag').textContent = sc.sub;
    $('veil').classList.remove('on');
    (sc.text||[]).forEach(t=>{
      const p = document.createElement('p');
      p.textContent = (typeof t === 'object') ? t.q : t;
      body.appendChild(p);
    });
    const ask = document.createElement('div'); ask.className = 'nameAsk';
    ask.textContent = '我在第一行写下——';
    const line = document.createElement('div'); line.className = 'nameLine';
    line.innerHTML = '<span>她　叫</span><input id="nameInput" maxlength="8" placeholder="　　" ' +
      'autocomplete="off" spellcheck="false" aria-label="替她取一个名字">';
    const echo = document.createElement('div'); echo.className = 'q echoQ';
    body.appendChild(ask); body.appendChild(line); body.appendChild(echo);

    const input = line.querySelector('#nameInput');
    const say = n => {
      echo.textContent = n
        ? '而我在纸上，叫了她一声：' + n + '。'
        : '而我在纸上，迟迟没有落下这一声。';
    };
    input.value = S.givenName || '';
    say(S.givenName || '');
    input.addEventListener('input', ()=>{
      S.givenName = input.value.trim();
      say(S.givenName);
      save();
    });
    setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 600);
    save();
    return;
  }

  if(hid){
    $('endTitle').textContent = '说 不 清';
    $('endTag').textContent = '隐 藏 结 局';
    (sc.text||[]).forEach(t=>{
      const p = document.createElement('p');
      p.textContent = (typeof t === 'object') ? t.q : t;
      body.appendChild(p);
    });
    const q = document.createElement('div'); q.className = 'bigQuestion'; q.textContent = '她 叫 什 么 ？';
    const s = document.createElement('div');
    s.style.cssText = 'text-align:center;font-size:12.5px;color:#7d888d;letter-spacing:.2em;margin-top:14px';
    s.textContent = '（雪落下来，盖住了所有选项）';
    body.appendChild(q); body.appendChild(s);
    $('veil').classList.add('on');
    $('ending').classList.add('onWhite');     // 雪幕升起后转墨色，保证可读
    setTimeout(()=>foot.classList.add('snowed'), 900);
    setSnow('heavy');
  }else{
    $('veil').classList.remove('on');
    $('endTitle').textContent = sc.title;
    $('endTag').textContent = sc.sub || '';
    (sc.text||[]).forEach(t=>{
      if(typeof t === 'object'){
        const q = document.createElement('div'); q.className = 'q'; q.textContent = t.q; body.appendChild(q);
      }else{
        const p = document.createElement('p'); p.textContent = t; body.appendChild(p);
      }
    });
    const map = {a:'你最后记住的，是她的恐惧。',b:'你最后记住的，是她的追问。',
                 c:'你最后记住的，是她眼里熄灭的光。',d:'你最后记住的，是一片空白。'};
    if(S.soul && map[S.soul]){
      const tail = document.createElement('div'); tail.className = 'q'; tail.textContent = map[S.soul];
      body.appendChild(tail);
    }
    if(S.silentCount >= 3){
      const w = document.createElement('div');
      w.style.cssText = 'text-align:center;margin-top:24px;font-family:var(--kai);color:#8b969c;font-size:13.5px;letter-spacing:.28em;opacity:.75';
      w.textContent = '（你始终没有说清。她叫什么？）';
      body.appendChild(w);
    }
    // 烧掉：雪渐渐盖住一切
    if(sc.title.indexOf('烧') >= 0){
      $('veil').classList.add('on');
      $('ending').classList.add('onWhite');
      setSnow('heavy');
    }
  }
  save();
}

/* ---------------- 9. 界面按钮 ---------------- */
function clearVeil(){
  $('veil').classList.remove('on');
  $('ending').classList.remove('onWhite');
  $('endFoot').classList.remove('snowed');
  setBg('town');
}
function showStart(){
  stopCrackers();
  clearVeil();
  $('start').style.display = 'flex';
  $('game').style.display = 'none';
  $('ending').style.display = 'none';
  $('btnContinue').style.display = loadSave() ? 'block' : 'none';
}
function beginNew(){ clearSave(); S = freshState(); Audio_.startAmbient(); save(); goto(S.scene); }
function beginContinue(){ S = loadSave() || freshState(); Audio_.startAmbient(); goto(S.scene); }
function backToTitle(){ if(confirm('回到标题？当前进度会保留。')) showStart(); }
function restart(){
  if(!confirm('重新开始？当前进度将被清空。')) return;
  clearSave(); clearVeil(); S = freshState(); goto(S.scene);
}

$('btnNew').onclick = beginNew;
$('btnContinue').onclick = beginContinue;
$('btnRestart').onclick = restart;
$('btnBack').onclick = backToTitle;
$('btnBack2').onclick = ()=>{ clearVeil(); showStart(); };
$('btnAgain').onclick = ()=>{ clearSave(); clearVeil(); S = freshState(); goto('prologue_arrive'); };
$('btnSkip').onclick = skipTyping;
$('btnMute').onclick = ()=>{
  Audio_.ensure();
  $('btnMute').textContent = Audio_.toggle() ? '声音：关' : '声音：开';
};
/* 点正文也能跳过打字 */
$('textBox').addEventListener('click', ()=>{ if(typing) skipTyping(); });

/* 首次交互后启动音频（浏览器自动播放策略） */
document.addEventListener('pointerdown', function once(){
  Audio_.startAmbient();
  document.removeEventListener('pointerdown', once);
});

/* 启动 */
S = loadSave() || freshState();
showStart();
</script>
