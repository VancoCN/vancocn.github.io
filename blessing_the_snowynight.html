<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>祝福：雪夜问魂</title>
<style>
/* ==========================================================
   《祝福：雪夜问魂》 —— 木刻版画风格 视觉小说 + 轻解谜
   全部视觉由 CSS / SVG / Canvas 绘制，无外部依赖
   ========================================================== */

/* ---------- 基础与配色 ---------- */
:root{
  --ink:#0a0f13;            /* 夜色 */
  --ink2:#131c22;           /* 次夜色 */
  --snow:#dfe6e8;           /* 雪白 */
  --paper:rgba(226,220,206,.10);  /* 宣纸 */
  --paper2:rgba(226,220,206,.16);
  --red:#8e2b2b;            /* 暗红（福字 / 门槛） */
  --red2:#b8453c;           /* 亮一点的红 */
  --gold:#c8a86b;           /* 烛光 */
  --grey:#8b969c;           /* 灰蓝 */
  --line:rgba(142,43,43,.55);
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC","WenQuanYi Micro Hei",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",var(--serif);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;padding:0;
  background:
    radial-gradient(120% 90% at 50% 0%, #1b262d 0%, #0d1418 55%, #060a0c 100%);
  color:var(--snow);
  font-family:var(--serif);
  font-size:16px;line-height:1.95;
  overflow-x:hidden;
  letter-spacing:.02em;
}
/* 木刻噪点质感：用重复渐变模拟刻痕 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.35;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.020) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1px, transparent 1px 4px);
  mix-blend-mode:overlay;
}
/* 暗角 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(80% 70% at 50% 45%, transparent 40%, rgba(0,0,0,.72) 100%);
}

/* ---------- 雪（Canvas） ---------- */
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}

/* ---------- 爆竹闪光 ---------- */
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(60% 50% at 70% 20%, #ffd9a8 0%, rgba(255,120,60,.25) 40%, transparent 70%);}
#flash.on{animation:flash .5s ease-out;}
@keyframes flash{0%{opacity:0}12%{opacity:.75}100%{opacity:0}}

/* ---------- 布局 ---------- */
#app{position:relative;z-index:4;max-width:820px;margin:0 auto;padding:18px 16px 60px;min-height:100vh;display:flex;flex-direction:column;}

/* 顶部条 */
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;margin-bottom:14px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:2px;backdrop-filter:blur(3px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.35);
  font-size:13px;color:#b9c4c8;
}
.topbar .chap{color:var(--gold);letter-spacing:.12em;}
.topbar .sp{flex:1}
.mini{
  font-family:var(--serif);cursor:pointer;
  background:transparent;border:1px solid var(--line);color:#c9d2d5;
  padding:3px 9px;border-radius:2px;font-size:12.5px;letter-spacing:.08em;
  transition:.18s;
}
.mini:hover{background:rgba(142,43,43,.28);color:#fff;border-color:var(--red2);}
.mini:active{transform:translateY(1px)}
.frag{color:var(--red2);}

/* ---------- 开始界面 ---------- */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;gap:26px;min-height:78vh;position:relative;}
.vtitle{
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:clamp(30px,7.2vw,50px);letter-spacing:.16em;
  color:#e9eef0;font-weight:600;line-height:1.15;
  text-shadow:0 0 24px rgba(180,70,60,.45), 2px 2px 0 #000;
  padding:14px 10px;border-right:2px solid var(--red);border-left:2px solid var(--red);
}
.vsub{writing-mode:vertical-rl;text-orientation:upright;font-size:14px;color:var(--grey);letter-spacing:.3em;height:210px;}
.startbtns{display:flex;flex-direction:column;gap:12px;width:min(320px,80vw);}
.btn{
  font-family:var(--serif);cursor:pointer;width:100%;
  background:linear-gradient(180deg, rgba(142,43,43,.30), rgba(142,43,43,.10));
  border:1px solid var(--red);color:#f0e9e0;
  padding:13px 18px;font-size:17px;letter-spacing:.24em;border-radius:2px;
  transition:.22s;position:relative;overflow:hidden;
}
.btn:hover{background:linear-gradient(180deg, rgba(184,69,60,.45), rgba(142,43,43,.2));box-shadow:0 0 18px rgba(142,43,43,.45);letter-spacing:.32em;}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(226,220,206,.05);border-color:rgba(200,200,200,.28);}
.btn.ghost:hover{background:rgba(226,220,206,.13);box-shadow:none;}
.startnote{font-size:12.5px;color:#6f7a80;max-width:520px;line-height:2;letter-spacing:.06em;}
.seal{
  width:52px;height:52px;border:2px solid var(--red);color:var(--red2);
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1.1;
  writing-mode:vertical-rl;border-radius:2px;opacity:.85;transform:rotate(-4deg);
  font-family:var(--kai);
}

/* ---------- 游戏主面板 ---------- */
#game{display:none;}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:2px;
  backdrop-filter:blur(4px);box-shadow:inset 0 0 60px rgba(0,0,0,.4), 0 6px 30px rgba(0,0,0,.4);
  padding:22px 22px 20px;position:relative;
}
.panel::before,.panel::after{
  content:"";position:absolute;width:14px;height:14px;border:1px solid var(--red);opacity:.8;
}
.panel::before{left:6px;top:6px;border-right:0;border-bottom:0;}
.panel::after{right:6px;bottom:6px;border-left:0;border-top:0;}
.sceneTitle{
  font-size:15px;color:var(--gold);letter-spacing:.3em;margin:0 0 4px;
}
.sceneSub{font-size:12.5px;color:#7d888d;letter-spacing:.16em;margin:0 0 16px;}
.textBox{min-height:190px;font-size:16.5px;line-height:2.15;color:#e3e8ea;}
.textBox p{margin:0 0 14px;text-indent:2em;}
.textBox p.noindent{text-indent:0;}
.textBox em{color:var(--red2);font-style:normal;}
.textBox .quote{
  display:block;text-indent:0;color:#f0d9b0;font-family:var(--kai);font-size:17.5px;
  border-left:2px solid var(--red);padding:4px 0 4px 14px;margin:12px 0 16px;
  background:linear-gradient(90deg, rgba(142,43,43,.14), transparent 70%);
}
.cursor{display:inline-block;width:9px;background:var(--red2);animation:blink .8s steps(1) infinite;color:transparent;}
@keyframes blink{50%{opacity:0}}

/* ---------- 选项 ---------- */
#choices{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
.choice{
  font-family:var(--serif);text-align:left;cursor:pointer;
  background:rgba(226,220,206,.055);border:1px solid rgba(226,220,206,.18);
  color:#dfe6e8;padding:12px 16px;font-size:15.5px;line-height:1.75;border-radius:2px;
  transition:.2s;position:relative;padding-left:34px;
}
.choice::before{
  content:"○";position:absolute;left:13px;top:12px;color:var(--red2);font-size:13px;
}
.choice:hover{background:rgba(142,43,43,.22);border-color:var(--red);transform:translateX(4px);}
.choice:active{transform:translateX(4px) translateY(1px)}
.choice.locked{opacity:.4;pointer-events:none;filter:grayscale(1);}

/* ---------- 状态条（耐心 / 洁净） ---------- */
.status{
  display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 2px;font-size:12.5px;color:#8e999e;
  border-top:1px dashed rgba(226,220,206,.14);padding-top:10px;
}
.bar{display:flex;align-items:center;gap:7px;}
.bar .track{width:96px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;}
.bar .fill{height:100%;background:linear-gradient(90deg,#6d7f88,#c8d2d6);width:60%;transition:width .5s;}
.bar .fill.low{background:linear-gradient(90deg,#8e2b2b,#b8453c);}
.verdict{color:var(--red2);letter-spacing:.1em;}

/* ---------- 小游戏舞台 ---------- */
#stage{margin-top:18px;border-top:1px dashed rgba(226,220,206,.18);padding-top:16px;}
.stageTip{font-size:13px;color:#8e999e;letter-spacing:.1em;margin-bottom:12px;}
.stageArea{
  position:relative;height:250px;border:1px solid rgba(226,220,206,.16);border-radius:2px;
  background:
    linear-gradient(180deg, rgba(20,28,34,.55), rgba(8,12,15,.75)),
    repeating-linear-gradient(-14deg, rgba(255,255,255,.03) 0 2px, transparent 2px 7px);
  overflow:hidden;touch-action:none;
}
.stageArea .ground{
  position:absolute;left:0;right:0;bottom:0;height:64px;
  background:linear-gradient(180deg,#cfd8dc 0%, #9fb0b6 100%);
  clip-path:polygon(0 26%, 14% 12%, 30% 22%, 48% 8%, 66% 20%, 84% 10%, 100% 24%, 100% 100%, 0 100%);
  opacity:.85;
}
.stageArea .ground::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 4px);
}

/* 可点击物件 */
.obj{
  position:absolute;cursor:pointer;transition:.25s;text-align:center;
  font-size:12px;color:#c8d2d6;letter-spacing:.1em;
}
.obj .glyph{
  display:block;width:100%;height:100%;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));
  transition:.25s;
}
.obj:hover .glyph{transform:translateY(-4px) scale(1.05);filter:drop-shadow(0 0 12px rgba(200,168,107,.6));}
.obj.done{opacity:.5;pointer-events:none;}
.obj.done .glyph{filter:none;}
.obj .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-16px;white-space:nowrap;font-size:11px;color:var(--gold);}
.hint{position:absolute;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle, rgba(255,255,255,.22), transparent 65%);
  animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.35);opacity:.9}}

/* 供品 / 福礼 */
.fuliBar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.fuliBar button{
  font-family:var(--serif);cursor:pointer;background:rgba(226,220,206,.06);
  border:1px solid rgba(226,220,206,.2);color:#e3e8ea;padding:7px 12px;font-size:14px;border-radius:2px;transition:.2s;
}
.fuliBar button:hover{background:rgba(142,43,43,.25);border-color:var(--red);}
.fuliBar button.used{opacity:.32;pointer-events:none;text-decoration:line-through;}
.fuliBar button.she{background:rgba(142,43,43,.3);border-color:var(--red2);}
#table{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:78%;height:96px;}
#table .top{position:absolute;left:0;right:0;top:0;height:12px;background:#5b3a22;border-top:1px solid #8a5a33;}
#table .leg{position:absolute;top:12px;width:8px;height:74px;background:#4a2f1c;}
#table .leg.l{left:12px}#table .leg.r{right:12px}
.placed{position:absolute;bottom:14px;font-size:12px;color:#e8dcc4;text-align:center;transition:.4s;}
.placed .g{display:block;font-size:22px;line-height:1.1}

/* 门槛拖拽 */
#temple{position:absolute;right:6%;top:32px;width:150px;height:130px;}
#dropzone{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:132px;height:34px;
  border:2px dashed rgba(226,220,206,.35);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#8e999e;letter-spacing:.1em;}
#dropzone.hot{border-color:var(--gold);background:rgba(200,168,107,.12);color:var(--gold);}
#beam{position:absolute;left:16px;top:150px;width:120px;height:22px;cursor:grab;
  background:linear-gradient(180deg,#7d2b26,#4e1a17);border:1px solid #2c0f0d;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#e6cfb0;letter-spacing:.2em;
  box-shadow:0 4px 10px rgba(0,0,0,.6);touch-action:none;z-index:6;}
#beam.dragging{cursor:grabbing;box-shadow:0 8px 22px rgba(0,0,0,.8);}
#beam.locked{left:50%;transform:translateX(-50%);top:auto;bottom:42px;cursor:default;border-color:var(--gold);}
#beam .ch{letter-spacing:0;font-family:var(--kai);font-size:13px;color:#f0d9b0;}

/* 攒钱 */
.coinbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#c8d2d6;}
.coins{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6dcc0,#9a8a63);
  border:1px solid #6b5c3c;box-shadow:0 1px 3px rgba(0,0,0,.6);animation:coinin .4s ease-out;}
@keyframes coinin{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* 刻字 */
#carveTarget{cursor:pointer;transition:.3s;}
#carveTarget:hover{filter:drop-shadow(0 0 10px rgba(200,168,107,.7))}
#carveTarget.done{cursor:default}

/* 烛火 */
.candle{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:60px;height:110px;}
.flame{position:absolute;left:50%;top:-14px;margin-left:-7px;width:14px;height:26px;
  background:radial-gradient(60% 40% at 50% 80%, #fff2c0 0%, #ffb347 45%, rgba(184,69,60,0) 78%);
  border-radius:50% 50% 45% 45%;animation:flick 1.7s infinite ease-in-out;filter:blur(.4px);}
@keyframes flick{0%,100%{transform:scale(1) translateY(0);opacity:.95}25%{transform:scale(1.08,.94) translateY(-1px);opacity:1}50%{transform:scale(.94,1.08)}75%{transform:scale(1.05,.97)}}
.glow{position:absolute;left:50%;top:-40px;margin-left:-90px;width:180px;height:120px;
  background:radial-gradient(circle, rgba(255,180,90,.28), transparent 68%);animation:flick 2.1s infinite ease-in-out;pointer-events:none;}

/* 碎片提示 */
.mem{
  margin-top:14px;font-family:var(--kai);font-size:14.5px;color:#cbb98f;
  border-left:2px solid var(--gold);padding:8px 0 8px 12px;line-height:2;
  background:linear-gradient(90deg, rgba(200,168,107,.10), transparent 75%);
  animation:fadein .8s;
}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blocked{
  margin-top:12px;font-family:var(--kai);font-size:16px;color:#f0c9c2;
  text-align:center;letter-spacing:.12em;animation:shake .4s;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 底部 */
.footer{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.footer .mini{padding:6px 14px;font-size:12.5px}

/* 结局 */
#ending{display:none;text-align:center;}
.endTitle{font-size:clamp(26px,6vw,40px);letter-spacing:.34em;color:#f0e4cf;margin:0 0 6px;font-weight:600;}
.endTag{font-size:12.5px;letter-spacing:.4em;color:var(--red2);margin-bottom:26px;}
.endBody{max-width:560px;margin:0 auto;font-size:16px;line-height:2.2;color:#dfe6e8;text-align:left;}
.endBody p{margin:0 0 14px;text-indent:2em;}
.endBody .q{text-indent:0;text-align:center;font-family:var(--kai);color:var(--gold);font-size:18px;letter-spacing:.14em;margin:18px 0;}
.bigQuestion{font-size:clamp(22px,5.5vw,34px);letter-spacing:.4em;color:#fff;margin:34px 0 10px;font-family:var(--kai);}
/* 雪幕：置于内容之下，只把背景埋进雪里，不影响文字可读性 */
.snowveil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 3.5s ease;
  background:linear-gradient(180deg, rgba(226,233,235,.15) 0%, rgba(226,233,235,.62) 45%, rgba(226,233,235,.92) 100%);}
.snowveil.on{opacity:1;}
/* 雪幕后文字转为墨色 */
#ending.onWhite .endTitle{color:#2b1f16 !important;text-shadow:none !important;}
#ending.onWhite .endTag{color:#7d2b26 !important;}
#ending.onWhite .endBody{color:#1e2a30 !important;}
#ending.onWhite .panel{border-color:rgba(120,90,60,.5)}
/* 选项被雪盖住 */
.snowed{opacity:0 !important;pointer-events:none !important;transition:opacity 2.5s ease;}
.faint{color:#6f7a80;font-size:12.5px;letter-spacing:.2em;text-align:center;margin-top:16px}

.hiddenEnd{text-align:center;}
.hiddenEnd .bigQuestion{animation:breathe 5s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.55;letter-spacing:.4em}50%{opacity:1;letter-spacing:.5em}}

/* 响应式 */
@media (max-width:560px){
  body{font-size:15px}
  #app{padding:12px 11px 50px}
  .panel{padding:16px 14px 15px}
  .textBox{font-size:15.5px;line-height:2.05;min-height:150px}
  .textBox p{text-indent:2em;margin-bottom:12px}
  .choice{font-size:14.5px;padding:11px 12px 11px 30px}
  .stageArea{height:210px}
  .vsub{height:170px}
  .topbar{font-size:12px;gap:7px}
}
@media (min-width:900px){ .textBox{min-height:210px} }
</style>
</head>
<body>

<canvas id="snow"></canvas>
<div id="flash"></div>
<div class="snowveil" id="veil"></div>

<div id="app">

  <!-- ============ 开始界面 ============ -->
  <div id="start">
    <div style="display:flex;align-items:flex-start;gap:18px;justify-content:center">
      <div class="vsub">一个旁观者的自白</div>
      <h1 class="vtitle">祝福：雪夜问魂</h1>
      <div class="vsub" style="height:150px">又名·门槛</div>
    </div>

    <!-- 木刻风格：雪夜中的提篮女人剪影 -->
    <svg width="200" height="150" viewBox="0 0 200 150" aria-label="雪夜中的女人剪影" style="opacity:.9">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8eef0"/><stop offset="1" stop-color="#93a3aa"/>
        </linearGradient>
      </defs>
      <!-- 雪地 -->
      <path d="M0 122 Q40 108 80 120 T160 112 T200 120 L200 150 L0 150Z" fill="#c9d4d8" opacity=".55"/>
      <!-- 身影 -->
      <g fill="#0c1216" stroke="#c3ced2" stroke-width="1">
        <ellipse cx="98" cy="52" rx="11" ry="13"/>
        <path d="M98 65 q-20 6 -24 34 q-3 22 4 34 l14 2 q4 -14 6 -30 l4 30 l14 -2 q7 -12 4 -34 q-4 -28 -22 -34Z"/>
        <rect x="116" y="112" width="26" height="16" rx="2"/>
        <path d="M118 112 q5 -9 11 -9 q6 0 11 9"/>
        <line x1="76" y1="30" x2="64" y2="134" stroke="#c3ced2" stroke-width="2.5"/>
        <line x1="64" y1="128" x2="64" y2="140" stroke="#c3ced2" stroke-width="2.5"/>
      </g>
      <g fill="#dfe6e8" opacity=".8">
        <circle cx="40" cy="30" r="1.6"/><circle cx="150" cy="24" r="1.3"/><circle cx="170" cy="60" r="1.5"/>
        <circle cx="24" cy="72" r="1.2"/><circle cx="128" cy="14" r="1.1"/><circle cx="60" cy="96" r="1.4"/>
      </g>
    </svg>

    <div class="startbtns">
      <button class="btn" id="btnNew">新 的 一 夜</button>
      <button class="btn ghost" id="btnContinue" style="display:none">继 续 未 完</button>
    </div>
    <p class="startnote">
      你是“我”，一个回鲁镇过年的新派知识分子。<br>
      你读新书，知道“鬼神者，宗教家之妄说也”，<br>
      却仍然答不出一个临死女人的问题。<br>
      ——这里没有拯救，只有经历、追问与“说不清”。
    </p>
    <div class="seal">说不清</div>
  </div>

  <!-- ============ 游戏界面 ============ -->
  <div id="game">
    <div class="topbar">
      <span class="chap" id="chapText">序章</span>
      <span id="fragText" class="frag">碎片 0/9</span>
      <span class="sp"></span>
      <button class="mini" id="btnMute" title="环境音开关">♪ 静音</button>
      <button class="mini" id="btnRestart" title="清空进度，重新开始">重新开始</button>
    </div>

    <div class="panel">
      <h2 class="sceneTitle" id="sceneTitle"></h2>
      <p class="sceneSub" id="sceneSub"></p>
      <div class="textBox" id="textBox"></div>
      <div id="status" class="status"></div>
      <div id="stage"></div>
      <div id="choices"></div>
    </div>

    <div class="footer">
      <button class="mini" id="btnSkip">跳过打字</button>
      <button class="mini" id="btnBack">返回标题</button>
    </div>
  </div>

  <!-- ============ 结局界面 ============ -->
  <div id="ending">
    <div class="panel">

/* =========================================================================
   《祝福：雪夜问魂》逻辑
   1) 雪 Canvas        2) Web Audio 环境音      3) 场景节点系统
   4) 小游戏（福礼/寻物/攒钱/拖门槛/刻字/书房点击）
   5) 变量：耐心值、祭祀资格（恒为 false）、记忆碎片、沉默标记
   6) localStorage 存档 + 重新开始

/* ---------------- 0. 全局状态 ---------------- */

    money:0,
    silentMarks:{},                 // 关键沉默点：m1/m2/m3/m4/m5
    silentCount:0,
    soul:null,                      // 灵魂之问的选择结果

/* ---------------- 1. 雪（Canvas） ---------------- */
const snowCv = document.getElementById('snow');
const sctx = snowCv.getContext('2d');
let flakes = [], W=0, H=0, wind=0.35, density=1;

function initSnow(){
  resizeSnow();
  flakes = [];
  const n = Math.round(W*H/9000*density);
  for(let i=0;i<n;i++) flakes.push(newFlake(true));
  requestAnimationFrame(drawSnow);
}
function newFlake(init){
  return {
    x:Math.random()*W,
    y:init?Math.random()*H:-10,
    r:Math.random()*1.9+0.5,
    sp:Math.random()*0.9+0.35,
    sw:Math.random()*1.6+0.4,       // 摆动幅度
    ph:Math.random()*Math.PI*2,
    a:Math.random()*0.55+0.25
  };
}
function resizeSnow(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  snowCv.width = W*dpr; snowCv.height = H*dpr;
  snowCv.style.width = W+'px'; snowCv.style.height = H+'px';
  sctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', ()=>{ resizeSnow(); initSnow(); });

function drawSnow(){
  sctx.clearRect(0,0,W,H);
  sctx.fillStyle = '#ffffff';
  for(const f of flakes){
    f.ph += 0.012;
    f.y += f.sp*density;
    f.x += Math.sin(f.ph)*f.sw*0.35 + wind;
    if(f.y > H+6 || f.x > W+8 || f.x < -8) Object.assign(f, newFlake(false), {x:Math.random()*W});
    sctx.globalAlpha = f.a;
    sctx.beginPath();
    sctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
  requestAnimationFrame(drawSnow);
}
initSnow();
/* 暴雪模式：某些场景加大雪量与风 */
function setSnow(mode){
  if(mode==='heavy'){ density=2.1; wind=0.75; }
  else if(mode==='calm'){ density=0.65; wind=0.18; }
  else { density=1; wind=0.35; }
}

/* ---------------- 2. Web Audio 环境音 ---------------- */
const Audio_ = {
  ctx:null, master:null, windGain:null, muted:false, started:false, noise:null,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted?0:0.9;
    this.master.connect(this.ctx.destination);
    // 生成一段棕噪声缓冲，循环使用
    const dur=3, len=this.ctx.sampleRate*dur;
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    this.noise = buf;
  },
  startAmbient(){
    this.ensure(); if(!this.ctx || this.started) return;
    this.started = true;
    if(this.ctx.state==='suspended') this.ctx.resume();
    // 风声（低通噪声 + 缓慢起伏）
    const src=this.ctx.createBufferSource(); src.buffer=this.noise; src.loop=true;
    const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    const g=this.ctx.createGain(); g.gain.value=0.055;
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=0.07;
    const lg=this.ctx.createGain(); lg.gain.value=0.03;
    lfo.connect(lg).connect(g.gain);
    src.connect(lp).connect(g).connect(this.master);
    src.start(); lfo.start();
    this.windGain = g;
    // 极低沉的音床
    const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=54;
    const og=this.ctx.createGain(); og.gain.value=0.028;
    o.connect(og).connect(this.master); o.start();
  },
  /** 爆竹：带通噪声爆发 + 屏幕闪光 */
  cracker(){
    if(!this.ctx || this.muted) { flash(); return; }
    const t=this.ctx.currentTime;
    const n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const st=t+i*(0.06+Math.random()*0.12);
      const src=this.ctx.createBufferSource(); src.buffer=this.noise; src.loop=true;
      const bp=this.ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value=900+Math.random()*1400; bp.Q.value=1.1;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,st);
      g.gain.linearRampToValueAtTime(0.35, st+0.006);
      g.gain.exponentialRampToValueAtTime(0.0008, st+0.16+Math.random()*0.12);
      src.connect(bp).connect(g).connect(this.master);
      src.start(st); src.stop(st+0.4);
    }
    flash();
  },
  /** 低语：人声般的窄带噪声流动 */
  whisper(){
    if(!this.ctx || this.muted) return;
    const t=this.ctx.currentTime, dur=1.6;
    const src=this.ctx.createBufferSource(); src.buffer=this.noise; src.loop=true;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=6;
    const g=this.ctx.createGain(); g.gain.value=0;
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=3.1;
    const lg=this.ctx.createGain(); lg.gain.value=0.06;
    lfo.connect(lg).connect(g.gain);
    // 频率游走
    bp.frequency.setValueAtTime(520,t);
    bp.frequency.linearRampToValueAtTime(980,t+dur);
    src.connect(bp).connect(g).connect(this.master);
    g.gain.linearRampToValueAtTime(0.05,t+0.4);
    g.gain.linearRampToValueAtTime(0,t+dur);
    src.start(t); lfo.start(t); src.stop(t+dur+0.1); lfo.stop(t+dur+0.1);
  },
  /** 钟 / 罄 一声 */
  bell(){
    if(!this.ctx || this.muted) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=196;
    const o2=this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=294;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.14,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0005,t+2.6);
    o.connect(g); o2.connect(g); g.connect(this.master);
    o.start(t); o2.start(t); o.stop(t+2.8); o2.stop(t+2.8);
  },
  toggle(){
    this.muted = !this.muted;
    if(this.master) this.master.gain.value = this.muted?0:0.9;
    return this.muted;
  }
};
function flash(){
  const f=document.getElementById('flash');
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}
/* 随机爆竹：带 cracker 效果的场景内循环 */
function startCrackers(){ stopCrackers(); crackerTimer = setInterval(()=>{ if(Math.random()<0.6) Audio_.cracker(); }, 2600); }
function stopCrackers(){ if(crackerTimer){ clearInterval(crackerTimer); crackerTimer=null; } }

/* ---------------- 3. 通用工具 ---------------- */

/** 祭祀资格判定 —— 原著核心：无论她如何努力，结果恒为 false */
function judgePurity(reason){
  const reasons = [
    '再嫁之妇，不洁。',
    '克夫克子，不祥。',
    '败坏风俗，不净。',
    '虽捐门槛，千人踏万人跨，仍不足以赎。'
  ];
  return { ok:false, verdict: reasons[Math.min(S.log.length, reasons.length-1)] || reasons[0], note:reason||'' };
}
function addFrag(n){ S.frag = Math.min(9, S.frag + (n||1)); }
function markSilent(key){
  if(!S.silentMarks[key]){ S.silentMarks[key]=true; S.silentCount++; }
}
/** 是否满足隐藏结局：灵魂之问说不清 + 终章沉默 + 至少三处沉默 */
function hiddenReady(){
  return !!S.silentMarks.m4 && !!S.silentMarks.m5 && S.silentCount>=3;
}

/* ============ 第一幕 ============ */
act1_first:{
  chapter:'第一幕 · 第一次来鲁镇', title:'一、冬初', sub:'她不是鲁镇人',
  fx:['snow','candle'],
  onEnter:()=>{ addFrag(1); },
  text:[
    '她不是鲁镇人。有一年的冬初，四叔家里要换女工，做中人的卫老婆子带她进来了。',
    '头上扎着白头绳，乌裙，蓝夹袄，月白背心，年纪大约二十六七，脸色青黄，但两颊却还是红的。卫老婆子叫她祥林嫂，说是自己母家的邻舍，死了当家人，所以出来做工了。',
    '四叔皱了皱眉，四婶已经知道了他的意思，是在讨厌她是一个寡妇。但是她模样还周正，手脚都壮大，又只是顺着眼，不开一句口，很像一个安分耐劳的人，便不管四叔的皱眉，将她留下了。',
    '试工期内，她整天的做，似乎闲着就无聊，又有力，简直抵得过一个男子，所以第三天就定局，每月工钱五百文。'
  ],
  choices:[{label:'年底了，煮福礼的时候到了', to:'act1_fuli'}]
},
act1_fuli:{
  chapter:'第一幕 · 第一次来鲁镇', title:'二、福礼', sub:'祥林嫂，你放着罢！我来摆。',
  fx:['snow','cracker','candle'],
  text:[
    '年底，扫尘，洗地，杀鸡，宰鹅，彻夜的煮福礼，全是一人担当，竟没有添短工。然而她很满足，口角边渐渐的有了笑影，脸上也白胖了。',
    '这是鲁镇年终的大典，致敬尽礼，迎接福神，拜求来年一年中的好运气。杀鸡，宰鹅，买猪肉，用心细细的洗，女人的臂膊都在水里浸得通红，有的还带着绞丝银镯子。',
    '煮熟之后，横七竖八的插些筷子在这类东西上，可就称为"福礼"了，五更天陈列起来，并且点上香烛，恭请福神们来享用；拜的却只限于男人。',
    '她想去插一双筷子。'
  ],
  game:{ type:'fuli', next:'act1_taken' }
},
act1_taken:{
  chapter:'第一幕 · 第一次来鲁镇', title:'三、被绑走', sub:'这有什么依不依',
  fx:['snow-heavy'],
  onEnter:()=>{ addFrag(1); },
  text:[
    '新年才过，她婆婆来了，说是要回去。卫老婆子居中说合，讲定把她嫁进深山，换八十千。',
    {q:'"这有什么依不依。——闹是谁也总要闹一闹的；只要用绳子一捆，塞在花轿里，抬到男家，捺上花冠，拜堂，关上房门，就完事了。"'},
    '她曾在河岸上反抗过。据说她一路只是嚎，骂，喉咙早哑了，还在骂；抬到男家，捺上花冠，拜堂，关上房门——后来就再没有声音。',
    {q:'"她有小叔子，也得娶老婆。不嫁了她，哪有这一注钱来做聘礼？"'},
    '我站在廊下，看着花轿拐出巷口。我懂的道理很多：人的解放、礼教的吃人、宗法的罪。然而我站着，什么也没有做。雪落下来，把轿子的印子盖平了。'
  ],
  choices:[

    {label:'（站着不动）', to:'act2_hejiaao', act:()=>markSilent('m3a')}
  ]
},
act1_chase:{
  chapter:'第一幕 · 第一次来鲁镇', title:'追', sub:'雪盖平了印子',
  fx:['snow-heavy'],
  text:[
    '我追出巷口。雪很大，风把爆竹的纸屑卷到半空，红的，像一群瞎眼的蝴蝶。',
    '轿子已经看不见了。地上只剩下两行脚印，一行是抬轿的，一行是跟着走的。',
    '我在雪里站了很久。我知道我追不上——不是腿追不上，是我没有理由追。一个读书人，凭什么去拦一桩"本家的事"，凭什么去拦一位"婆婆"？我凭的不过是一点说不清的难堪。',

  text:[
    '卫老婆子再来的时候，是满脸笑的。她说，祥林嫂真是交了好运了。',
    {q:'"她婆婆来抓她回去的时候，是早已许给了贺家墺的贺老六了，所以回家之后不几天，也就装在花轿里抬去了。"'},
    '"上头又没有婆婆；男人所有的是力气，会做活；房子是自家的。——唉唉，她真是交了好运气。"',
    '我问：后来呢？卫老婆子的笑淡了淡："后来么？后来——她男人是坚实人，谁知道年纪青青，就会断送在伤寒上？本来已经好了的，吃了一碗冷饭，复发了。幸亏有儿子；她又能做，打柴摘茶养蚕都来得，本来还可以守着，谁知道那孩子又会给狼衔去的呢？"',

  choices:[{label:'去雪地里找一找那些东西', to:'act2_snow'}]

act2_amao:{

  text:[

act4_river:{
  chapter:'第四幕 · 灵魂之问', title:'一、河边', sub:'她分明已经纯乎是一个乞丐了',
  fx:['snow-heavy','candle'],
  onEnter:()=>{ addFrag(1); Audio_.whisper(); },
  text:[
    '我给那些因为在近旁而极响的爆竹声惊醒，看见豆一般大的黄色的灯火光，接着又听得毕毕剥剥的鞭炮，是四叔家正在"祝福"了。',

/* ---------------- 6. 打字机 ---------------- */
function typeBox(paragraphs, done){
  const box = $('textBox');
  box.innerHTML = '';
  typing = true;
  let pi = 0, ci = 0;
  let cur = null;

  function nextP(){
    if(pi >= paragraphs.length){ typing=false; box.innerHTML=''; done && done(); return; }
    const item = paragraphs[pi];
    const isQuote = (typeof item === 'object');
    const text = isQuote ? item.q : item;
    cur = document.createElement('p');
    if(isQuote){ cur.className = 'quote'; }
    box.appendChild(cur);
    const span = document.createElement('span');
    cur.appendChild(span);
    const cur0 = document.createElement('span');
    cur0.className = 'cursor'; cur0.textContent = '　';
    cur.appendChild(cur0);
    ci = 0;
    step();
  }
  function step(){
    const item = paragraphs[pi];
    const text = (typeof item === 'object') ? item.q : item;
    const span = cur.firstChild;
    if(ci < text.length){
      span.textContent += text[ci];
      ci++;
      box.scrollTop = box.scrollHeight;
      typeTimer = setTimeout(step, 16);
    }else{
      cur.removeChild(cur.lastChild);
      pi++;
      typeTimer = setTimeout(nextP, 240);
    }
  }
  nextP();
}
function skipTyping(){
  if(!typing) return;
  clearTimeout(typeTimer); typing=false;
  const box=$('textBox');
  const sc = SCENES[S.scene]; if(!sc) return;
  box.innerHTML='';
  (sc.text||[]).forEach(item=>{
    const p=document.createElement('p');
    if(typeof item==='object'){ p.className='quote'; p.textContent=item.q; }
    else p.textContent=item;
    box.appendChild(p);
  });
  afterText(sc);
}

/* ---------------- 7. 场景渲染 ---------------- */
function goto(id){
  const sc = SCENES[id];
  if(!sc){ console.warn('缺少场景', id); return; }
  S.scene = id; S.seen[id]=true; save();
  stopCrackers();

  // 环境效果
  setSnow(sc.fx && sc.fx.indexOf('snow-heavy')>=0 ? 'heavy' : (sc.fx && sc.fx.indexOf('snow')>=0 ? 'normal' : 'calm'));
  if(sc.fx && sc.fx.indexOf('cracker')>=0) startCrackers();
  if(sc.fx && sc.fx.indexOf('candle')>=0) Audio_.bell();

  // 顶部
  $('chapText').textContent = sc.chapter || '';
  $('fragText').textContent = '碎片 '+S.frag+'/9';

  sc.onEnter && sc.onEnter();

  $('sceneTitle').textContent = sc.title || '';
  $('sceneSub').textContent = sc.sub || '';
  $('stage').innerHTML = '';
  $('choices').innerHTML = '';
  renderStatus(sc);

  // 结局
  if(sc.ending){ return renderEnding(sc); }

  $('start').style.display='none';
  $('game').style.display='block';
  $('ending').style.display='none';

  typeBox(sc.text||[], ()=>afterText(sc));
}
function afterText(sc){
  if(sc.game){
    const doneKey = S.scene;
    if(S.mg[doneKey]){ showContinue(sc.game.next); }
    else renderGame(sc.game, ()=>{ S.mg[doneKey]=true; save(); showContinue(sc.game.next); });
  }else{
    showChoices(sc.choices||[]);
  }
}
function showContinue(to){
  const c=$('choices'); c.innerHTML='';
  const b=document.createElement('button');
  b.className='choice'; b.textContent='（继续）';
  b.onclick=()=>goto(to);
  c.appendChild(b);
}
function showChoices(list){
  const c=$('choices'); c.innerHTML='';
  list.forEach(ch=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=ch.label;
    b.onclick=()=>{ ch.act && ch.act(); const to = (typeof ch.to==='function') ? ch.to() : ch.to; save(); goto(to); };
    c.appendChild(b);
  });
}
/* 状态条：耐心值 + 祭祀资格（恒 false） */
function renderStatus(sc){
  const st=$('status'); st.innerHTML='';
  const showPatience = (S.scene.indexOf('act2_tell')===0) || S.scene==='act2_amao';
  if(showPatience){
    const d=document.createElement('div'); d.className='bar';
    const pct=Math.round(S.patience/5*100);
    d.innerHTML='<span>众人耐心</span><span class="track"><span class="fill'+(S.patience<=2?' low':'')+'" style="width:'+pct+'%"></span></span><span>'+S.patience+'/5</span>';
    st.appendChild(d);
  }
  if(S.scene.indexOf('act1_fuli')===0 || S.scene.indexOf('act3')===0){
    const j=judgePurity();
    const d=document.createElement('div'); d.className='bar';
    d.innerHTML='<span>祭祀资格</span><span class="verdict">'+j.verdict+'</span>';
    st.appendChild(d);
  }
}

        tbl.appendChild(p);
        Audio_.cracker();
        if(placed>=6 || (placed>=3 && blocked>=1)) finish();
      };
      bar.appendChild(b);
    });
    const sb=document.createElement('button');
    sb.className='she'; sb.textContent='让祥林嫂来摆';
    sb.onclick=()=>{
      blocked++;
      const lines=[
        '“祥林嫂，你放着罢！我来摆。”——四婶',
        '“祥林嫂，你放着罢！我来摆。”——四婶，又慌忙大声说',
        '“你放着罢，祥林嫂！”——四婶慌忙大声说'
      ];
      const d=document.createElement('div'); d.className='blocked';
      d.textContent=lines[Math.min(blocked-1,2)];
      msg.innerHTML=''; msg.appendChild(d);
      Audio_.whisper();
      if(placed>=3 && blocked>=1) finish();
    };
    bar.appendChild(sb);

    function finish(){
      bar.querySelectorAll('button').forEach(b=>b.classList.add('used'));
      const j=judgePurity('她曾试图参与祭祀');
      msg.innerHTML='<div class="mem">她把手收了回去，站在灶边，看别人把筷子插上。祭祀资格判定：<span style="color:#b8453c">'+j.verdict+'</span>（系统判定结果：'+(j.ok?'洁净':'不洁净')+'）</div>';
      setTimeout(onDone, 900);
    }
  },

  /* --- 雪地寻物：小鞋 / 小篮 / 血迹 --- */
  snowfind(stage, tip, area, msg, onDone){
    tip.textContent='（点击雪地，找三样东西）';
    area.innerHTML='<div class="ground"></div>';
    const spots=[
      {k:'shoe',  x:'16%', y:'34%', s:60, svg:SVG.shoe,  tag:'小鞋',
       mem:'刺柴上挂着一只他的小鞋。鞋帮上还沾着泥，鞋口朝下，空空的。'},
      {k:'blood', x:'62%', y:'56%', s:56, svg:SVG.blood, tag:'一点血',
       mem:'草窠里有一小片黑。雪盖了半边，另外半边冻住了，是褐色的。——那是阿毛的。'},
      {k:'basket',x:'38%', y:'70%', s:58, svg:SVG.basket,tag:'小篮',
       mem:'他躺在草窠里，肚里的五脏已经都给吃空了，手里还紧紧的捏着那只小篮呢。'}
    ];
    let found=0;
    spots.forEach(sp=>{
      const h=document.createElement('div');
      h.className='hint';
      h.style.left=sp.x; h.style.top=sp.y;
      h.style.width=sp.s+'px'; h.style.height=sp.s+'px';
      h.style.marginLeft=(-sp.s/2)+'px'; h.style.marginTop=(-sp.s/2)+'px';
      h.onclick=()=>{
        h.remove(); found++; addFrag(1); save();
        const o=document.createElement('div');
        o.className='obj done';
        o.style.left=sp.x; o.style.top=sp.y;
        o.style.width=sp.s+'px'; o.style.height=sp.s+'px';
        o.style.marginLeft=(-sp.s/2)+'px'; o.style.marginTop=(-sp.s/2)+'px';
        o.innerHTML=sp.svg+'<span class="tag" style="bottom:-14px">'+sp.tag+'</span>';
        area.appendChild(o);
        const m=document.createElement('div'); m.className='mem'; m.textContent=sp.mem;
        stage.insertBefore(m, msg);
        Audio_.whisper();
        if(found>=3){
          tip.textContent='三样都在了。';
          const t=document.createElement('div'); t.className='mem';
          t.innerHTML='春天，狼叼走了阿毛。她说的每一个字都是真的，只是没有人再愿意听。';
          stage.insertBefore(t, msg);
          setTimeout(onDone, 900);
        }
      };
      area.appendChild(h);
    });
  },

  /* --- 攒钱：点击干活 8 次 --- */
  money(stage, tip, area, msg, onDone){
    tip.textContent='（她默默的跑街，扫地，洗菜，淘米）';
    area.innerHTML='<div class="ground" style="height:40px"></div>';
    const woman=document.createElement('div');
    woman.className='obj done';
    woman.style.cssText='left:50%;margin-left:-45px;top:40px;width:90px;height:130px';
    woman.innerHTML=SVG.woman;
    area.appendChild(woman);
    const box=document.createElement('div'); box.className='coinbox';
    box.innerHTML='<span>历年积存的工钱：</span><b id="mnum" style="color:#c8a86b">0</b><span> / 12 元鹰洋</span>';
    stage.insertBefore(box, msg);
    const coins=document.createElement('div'); coins.className='coins';
    stage.insertBefore(coins, msg);
    const btn=document.createElement('button'); btn.className='choice';
    btn.textContent='再干一天的活（+1.5 元）';
    btn.onclick=()=>{
      S.money+=1.5;
      $('mnum').textContent=Math.min(12, S.money.toFixed(0));
      const c=document.createElement('div'); c.className='coin'; coins.appendChild(c);
      Audio_.cracker();
      if(S.money>=12){
        btn.remove();
        msg.innerHTML='<div class="mem">快够一年，她才从四婶手里支取了历来积存的工钱，换算了十二元鹰洋。她把这钱用手巾包了又包，藏在贴身的地方。她以为这是买命的钱。</div>';
        setTimeout(onDone, 900);
      }
    };
    stage.insertBefore(btn, msg);
  },

  /* --- 拖门槛进庙门 --- */
  temple(stage, tip, area, msg, onDone){
    tip.textContent='（按住门槛，把它拖进庙门的虚线框）';
    area.innerHTML='<div class="ground" style="height:44px"></div>';
    const t=document.createElement('div'); t.id='temple'; t.innerHTML=SVG.temple; area.appendChild(t);
    const dz=document.createElement('div'); dz.id='dropzone'; dz.textContent='庙 门 口';
    area.appendChild(dz);
    const beam=document.createElement('div'); beam.id='beam'; beam.textContent='门 槛';
    area.appendChild(beam);

    let dragging=false, ox=0, oy=0;
    const host=area;
    beam.addEventListener('pointerdown', e=>{
      dragging=true; beam.setPointerCapture(e.pointerId); beam.classList.add('dragging');
      const r=beam.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
    });
    beam.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const h=host.getBoundingClientRect();
      let x=e.clientX-h.left-ox, y=e.clientY-h.top-oy;
      x=Math.max(0,Math.min(h.width-beam.offsetWidth,x));
      y=Math.max(0,Math.min(h.height-beam.offsetHeight,y));
      beam.style.left=x+'px'; beam.style.top=y+'px';
      const b=beam.getBoundingClientRect(), z=dz.getBoundingClientRect();
      const inZone = b.left+b.width/2>z.left && b.left+b.width/2<z.right && b.top+b.height/2>z.top && b.top+b.height/2<z.bottom;
      dz.classList.toggle('hot', inZone);
    });
    let alt = null;
    function succeed(){
      if(beam.classList.contains('locked')) return;
      beam.classList.add('locked');
      beam.style.left=''; beam.style.top='';   // 清掉拖拽时的内联坐标，交回 .locked 定位
      dz.classList.remove('hot'); dz.textContent='已 捐';
      Audio_.bell();
      msg.innerHTML='<div class="mem">门槛横在庙门口了。她想：从今往后，千人踏，万人跨，我的罪就算赎了。——她不知道，门槛是木头，人是人；木头替不了人。</div>';
      if(alt) alt.remove();
      setTimeout(onDone, 1000);
    }
    const up=e=>{
      if(!dragging) return; dragging=false; beam.classList.remove('dragging');
      const b=beam.getBoundingClientRect(), z=dz.getBoundingClientRect();
      if(b.left+b.width/2>z.left && b.left+b.width/2<z.right && b.top+b.height/2>z.top && b.top+b.height/2<z.bottom){
        succeed();
      }
    };
    beam.addEventListener('pointerup', up);
    beam.addEventListener('pointercancel', up);

    // 兜底按钮：手机或拖拽失灵时也能推进，避免卡关
    alt=document.createElement('button');
    alt.className='mini';
    alt.style.cssText='display:block;margin:14px auto 0';
    alt.textContent='（拖不动？点此把门槛抬过去）';
    alt.onclick=succeed;
    stage.appendChild(alt);
  },

  /* --- 刻字：点击门槛 4 次 --- */
  carve(stage, tip, area, msg, onDone){
    tip.textContent='（点击门槛，替她刻上字）';
    area.innerHTML='<div class="ground" style="height:40px"></div>';
    const wrap=document.createElement('div');
    wrap.id='carveTarget';
    wrap.style.cssText='position:absolute;left:50%;top:70px;margin-left:-90px;width:180px;height:34px;cursor:pointer';
    wrap.innerHTML=SVG.beam;
    const lab=document.createElement('div');
    lab.style.cssText='position:absolute;left:50%;top:70px;margin-left:-90px;width:180px;height:34px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--kai);font-size:20px;color:#f0d9b0;letter-spacing:.2em;pointer-events:none';
    area.appendChild(wrap); area.appendChild(lab);
    const chars=['捐','门','槛','赎'];
    let i=0;
    wrap.onclick=()=>{
      if(i>=chars.length) return;
      lab.textContent += chars[i]; i++;
      Audio_.bell();
      if(i>=chars.length){
        wrap.classList.add('done'); wrap.onclick=null;
        msg.innerHTML='<div class="mem">字刻好了：捐、门、槛、赎。她不认得这四个字，但她相信它们。她如同脱了枷锁，眼里有了光——那光只亮了一天。</div>';
        setTimeout(onDone, 1000);
      }
    };
  }
};

/* ---------------- 9. 结局渲染 ---------------- */
function renderEnding(sc){
  stopCrackers();
  $('start').style.display='none';
  $('game').style.display='none';
  $('ending').style.display='block';
  window.scrollTo(0,0);

  // 隐藏结局判定：灵魂之问"说不清" + 终章沉默 + 至少三处沉默
  const hid = sc.hidden || (hiddenReady() && (S.scene==='end_silence'||S.scene==='end_shuoBuQing'));

  const body=$('endBody'); body.innerHTML='';
  const endFoot = document.querySelector('#ending .footer');
  endFoot.classList.remove('snowed');
  $('ending').classList.remove('onWhite');

  if(hid){
    $('endTitle').textContent='说 不 清';
    $('endTag').textContent='隐 藏 结 局';
    const d=document.createElement('div'); d.className='hiddenEnd';
    (sc.text||[]).forEach(t=>{
      const p=document.createElement('p');
      p.textContent = (typeof t==='object')? t.q : t;
      d.appendChild(p);
    });
    const q=document.createElement('div'); q.className='bigQuestion'; q.textContent='她 叫 什 么 ？';
    d.appendChild(q);
    const s=document.createElement('div');
    s.style.cssText='margin-top:18px;font-size:13px;color:#7d888d;letter-spacing:.2em;text-align:center';
    s.textContent='（雪落下来，盖住了所有选项）';
    d.appendChild(s);
    body.appendChild(d);
    document.getElementById('veil').classList.add('on');
    $('ending').classList.add('onWhite');   // 雪幕后改用墨色字，保证可读
    setTimeout(()=>endFoot.classList.add('snowed'), 900);
    setSnow('heavy');
  }else{
    document.getElementById('veil').classList.remove('on');
    $('endTitle').textContent = sc.title;
    $('endTag').textContent = sc.sub||'';
    (sc.text||[]).forEach(t=>{
      if(typeof t==='object'){ const q=document.createElement('div'); q.className='q'; q.textContent=t.q; body.appendChild(q); }
      else { const p=document.createElement('p'); p.textContent=t; body.appendChild(p); }
    });
    // 结局附加：灵魂之问的影响
    const tail=document.createElement('div'); tail.className='q';
    const map={a:'你最后记住的，是她的恐惧。',b:'你最后记住的，是她的追问。',c:'你最后记住的，是她眼里熄灭的光。',d:'你最后记住的，是一片空白。'};
    if(S.soul&&map[S.soul]) tail.textContent=map[S.soul];
    if(tail.textContent) body.appendChild(tail);
    // 隐藏条件达成的余味
    if(S.silentCount>=3){
      const w=document.createElement('div');
      w.style.cssText='text-align:center;margin-top:26px;font-family:var(--kai);color:#8b969c;font-size:14px;letter-spacing:.3em;opacity:.75';
      w.textContent='（你始终没有说清。她叫什么？）';
      body.appendChild(w);
    }
    // 烧掉：雪渐渐盖住屏幕，一切仿佛没有发生（文字转墨色以保证可读）
    if(sc.title.indexOf('烧')>=0){
      setSnow('heavy');
      document.getElementById('veil').classList.add('on');
      $('ending').classList.add('onWhite');
    }
  }
  save();
}

/* ---------------- 10. 界面按钮 ---------------- */
function showStart(){
  stopCrackers();
  $('start').style.display='flex';
  $('game').style.display='none';
  $('ending').style.display='none';
  document.getElementById('veil').classList.remove('on');
  $('ending').classList.remove('onWhite');
  document.querySelector('#ending .footer').classList.remove('snowed');
  const sv=loadSave();
  $('btnContinue').style.display = sv ? 'block' : 'none';
}
function beginNew(){
  clearSave();
  S = freshState();
  Audio_.startAmbient();
  save();
  goto(S.scene);
}
function beginContinue(){
  const sv=loadSave();
  S = sv || freshState();
  Audio_.startAmbient();
  goto(S.scene);
}
function backToTitle(){
  if(confirm('回到标题？当前进度会保留。')) showStart();
}
function restart(){
  if(!confirm('重新开始？当前进度将被清空。')) return;
  clearSave();
  clearVeil();
  S = freshState();
  goto(S.scene);
}
/** 清除雪幕 / 墨色 / 被雪覆盖的选项状态 */
function clearVeil(){
  document.getElementById('veil').classList.remove('on');
  $('ending').classList.remove('onWhite');
  document.querySelector('#ending .footer').classList.remove('snowed');
}

$('btnNew').onclick = beginNew;
$('btnContinue').onclick = beginContinue;
$('btnRestart').onclick = restart;
$('btnBack').onclick = backToTitle;
$('btnBack2').onclick = ()=>{ clearVeil(); showStart(); };
$('btnAgain').onclick = ()=>{ clearSave(); clearVeil(); S=freshState(); goto('prologue_arrive'); };
$('btnSkip').onclick = ()=>{ skipTyping(); };
$('btnMute').onclick = ()=>{
  Audio_.ensure();
  const m = Audio_.toggle();
  $('btnMute').textContent = m ? '♪ 已静音' : '♪ 静音';
};
/* 点击正文也可跳过打字 */
$('textBox').addEventListener('click', ()=>{ if(typing) skipTyping(); });

/* 首次交互启动音频（浏览器策略） */
document.addEventListener('pointerdown', function once(){
  Audio_.startAmbient();
  document.removeEventListener('pointerdown', once);
});

/* 启动 */
S = loadSave() || freshState();
showStart();
</script>
