<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学实验室 · Chem Lab</title>
<style>
    /* ==================== 全局重置 ==================== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
        min-height: 100vh;
        color: #e8e8e8;
        padding: 20px 40px 60px;
        position: relative;
        z-index: 0;
        background-color: #0a0a0f;
        background-image:
            radial-gradient(1200px 700px at 15% -10%, rgba(90, 120, 150, 0.16), transparent 60%),
            radial-gradient(900px 600px at 100% 0%, rgba(110, 140, 170, 0.13), transparent 55%);
        background-attachment: fixed;
    }

    .noise-overlay {
        position: fixed;
        inset: 0;
        opacity: 0.04;
        z-index: -1;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ==================== 头部 ==================== */
    .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 5px;
    }
    .page-title {
        font-size: 2.4em;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #ffffff 0%, #9ec8e8 60%, #8fb9a8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .header-meta {
        font-size: 0.85em;
        color: rgba(255,255,255,0.35);
        letter-spacing: 2px;
    }
    .header-line {
        border-top: 2px solid rgba(255,255,255,0.12);
        margin-bottom: 34px;
    }

    /* ==================== 布局 ==================== */
    .lab-wrap {
        display: grid;
        grid-template-columns: 330px minmax(360px, 1fr) 380px;
        gap: 20px;
        align-items: start;
    }

    .panel {
        border-radius: 18px;
        padding: 20px 22px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow:
            0 4px 24px rgba(0,0,0,0.3),
            inset 0 1px 0 rgba(255,255,255,0.08),
            inset 0 -1px 0 rgba(0,0,0,0.2);
        position: relative;
        overflow: hidden;
    }

    .panel-title {
        font-size: 1.15em;
        font-weight: 700;
        letter-spacing: 1px;
        color: #c6c6de;
        margin-bottom: 16px;
        padding-left: 12px;
        border-left: 3px solid rgba(150, 200, 220, 0.6);
    }
    .panel-title small {
        font-size: 0.68em;
        font-weight: 500;
        color: #7a7a92;
        margin-left: 8px;
        letter-spacing: 0;
    }

    /* ==================== 试剂架 ==================== */
    .search-box {
        width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: #e8e8e8;
        font-size: 0.9em;
        outline: none;
        transition: border-color .3s, box-shadow .3s;
        font-family: inherit;
    }
    .search-box:focus {
        border-color: rgba(160,200,220,0.45);
        box-shadow: 0 0 0 3px rgba(140,190,210,0.1);
    }
    .search-box::placeholder { color: rgba(255,255,255,0.28); }

    .cat-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0 14px;
    }
    .cat-tab {
        font-size: 0.75em;
        padding: 5px 11px;
        border-radius: 99px;
        border: 1px solid rgba(255,255,255,0.09);
        background: rgba(255,255,255,0.04);
        color: #9090a8;
        cursor: pointer;
        transition: all .25s;
        font-family: inherit;
        letter-spacing: .5px;
    }
    .cat-tab:hover { color: #d6d6e6; border-color: rgba(255,255,255,0.2); }
    .cat-tab.active {
        background: rgba(160, 200, 220, 0.16);
        border-color: rgba(160, 200, 220, 0.45);
        color: #eaf6ff;
        box-shadow: 0 0 14px rgba(150,200,220,0.14);
    }

    .sub-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        max-height: 60vh;
        overflow-y: auto;
        padding-right: 4px;
    }
    .sub-grid::-webkit-scrollbar { width: 6px; }
    .sub-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }
    .sub-grid::-webkit-scrollbar-track { background: transparent; }

    .sub-card {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 9px 11px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.07);
        background: rgba(255,255,255,0.035);
        cursor: pointer;
        text-align: left;
        color: #dedeee;
        font-family: inherit;
        transition: all .25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .sub-card:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.09);
        border-color: rgba(255,255,255,0.2);
        box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .sub-card:active { transform: translateY(0) scale(0.98); }
    .sub-f {
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1.02em;
        letter-spacing: .5px;
        color: #f2f6ff;
    }
    .sub-f sub { font-size: 0.7em; }
    .sub-n { font-size: 0.72em; color: #8d8da4; }
    .st-dot {
        position: absolute;
        width: 6px; height: 6px; border-radius: 50%;
    }

    .state-badge {
        font-size: 0.62em;
        padding: 1px 6px;
        border-radius: 99px;
        border: 1px solid rgba(255,255,255,0.12);
        color: #a2a2b8;
        width: fit-content;
        margin-top: 3px;
        letter-spacing: .5px;
    }
    .state-g { color: #9fd0ff; border-color: rgba(159,208,255,0.3); }
    .state-s { color: #e8d9a8; border-color: rgba(232,217,168,0.3); }
    .state-l { color: #9fe8d0; border-color: rgba(159,232,208,0.3); }
    .state-a { color: #c9b6f0; border-color: rgba(201,182,240,0.3); }

    /* ==================== 实验台 ==================== */
    .flask-stage {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.07);
        margin-bottom: 16px;
    }

    .flask {
        position: relative;
        flex: 0 0 auto;
        width: 74px;
        height: 96px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px 10px 26px 26px;
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
        overflow: hidden;
        box-shadow: inset 0 2px 10px rgba(255,255,255,0.06);
    }
    .flask::before {
        content: "";
        position: absolute;
        top: 6px; left: 50%;
        transform: translateX(-50%);
        width: 26px; height: 7px;
        border-radius: 4px;
        background: rgba(255,255,255,0.12);
    }
    .liquid {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 0%;
        background: linear-gradient(180deg, rgba(130,170,200,0.55), rgba(100,140,170,0.35));
        transition: height .9s cubic-bezier(0.22,0.9,0.25,1), background .9s ease;
    }
    .liquid::before {
        content: "";
        position: absolute; left: 0; right: 0; top: -2px;
        height: 4px; border-radius: 50%;
        background: rgba(255,255,255,0.25);
        opacity: .8;
    }
    .sediment {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: 0;
        background: rgba(240,240,250,0.5);
        border-radius: 0 0 24px 24px;
        transition: height .9s ease;
    }
    .flask.bubbling .bubble { animation: rise 1.4s ease-in infinite; }
    .bubble {
        position: absolute;
        bottom: 4px;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: rgba(255,255,255,0.55);
        opacity: 0;
    }
    @keyframes rise {
        0%   { transform: translateY(0) scale(.6); opacity: 0; }
        25%  { opacity: .9; }
        100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
    }
    .flask.glow { box-shadow: inset 0 0 26px rgba(255,150,80,0.35), 0 0 24px rgba(255,140,70,0.18); }
    .flask.flash { animation: flash .7s ease; }
    @keyframes flash {
        0% { box-shadow: inset 0 0 40px rgba(255,255,255,0.6); }
        100% { box-shadow: inset 0 2px 10px rgba(255,255,255,0.06); }
    }

    .stage-info { flex: 1; min-width: 0; }
    .stage-label { font-size: 0.72em; color: #7f7f96; letter-spacing: 1px; }
    .stage-value { font-size: 0.95em; color: #e2e2f2; margin-top: 4px; line-height: 1.5; }
    .stage-value b { color: #a8d8f0; font-weight: 600; }

    .chips {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 92px;
        max-height: 240px;
        overflow-y: auto;
        padding: 2px;
    }
    .chips::-webkit-scrollbar { width: 6px; }
    .chips::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }

    .empty-hint {
        border: 1px dashed rgba(255,255,255,0.14);
        border-radius: 14px;
        padding: 26px 16px;
        text-align: center;
        color: rgba(255,255,255,0.28);
        font-size: 0.85em;
        line-height: 1.8;
    }

    .chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.09);
        animation: chipIn .35s cubic-bezier(0.25,0.8,0.25,1);
    }
    @keyframes chipIn {
        from { opacity: 0; transform: translateY(6px) scale(.97); }
        to { opacity: 1; transform: none; }
    }
    .chip-formula {
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1.05em;
        min-width: 78px;
        color: #f2f6ff;
    }
    .chip-formula sub { font-size: 0.7em; }
    .chip-name { font-size: 0.76em; color: #8d8da4; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-count {
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
        color: #cfd6ea;
        min-width: 34px;
        text-align: center;
        border-left: 1px solid rgba(255,255,255,0.1);
        border-right: 1px solid rgba(255,255,255,0.1);
        padding: 0 6px;
    }
    .round-btn {
        width: 22px; height: 22px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.05);
        color: #c9c9dc;
        cursor: pointer;
        font-size: 0.9em;
        line-height: 1;
        display: flex; align-items: center; justify-content: center;
        transition: all .2s;
        font-family: inherit;
        flex: 0 0 auto;
    }
    .round-btn:hover { background: rgba(255,255,255,0.16); color: #fff; transform: scale(1.1); }
    .round-btn.del:hover { background: rgba(255,110,110,0.3); border-color: rgba(255,110,110,0.5); }

    /* ==================== 条件按钮 ==================== */
    .section-label {
        font-size: 0.72em;
        letter-spacing: 2px;
        color: #7f7f96;
        margin: 18px 0 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255,255,255,0.08);
    }

    .cond-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .cond-btn {
        padding: 7px 13px;
        border-radius: 99px;
        font-size: 0.8em;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04);
        color: #9a9ab2;
        cursor: pointer;
        transition: all .3s;
        font-family: inherit;
        letter-spacing: .5px;
    }
    .cond-btn:hover { color: #e0e0f0; border-color: rgba(255,255,255,0.22); }
    .cond-btn.active {
        background: rgba(255,170,90,0.16);
        border-color: rgba(255,180,100,0.55);
        color: #ffd9a8;
        box-shadow: 0 0 16px rgba(255,170,90,0.18);
    }

    .act-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .btn {
        flex: 1;
        min-width: 120px;
        padding: 12px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.05);
        color: #e4e4f4;
        font-size: 0.92em;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all .3s cubic-bezier(0.25,0.8,0.25,1);
        font-family: inherit;
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn.primary {
        background: linear-gradient(135deg, rgba(120,200,180,0.22), rgba(130,180,220,0.18));
        border-color: rgba(150,220,200,0.42);
        color: #eafffb;
        box-shadow: 0 6px 22px rgba(90,190,170,0.14);
    }
    .btn.primary:hover { box-shadow: 0 10px 30px rgba(90,190,170,0.24); }
    .btn.ghost { flex: 0 0 auto; min-width: 92px; font-weight: 500; color: #a3a3bb; }

    .toggle-line {
        display: flex; align-items: center; gap: 10px;
        margin-top: 14px; font-size: 0.78em; color: #8d8da4;
        cursor: pointer; user-select: none;
    }
    .toggle {
        width: 36px; height: 20px; border-radius: 99px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        position: relative; transition: all .3s; flex: 0 0 auto;
    }
    .toggle::after {
        content: ""; position: absolute;
        top: 2px; left: 2px;
        width: 14px; height: 14px; border-radius: 50%;
        background: #9a9ab2; transition: all .3s;
    }
    .toggle-line.on .toggle { background: rgba(120,200,180,0.28); border-color: rgba(150,220,200,0.5); }
    .toggle-line.on .toggle::after { left: 18px; background: #b6f0e0; }

    /* ==================== 结果区 ==================== */
    .result-wrap { min-height: 240px; }
    .result-card {
        border-radius: 16px;
        padding: 18px 20px;
        background: rgba(255,255,255,0.045);
        border: 1px solid rgba(255,255,255,0.1);
        animation: resultIn .5s cubic-bezier(0.25,0.8,0.25,1);
    }
    @keyframes resultIn {
        from { opacity: 0; transform: translateY(14px) scale(.98); }
        to { opacity: 1; transform: none; }
    }
    .result-card.fail { border-color: rgba(255,255,255,0.1); }
    .result-head {
        display: flex; align-items: center; gap: 10px;
        flex-wrap: wrap; margin-bottom: 14px;
    }
    .type-badge {
        font-size: 0.72em;
        padding: 4px 11px;
        border-radius: 99px;
        background: rgba(150,200,220,0.14);
        border: 1px solid rgba(150,200,220,0.35);
        color: #bfe4f5;
        letter-spacing: 1px;
    }
    .warn-badge {
        font-size: 0.72em;
        padding: 4px 11px;
        border-radius: 99px;
        background: rgba(255,120,120,0.14);
        border: 1px solid rgba(255,120,120,0.4);
        color: #ffb3b3;
        letter-spacing: 1px;
    }
    .eq-box {
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1.22em;
        line-height: 1.9;
        color: #f4f8ff;
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(0,0,0,0.22);
        border: 1px solid rgba(255,255,255,0.07);
        word-break: break-word;
    }
    .eq-box sub { font-size: 0.68em; }
    .arrow {
        color: #ffce9a;
        font-family: inherit;
        font-size: 0.82em;
        letter-spacing: 0;
        padding: 0 2px;
    }
    .ud { color: #a8e0ff; font-size: 0.7em; vertical-align: super; }

    .ion-box {
        margin-top: 10px;
        padding: 11px 14px;
        border-radius: 11px;
        background: rgba(160, 200, 230, 0.06);
        border: 1px dashed rgba(160, 200, 230, 0.28);
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1.05em;
        color: #dbeaf6;
        line-height: 1.8;
    }
    .ion-label {
        display: block;
        font-family: -apple-system, "PingFang SC", sans-serif;
        font-size: 0.66em;
        letter-spacing: 2px;
        color: #6f8fa8;
        margin-bottom: 4px;
    }

    .phen-list { margin-top: 14px; }
    .phen-title { font-size: 0.72em; letter-spacing: 2px; color: #7f7f96; margin-bottom: 8px; }
    .phen-text { font-size: 0.92em; line-height: 1.85; color: #c2c2d6; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .tag {
        font-size: 0.72em;
        padding: 4px 11px;
        border-radius: 99px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.09);
        color: #9a9ab2;
    }
    .tag.hot { color: #ffc79a; border-color: rgba(255,180,120,0.32); background: rgba(255,180,120,0.1); }
    .tag.gas { color: #a8e0ff; border-color: rgba(168,224,255,0.32); background: rgba(168,224,255,0.08); }
    .tag.pre { color: #e8dcb0; border-color: rgba(232,220,176,0.32); background: rgba(232,220,176,0.08); }
    .tag.lig { color: #fff0b0; border-color: rgba(255,240,176,0.32); background: rgba(255,240,176,0.08); }

    .prod-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .prod-chip {
        padding: 7px 13px;
        border-radius: 12px;
        background: rgba(160,220,200,0.08);
        border: 1px solid rgba(160,220,200,0.28);
        font-size: 0.82em;
        color: #d8f4ec;
    }
    .prod-chip sub { font-size: 0.7em; }
    .prod-chip span { color: #8fb3a8; font-size: 0.8em; margin-left: 6px; }

    .note-line {
        margin-top: 14px;
        font-size: 0.78em;
        color: #8d8da4;
        line-height: 1.7;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.07);
    }

    /* ==================== 常见实验 ==================== */
    .book-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .book-btn {
        font-size: 0.76em;
        padding: 7px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.09);
        background: rgba(255,255,255,0.035);
        color: #9a9ab2;
        cursor: pointer;
        transition: all .25s;
        font-family: inherit;
    }
    .book-btn:hover {
        color: #e6f4ff;
        background: rgba(255,255,255,0.09);
        border-color: rgba(255,255,255,0.22);
        transform: translateY(-2px);
    }

    /* ==================== 实验记录 ==================== */
    .log-panel { margin-top: 20px; }
    .log-list {
        display: flex; flex-direction: column; gap: 8px;
        max-height: 260px; overflow-y: auto; padding-right: 4px;
    }
    .log-list::-webkit-scrollbar { width: 6px; }
    .log-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }
    .log-item {
        display: flex; gap: 12px; align-items: baseline;
        padding: 10px 14px;
        border-radius: 11px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        font-size: 0.85em;
        animation: chipIn .3s ease;
    }
    .log-time { color: #6f6f88; font-size: 0.8em; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .log-eq { color: #c8c8de; font-family: "Times New Roman", Georgia, serif; }
    .log-eq sub { font-size: 0.7em; }
    .log-item.bad .log-eq { color: #9a9ab2; font-family: inherit; }

    .footer {
        margin-top: 44px;
        text-align: center;
        color: rgba(255,255,255,0.2);
        font-size: 0.85em;
        letter-spacing: 1px;
    }

    /* ==================== 多容器实验台 ==================== */
    .bench-toolbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .bench-toolbar .toggle-line { margin-top: 0; }

    .vessel-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(296px, 1fr));
        gap: 14px;
    }
    .vessel {
        border-radius: 16px;
        padding: 13px 14px;
        background: rgba(255,255,255,0.035);
        border: 1px solid rgba(255,255,255,0.09);
        display: flex; flex-direction: column; gap: 10px;
        transition: border-color .3s, box-shadow .3s;

/* 把 'H2O' 渲染为 H<sub>2</sub>O；'@5' 表示不开下标 */
function renderChem(str) {
    return String(str).split(" ").map(function (tok) {
        var kept = [];
        var t = tok.replace(/@(\d+)/g, function (m, d) {
            kept.push(d);
            return String.fromCharCode(0xE000 + kept.length - 1);
        });
        var lead = "";
        var m = /^(\d+)(?=[A-Z(])/.exec(t);
        if (m) { lead = m[1]; t = t.slice(m[1].length); }
        t = t.replace(/\d+/g, function (d) { return "<sub>" + d + "</sub>"; });
        for (var i = 0; i < kept.length; i++) {
            t = t.split(String.fromCharCode(0xE000 + i)).join(kept[i]);
        }
        return lead + t;
    }).join(" ");
}

/* 单种药品的显示写法（@数字 表示不开下标） */
const DISPLAY = { "CuSO4·5H2O": "CuSO4·@5H2O" };
function renderKey(k) { return renderChem(DISPLAY[k] || k); }

function decorate(str) {
    return String(str)
        .replace(/↑/g, '<span class="ud">↑</span>')
        .replace(/↓/g, '<span class="ud">↓</span>');
}

function parseTerm(t) {
    t = t.trim();
    // 前导的量：数字系数，或加聚反应里的 n
    var m = /^@?(\d+|n)/.exec(t);
    var coef = 1, rest = t;
    if (m) { coef = (m[1] === "n") ? 1 : parseInt(m[1], 10); rest = t.slice(m[0].length); }
    rest = rest.replace(/@/g, "").replace(/[↑↓]/g, "");
    return { key: rest, coef: coef };
}

const RX = REACTIONS.map(function (e) {
    var parts = e[0].split(">");
    var leftStr = parts[0].trim();
    var rightStr = parts[1].trim();
    var left = leftStr.split(/\s*\+\s*/).map(parseTerm);
    var right = rightStr.split(/\s*\+\s*/).map(parseTerm);
    var conds = e[1] ? e[1].split("+") : [];
    var fx = e[4] ? e[4].split(",").filter(Boolean) : [];
    var rawRight = parts[1];
    if (rawRight.indexOf("↑") >= 0) fx.push("有气体生成");
    if (rawRight.indexOf("↓") >= 0) fx.push("有沉淀生成");
    return {
        left: left, right: right, leftStr: leftStr, rightStr: rightStr,
        conds: conds, type: e[2], phen: e[3], fx: fx,
        ion: e[5] || ION_EXTRA[leftStr] || "", rev: e[6] === "rev",
        leftKeys: left.map(function (x) { return x.key; }),
        rightKeys: right.map(function (x) { return x.key; })
    };
});

   容器管理
   ================================================================== */
function newVessel() {
    var i = seed++;
    return { id: "v" + i, name: "容器 " + (LETTERS[i] || (i + 1)), counts: {}, conds: new Set(["room"]) };
}
function findV(id) {
    for (var i = 0; i < vessels.length; i++) if (vessels[i].id === id) return vessels[i];
    return null;
}
function focusV() {
    return (focusId && findV(focusId)) || vessels[0];
}
function vTotal(v) {
    var t = 0;
    for (var k in v.counts) t += v.counts[k];
    return t;
}
function condLabel(v) {
    var label = [];
    v.conds.forEach(function (c) { if (c !== "room") label.push(CN[c]); });
    return label.length ? label.join(" + ") : "常温";
}

function save() {
    try {
        localStorage.setItem(LS_KEY, JSON.stringify({
            seed: seed, keep: keepProducts,
            vessels: vessels.map(function (v) {
                return { id: v.id, name: v.name, counts: v.counts, conds: Array.from(v.conds) };
            })
        }));
    } catch (e) { /* 隐私模式等不计 */ }
}

function load() {
    try {
        var raw = JSON.parse(localStorage.getItem(LS_KEY) || "null");
        if (raw && raw.vessels && raw.vessels.length) {
            vessels = raw.vessels.map(function (v) {
                return {
                    id: v.id, name: v.name, counts: v.counts || {},
                    conds: new Set(v.conds && v.conds.length ? v.conds : ["room"])
                };
            });
            var max = 0;
            vessels.forEach(function (v) { max = Math.max(max, parseInt(v.id.slice(1), 10) || 0); });
            seed = Math.max(raw.seed || 0, max + 1);
            keepProducts = raw.keep !== false;
            return;
        }
    } catch (e) { /* 读取失败则走默认 */ }
    vessels = [newVessel(), newVessel()];
}

        + '<button class="round-btn del" data-act="kick" data-k="' + k + '" title="取出">×</button>'

}

function renderGrid() {

                + "<span>把整个容器倒进：</span>"
                + vessels.filter(function (o) { return o.id !== v.id; }).map(function (o) {
                    return '<button class="vbtn" data-act="dumpto" data-to="' + o.id + '">' + o.name + "</button>";
                }).join("")
                + '<button class="vbtn" data-act="dumpnew">＋ 新容器</button>'
                + '<button class="vbtn del" data-act="cancel">取消</button>'

        }

            + '<div class="vessel-head">'

            + '<span class="vessel-meta">' + (keys.length ? keys.length + " 种 / " + vTotal(v) + " 份" : "空") + "</span>"
            + '<button class="vbtn" data-act="dump"' + (keys.length ? "" : " disabled style=\"opacity:.4\"") + ">倒出全部</button>"
            + (vessels.length > 1 ? '<button class="vbtn del" data-act="kickv">×</button>' : "")
            + "</div>"
            + '<div class="vessel-body">'
            + '<div class="flask mini" data-flask="' + v.id + '"><div class="liquid"></div><div class="sediment"></div></div>'
            + '<div class="vessel-chips">' + body + "</div>"
            + "</div>"
            + '<div class="vessel-conds">' + condsHtml + "</div>"
            + bar
            + '<button class="vbtn react" data-act="react">在这个容器反应</button>'
            + "</div>";
    }).join("");

    html += '<button class="add-vessel" data-act="add">＋ 新容器</button>';
    $("vesselGrid").innerHTML = html;
    vessels.forEach(updateFlask);
}

function updateFlask(v) {
    var f = document.querySelector('[data-flask="' + v.id + '"]');
    if (!f) return;
    var liq = f.querySelector(".liquid"), sed = f.querySelector(".sediment");
    var t = vTotal(v);
    if (!t) { liq.style.height = "0%"; sed.style.height = "0px"; return; }

    var r = 0, g = 0, b = 0, n = 0, solid = 0;
    for (var k in v.counts) {
        var s = SUB_MAP[k];
        if (!s) continue;
        if (s.state === "s") { solid += v.counts[k]; continue; }
        if (s.color) {
            var c = s.color.replace("#", "");
            r += parseInt(c.substr(0, 2), 16);
            g += parseInt(c.substr(2, 2), 16);
            b += parseInt(c.substr(4, 2), 16);
            n++;
        }
    }
    if (n) {
        var col = "rgba(" + Math.round(r / n) + "," + Math.round(g / n) + "," + Math.round(b / n) + ",0.55)";
        liq.style.background = "linear-gradient(180deg, " + col + ", rgba(90,110,140,0.45))";
    } else {
        liq.style.background = "linear-gradient(180deg, rgba(150,180,205,0.5), rgba(100,135,170,0.32))";
    }
    liq.style.height = Math.min(80, 14 + t * 11) + "%";
    sed.style.height = Math.min(24, solid * 4) + "px";
}

/* ==================================================================
   取用药品 / 增减 / 转移
   ================================================================== */
function addSub(k, n) {
    var v = focusV();
    v.counts[k] = (v.counts[k] || 0) + (n || 1);
    save();
    renderGrid();
}

function doTransfer(fromId, toId, key, all) {
    var a = findV(fromId), b = findV(toId);
    if (!a || !b || !a.counts[key]) return;
    var num = all ? a.counts[key] : Math.min(1, a.counts[key]);
    a.counts[key] -= num;
    if (a.counts[key] <= 0) delete a.counts[key];
    b.counts[key] = (b.counts[key] || 0) + num;
    transferSel = null;
    save();
    renderGrid();
    addLog("⇄ " + (SUB_MAP[key] ? SUB_MAP[key].name : key) + " ×" + num + "：" + a.name + " → " + b.name, false);
}

function doDump(fromId, toId) {
    var a = findV(fromId), b = findV(toId);
    if (!a || !b) return;
    for (var k in a.counts) b.counts[k] = (b.counts[k] || 0) + a.counts[k];
    var txt = a.name + " → " + b.name;
    a.counts = {};
    dumpSel = null;
    save();
    renderGrid();
    addLog("⇄ 全部倒出：" + txt, false);
}

/* ==================================================================
   反应引擎（对某个容器）
   ================================================================== */
function condOK(rx, active) {
    return rx.conds.every(function (c) { return active.has(c); });
}

function candidates(avail, conds) {
    var out = [];
    RX.forEach(function (rx) {
        if (!condOK(rx, conds)) return;
        var n = Infinity;
        for (var i = 0; i < rx.left.length; i++) {
            var need = rx.left[i].coef;
            var have = avail[rx.left[i].key] || 0;
            n = Math.min(n, Math.floor(have / need));
            if (n === 0) break;
        }
        if (n >= 1) {
            var rest = 0;
            rx.left.forEach(function (t) { rest += (avail[t.key] || 0) - t.coef * n; });
            out.push({ rx: rx, n: n, rest: rest });
        }
    });
    out.sort(function (a, b) { return a.rest - b.rest; });
    return out;
}

function missingConds(avail, conds) {
    var best = null;
    RX.forEach(function (rx) {
        var ok = true;
        for (var i = 0; i < rx.left.length; i++) {
            if ((avail[rx.left[i].key] || 0) < rx.left[i].coef) { ok = false; break; }
        }
        if (!ok) return;
        var miss = rx.conds.filter(function (c) { return !conds.has(c); });
        if (!miss.length) return;
        if (!best || miss.length < best.length) best = miss;
    });
    return (best || []).map(function (c) { return CN[c]; });
}

function explainNone(avail, conds) {
    var keys = Object.keys(avail);

    for (var h = 0; h < NR_HINTS.length; h++) {
        var hint = NR_HINTS[h];
        if (hint.keys.every(function (k) { return avail[k] > 0; })) {
            return { title: hint.title, text: hint.text, ok: true };
        }
    }

    var miss = missingConds(avail, conds);
    if (miss.length) {
        return {
            title: "看起来差了点火候",
            text: "这些药品的组合本身是可以反应的，但还需要提供：<b>" + miss.join(" / ") + "</b>。<br>点亮容器中的对应条件，再点一次「在这个容器反应」。",
            ok: true
        };
    }

    var metals = keys.filter(function (k) { return SUB_MAP[k] && SUB_MAP[k].cat === "metal"; });
    var acidKeys = ["HCl", "H2SO4稀", "HNO3稀", "HNO3浓", "H2SO4浓"];
    var acids = keys.filter(function (k) { return acidKeys.indexOf(k) >= 0; });
    var salts = keys.filter(function (k) { return SALT_METAL[k]; });

    if (metals.length && acids.length) {
        var m = metals[0];
        var mi = METAL_ORDER.indexOf(m);
        var hi = METAL_ORDER.indexOf("H");
        if (mi > hi) {
            return {
                title: "为什么没有气泡？",
                text: "<b>" + SUB_MAP[m].name + "</b> 在金属活动性顺序中排在<b>氢之后</b>，无法把酸中的氢置换出来，所以看不到气泡。<br>排在氢之前的金属（如 Zn、Fe、Mg）才可能与稀酸反应放出氢气。",
                ok: false
            };
        }
        if (m === "Na" || m === "K" || m === "Ca") {
            return {
                title: "这个组合太活泼了",
                text: "<b>" + SUB_MAP[m].name + "</b> 过于活泼，遇到酸溶液会先和其中的水剧烈反应。<br>可以试试让它单独与水反应。",
                ok: false
            };
        }
    }

    if (metals.length && salts.length) {
        for (var i = 0; i < metals.length; i++) {
            for (var j = 0; j < salts.length; j++) {
                var mm = metals[i], ss = salts[j];
                var ai = METAL_ORDER.indexOf(mm);
                var bi = METAL_ORDER.indexOf(SALT_METAL[ss]);
                if (ai < 0 || bi < 0) continue;
                if (ai < bi) {
                    return {
                        title: "理论上可行，但未收录",
                        text: "<b>" + SUB_MAP[mm].name + "</b> 的活动性强于 <b>" + SUB_MAP[ss].name + "</b> 中的金属，理论上可以发生置换，但本实验台暂未收录这条反应。<br>可以试试铁与硫酸铜、铜与硝酸银这类已收录的组合。",
                        ok: false
                    };
                }
                return {
                    title: "活动性不够，换不出来",
                    text: "<b>" + SUB_MAP[mm].name + "</b> 的活动性弱于盐溶液中的 <b>" + SUB_MAP[ss].name + " 所含金属</b>，无法把它置换出来。<br>口诀：排在前面的金属才能把后面的金属从它的盐溶液里置换出来（K、Ca、Na 除外）。",
                    ok: false
                };
            }
        }
    }

    var quiet = [
        "容器内没有任何肉眼可见的变化。",
        "等了三分钟，什么都没有发生。",
        "既没有气泡，也没有沉淀，更没有颜色变化。",
        "看起来它们相处得很融洽，谁也不搭理谁。"
    ];
    return {
        title: "没有发生反应",
        text: quiet[Math.floor(Math.random() * quiet.length)] + "<br>可能是缺少反应条件，或这组物质之间本来就不反应。<br>复分解反应需要生成<b>沉淀、气体或水</b>，置换反应则要看金属活动性顺序。",
        ok: false
    };
}

function doReact(vid) {
    var v = findV(vid);
    if (!v) return;
    if (!Object.keys(v.counts).length) {
        showFail("容器是空的", "先从左侧试剂架取用药品，或者点一个「经典实验」快速开始。", false, v.name);
        return;
    }

    var avail = {};
    for (var k in v.counts) avail[k] = v.counts[k];

    var cands = candidates(avail, v.conds);
    if (!cands.length) {
        var e = explainNone(avail, v.conds);
        showFail(e.title, e.text, e.ok, v.name);
        addLog(v.name + " 无反应：" + Object.keys(v.counts).map(function (k) {
            return SUB_MAP[k] ? SUB_MAP[k].name : k;
        }).join(" + "), true);
        return;
    }

    var best = cands[0];
    var rx = best.rx, n = best.n;

    rx.left.forEach(function (t) {
        v.counts[t.key] -= t.coef * n;
        if (v.counts[t.key] <= 0) delete v.counts[t.key];
    });

    var produced = [];
    rx.right.forEach(function (t) {
        if (keepProducts) v.counts[t.key] = (v.counts[t.key] || 0) + t.coef * n;
        produced.push({ key: t.key, num: t.coef * n });
    });

    var leftOver = [];
    rx.left.forEach(function (t) {
        if (v.counts[t.key] > 0) leftOver.push({ key: t.key, num: v.counts[t.key] });
    });

    var again = candidates(v.counts, v.conds).length > 0;

    save();
    renderGrid();
    showResult(rx, n, produced, leftOver, again, v.name);
    addLog(v.name + "：" + renderChem(rx.leftStr) + " > " + renderChem(rx.rightStr), false);
    playFx(v, rx);
}

/* ==================================================================
   动画效果
   ================================================================== */
function playFx(v, rx) {
    var f = document.querySelector('[data-flask="' + v.id + '"]');
    if (!f) return;
    f.className = "flask mini";
    void f.offsetWidth;

    var cls = [];
    if (rx.fx.indexOf("有气体生成") >= 0 || rx.fx.indexOf("大量气泡") >= 0 || rx.fx.indexOf("气体产生") >= 0) cls.push("bubbling");
    if (rx.fx.indexOf("放热") >= 0 || rx.fx.indexOf("白光") >= 0 || rx.fx.indexOf("耀眼白光") >= 0) cls.push("glow");
    if (rx.fx.indexOf("爆炸") >= 0 || rx.fx.indexOf("耀眼白光") >= 0 || rx.fx.indexOf("白光") >= 0) cls.push("flash");
    if (cls.length) f.className = "flask mini " + cls.join(" ");

    if (cls.indexOf("bubbling") >= 0) {
        for (var i = 0; i < 8; i++) {
            var b = document.createElement("div");
            b.className = "bubble";
            b.style.left = (6 + Math.random() * 34) + "px";
            b.style.animationDelay = (Math.random() * 1.2) + "s";
            b.style.animationDuration = (1 + Math.random() * 0.8) + "s";
            f.appendChild(b);
        }
    }
    setTimeout(function () {
        var nf = document.querySelector('[data-flask="' + v.id + '"]');
        if (!nf) return;
        nf.className = "flask mini";
        var olds = nf.querySelectorAll(".bubble");
        for (var j = 0; j < olds.length; j++) olds[j].parentNode.removeChild(olds[j]);
    }, 2800);
}

/* ==================================================================
   结果面板
   ================================================================== */
function showResult(rx, n, produced, leftOver, again, vName) {
    var arrowText = rx.conds.length ? rx.conds.map(function (c) { return CN[c]; }).join("、") : "";
    var arr = rx.rev ? '<span class="arrow">⇌</span>' : '<span class="arrow">——' + (arrowText ? arrowText + "——" : "") + "></span>";
    var eqHtml = decorate(renderChem(rx.leftStr)) + " " + arr + " " + decorate(renderChem(rx.rightStr));

    var tags = rx.fx.filter(function (v, i, a) { return v && a.indexOf(v) === i; });
    var danger = tags.indexOf("危险") >= 0;

    var html = '<div class="result-card">'
        + '<div class="result-head">'
        + '<span class="type-badge">' + vName + "</span>"
        + '<span class="type-badge">' + rx.type + "</span>"
        + (n > 1 ? '<span class="type-badge">进行 ' + n + " 组</span>" : "")
        + (rx.rev ? '<span class="type-badge">可逆反应</span>' : "")
        + (danger ? '<span class="warn-badge">危险 · 注意通风</span>' : "")
        + "</div>"
        + '<div class="eq-box">' + eqHtml + "</div>"
        + (rx.ion ? '<div class="ion-box"><span class="ion-label">离子方程式</span>' + rx.ion + "</div>" : "")
        + '<div class="phen-list"><div class="phen-title">实验现象</div>'
        + '<div class="phen-text">' + rx.phen + "</div></div>"
        + '<div class="tag-row">'
        + tags.filter(function (t) { return t !== "危险"; }).map(function (t) {
            var cls = (t.indexOf("放热") >= 0 || t.indexOf("剧烈") >= 0) ? " hot"
                : (t.indexOf("气体") >= 0 || t.indexOf("气泡") >= 0) ? " gas"
                : (t.indexOf("沉淀") >= 0 || t.indexOf("浑") >= 0) ? " pre"
                : (t.indexOf("光") >= 0 || t.indexOf("白烟") >= 0 || t.indexOf("火焰") >= 0) ? " lig" : "";
            return '<span class="tag ' + cls + '">' + t + "</span>";
        }).join("")
        + "</div>"
        + '<div class="prod-row">'
        + produced.map(function (p) {
            var s = SUB_MAP[p.key];
            return '<span class="prod-chip">' + decorate(renderKey(p.key))
                + " <span>×" + p.num + (s ? "　" + s.name : "") + "</span></span>";
        }).join("")
        + "</div>"
        + '<div class="note-line">'
        + (keepProducts ? "产物留在 <b>" + vName + "</b> 中，可以用 ⇄ 转移到其他容器继续实验。" : "产物已被取出，容器中只剩未反应的物质。")
        + (leftOver.length ? "<br>剩余未反应（过量）：" + leftOver.map(function (l) {
            return decorate(renderKey(l.key)) + " ×" + l.num;
        }).join("、") : "<br>反应物恰好完全反应，没有剩余。")
        + (again ? "<br>这个容器里<b>仍有可反应的组合</b>，可以再点一次反应。" : "")
        + (rx.rev ? "<br>这是<b>可逆反应</b>，反应物不可能全部转化，容器中最终仍留有未反应的物质。" : "")
        + "</div></div>";

    $("resultWrap").innerHTML = html;
}

function showFail(title, text, isHint, vName) {
    var html = '<div class="result-card fail">'
        + '<div class="result-head">'
        + (vName ? '<span class="type-badge">' + vName + "</span>" : "")
        + '<span class="type-badge">' + title + "</span>"
        + "</div>"
        + '<div class="phen-text">' + text + "</div>"
        + '<div class="note-line">提示：调整<b>反应条件</b>、药品<b>份数</b>，或把药品<b>转移</b>到别的容器里去试试。</div>'
        + "</div>";
    $("resultWrap").innerHTML = html;
}

function addLog(text, bad) {
    if (!$("logList").dataset.init) {
        $("logList").innerHTML = "";
        $("logList").dataset.init = "1";
    }
    var now = new Date();
    var pad = function (x) { return String(x).padStart(2, "0"); };
    var time = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    var item = document.createElement("div");
    item.className = "log-item" + (bad ? " bad" : "");
    item.innerHTML = '<span class="log-time">' + time + '</span><span class="log-eq">' + text + "</span>";
    $("logList").insertBefore(item, $("logList").firstChild);
    logCount++;
    $("logCount").textContent = "共 " + logCount + " 条";
}

$("vesselGrid").addEventListener("click", function (e) {
    var vesselEl = e.target.closest(".vessel");
    var btn = e.target.closest("button");
    if (!vesselEl && (!btn || btn.dataset.act !== "add")) return;
    var vid = vesselEl ? vesselEl.dataset.vid : null;
    var v = vid ? findV(vid) : null;
    if (!btn) return;
    var act = btn.dataset.act;
    var key = btn.dataset.k;

    if (act === "add") {
        if (vessels.length >= 10) { alert("最多同时开 10 个容器"); return; }
        vessels.push(newVessel());
        save(); renderGrid(); return;
    }
    if (!v) return;

    focusId = vid;

    if (act === "react") { doReact(vid); return; }
    if (act === "inc") { v.counts[key]++; save(); renderGrid(); return; }
    if (act === "dec") { v.counts[key]--; if (v.counts[key] <= 0) delete v.counts[key]; save(); renderGrid(); return; }
    if (act === "kick") { delete v.counts[key]; save(); renderGrid(); return; }
    if (act === "move") { transferSel = { cid: vid, key: key, all: false }; dumpSel = null; renderGrid(); return; }
    if (act === "tfall") { transferSel.all = !transferSel.all; renderGrid(); return; }
    if (act === "cancel") { transferSel = null; dumpSel = null; renderGrid(); return; }
    if (act === "to") { doTransfer(vid, btn.dataset.to, transferSel.key, transferSel.all); return; }
    if (act === "tonew") {
        var nv = newVessel();
        vessels.push(nv);
        doTransfer(vid, nv.id, transferSel.key, transferSel.all);
        return;
    }
    if (act === "dump") { dumpSel = (dumpSel === vid ? null : vid); transferSel = null; renderGrid(); return; }
    if (act === "dumpto") { doDump(vid, btn.dataset.to); return; }
    if (act === "dumpnew") {
        var nv2 = newVessel();
        vessels.push(nv2);
        doDump(vid, nv2.id);
        return;
    }
    if (act === "kickv") {
        vessels = vessels.filter(function (o) { return o.id !== vid; });
        transferSel = null; dumpSel = null;
        save(); renderGrid(); return;
    }
    if (btn.classList.contains("cond-mini")) {
        var id = btn.dataset.cond;
        if (id === "room") {
            v.conds = new Set(["room"]);
        } else {
            if (v.conds.has(id)) v.conds.delete(id); else v.conds.add(id);
            v.conds.delete("room");
            if (v.conds.size === 0) v.conds.add("room");
        }
        save();
        renderGrid();
    }
});

$("bookList").innerHTML = BOOK.map(function (b, i) {
    return '<button class="book-btn" data-i="' + i + '">' + b.n + "</button>";
}).join("");

$("bookList").addEventListener("click", function (e) {
    var b = e.target.closest(".book-btn");
    if (!b) return;
    var cfg = BOOK[+b.dataset.i];
    var list = cfg.v ? cfg.v : [{ subs: cfg.subs, conds: cfg.conds }];
    vessels = list.map(function (c) {
        var nv = newVessel();
        c.subs.forEach(function (s) { nv.counts[s[0]] = s[1]; });
        nv.conds = new Set(c.conds && c.conds.length ? c.conds : ["room"]);
        return nv;
    });
    transferSel = null; dumpSel = null;
    save();
    renderGrid();
    if (vessels.length === 1) doReact(vessels[0].id);
    else {
        $("resultWrap").innerHTML = '<div class="empty-hint">已摆好 ' + vessels.length + ' 个容器<br>分别在各自容器里点击反应，再用 ⇄ 转移药品</div>';
    }
});

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { transferSel = null; dumpSel = null; renderGrid(); }
    if (e.key === "Enter" && document.activeElement !== $("searchBox")) {
        e.preventDefault();
        if (vessels.length) doReact(vessels[0].id);
    }
});

/* 头部日期 */
(function () {
    var W = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    var now = new Date();
    var txt = now.getFullYear() + " 年 " + (now.getMonth() + 1) + " 月 " + now.getDate() + " 日 · " + W[now.getDay()];
    $("headerMeta").textContent = txt + " · 收录 " + RX.length + " 条反应";
})();

/* 初始化 */
load();
renderCats();
renderLib();
renderAll();
</script>
