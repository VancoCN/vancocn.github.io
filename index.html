<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanco的小站</title>

    <!-- 预加载字体 -->
    <link rel="preload" href="alfyt.ttf" as="font" type="font/ttf" crossorigin>

    <style>
        /* ==================== 自定义字体 ==================== */
        @font-face {
            font-family: "AlfytFont";
            src: url("alfyt.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ==================== 全局重置 ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "AlfytFont", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            color: #e8e8e8;
            padding: 20px 40px 60px;
            position: relative;
            z-index: 0;
            background-color: #0a0a0f;
        }

        /* ==================== 背景层 ==================== */
        .bg {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(28px) saturate(1.3) brightness(0.45);
            z-index: -3;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
        }

        .bg.show {
            opacity: 1;
        }

        .dark-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                160deg,
                rgba(10, 10, 20, 0.55) 0%,
                rgba(10, 10, 20, 0.75) 50%,
                rgba(10, 10, 20, 0.6) 100%
            );
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: -2;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            opacity: 0.035;
            z-index: -1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 5px;
        }

        .page-title {
            font-size: 2.4em;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 换背景按钮 */
        .change-bg-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ccc;
            font-family: inherit;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .change-bg-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            color: #fff;
            transform: scale(1.03);
        }

        .change-bg-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            animation: spin 8s linear infinite;
        }

        .change-bg-btn:hover svg {
            animation-duration: 2s;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .header-line {
            border-top: 2px solid rgba(255,255,255,0.12);
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.4em;
            font-weight: 700;
            margin-top: 35px;
            margin-bottom: 16px;
            color: #b0b0d0;
            letter-spacing: 1px;
            padding-left: 4px;
            border-left: 3px solid rgba(160, 160, 220, 0.6);
            padding-left: 12px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tool-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 26px;
            border-radius: 18px;
            text-decoration: none;
            color: #e0e0e0;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow:
                0 4px 24px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.2);

            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                105deg,
                transparent 0%,
                rgba(255,255,255,0.04) 40%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0.04) 60%,
                transparent 100%
            );
            transition: left 0.7s ease;
        }

        .tool-card:hover::before {
            left: 100%;
        }

        .tool-card:hover {
            transform: translateY(-3px) scale(1.01);
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.22);
            box-shadow:
                0 12px 40px rgba(0,0,0,0.4),
                0 0 20px rgba(160,160,220,0.08),
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 -1px 0 rgba(0,0,0,0.15);
        }

        /* 卡片点击 */
        .tool-card:active {
            transform: translateY(-1px) scale(0.998);
        }

        .card-title {
            font-size: 1.25em;
            font-weight: 600;
            min-width: 120px;
            color: #f0f0f0;
        }

        .card-desc {
            flex: 1;
            margin: 0 20px;
            font-size: 0.92em;
            color: #999;
            transition: color 0.3s;
        }

        .tool-card:hover .card-desc {
            color: #c0c0c0;
        }

        .card-play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .tool-card:hover .card-play-btn {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.25);
            transform: scale(1.1);
        }

        .card-play-btn svg {
            width: 20px;
            height: 20px;
            fill: #bbb;
            transition: fill 0.3s;
        }

        .tool-card:hover .card-play-btn svg {
            fill: #fff;
        }

        .footer {
            margin-top: 60px;
            text-align: center;
            color: rgba(255,255,255,0.2);
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .bg-fade {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(28px) saturate(1.3) brightness(0.45);
            z-index: -4;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        .bg-fade.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px 18px 40px;
            }
            .page-title {
                font-size: 1.8em;
            }
            .card-title {
                min-width: 90px;
                font-size: 1.1em;
            }
            .card-desc {
                font-size: 0.85em;
                padding: 0 8px;
                margin: 0 8px;
            }
            .card-play-btn {
                width: 38px;
                height: 38px;
            }
            .change-bg-btn {
                padding: 8px 14px;
                font-size: 0.82em;
            }
        }
    </style>
</head>
<body>


<div class="bg" id="bg"></div>

<div class="bg-fade" id="bgFade"></div>

<div class="dark-overlay"></div>

<div class="noise-overlay"></div>

<div class="page-header">
    <div class="page-title">Vanco的小站</div>
</div>
<div class="header-line"></div>

<!-- ==================== 外部账号 ==================== -->
<div class="category-title">外部账号</div>
<div class="card-list">
    <a href="https://space.bilibili.com/3546566707120309" class="tool-card" target="_blank">
        <div class="card-title">Bilibili</div>
        <div class="card-desc">人畜无害のVanco的个人空间</div>
        <div class="card-play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </a>
</div>

<!-- ==================== 工具类 ==================== -->
<div class="category-title">工具类</div>
<div class="card-list">
    <a href="https://vancocn.github.io/arctools/" class="tool-card" target="_blank">
        <div class="card-title">Arcaea图片处理工具</div>
        <div class="card-desc">纯前端本地处理，不局限于 Arcaea</div>
        <div class="card-play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </a>

    <a href="https://vancocn.github.io/musicplayer.html" class="tool-card" target="_blank">
        <div class="card-title">在线音乐播放器</div>
        <div class="card-desc">Vanco 原创曲 & 下载</div>
        <div class="card-play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </a>
</div>

<!-- ==================== 游戏类 ==================== -->
<div class="category-title">游戏类</div>
<div class="card-list">
    <a href="https://vancocn.github.io/arg-arc/" class="tool-card" target="_blank">
        <div class="card-title">A.R.C.</div>
        <div class="card-desc">SHADOW ARC ORGANIZATION · 桥梁计划（ARG）</div>
        <div class="card-play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
    </a>
</div>

<!-- 底部 -->
<div class="footer"></div>

<!-- ==================== JS ==================== -->
<script>
    // 背景图列表（来自 vancocn.github.io/bg/）
    const bgImages = [
        "0-3.jpg", "1-1.jpg", "1-8.jpg", "1-ZR.jpg",
        "10-5.jpg", "11-2.jpg", "11-8-1.jpg", "12-6-1.jpg",
        "12-X.jpg", "15-4.jpg", "16-7-1.jpg", "16-8.jpg",
        "17-6-1.jpg", "18-1.jpg", "2-8.jpg", "20-6.jpg",
        "21-5-2.jpg", "22-2-1.jpg", "22-5.jpg", "23-2.jpg",
        "23-8.jpg", "E-1_epilogue.jpg", "F-7-2.jpg", "V-10.jpg"
    ];

    const BASE_URL = "https://vancocn.github.io/bg/";
    let currentBgIndex = -1;

    const bgEl = document.getElementById("bg");
    const bgFadeEl = document.getElementById("bgFade");

    // 随机选一张（不与当前重复）
    function getRandomIndex() {
        if (bgImages.length <= 1) return 0;
        let idx;
        do {
            idx = Math.floor(Math.random() * bgImages.length);
        } while (idx === currentBgIndex);
        return idx;
    }

    // 首次加载背景
    function loadInitialBg() {
        currentBgIndex = getRandomIndex();
        const url = `url('${BASE_URL}${bgImages[currentBgIndex]}')`;
        bgEl.style.backgroundImage = url;
        // 触发淡入
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                bgEl.classList.add("show");
            });
        });
    }

    // 切换背景（淡入淡出）
    function changeBackground() {
        const newIndex = getRandomIndex();
        const newUrl = `url('${BASE_URL}${bgImages[newIndex]}')`;

        // 先把新图放进 fade 层
        bgFadeEl.style.backgroundImage = newUrl;
        bgFadeEl.classList.add("show");

        // 等淡入完成后，把主层换掉，再淡出 fade 层
        setTimeout(() => {
            bgEl.style.backgroundImage = newUrl;
            bgFadeEl.classList.remove("show");
            currentBgIndex = newIndex;
        }, 1500); // 与 CSS transition 时间匹配
    }

    // 绑定按钮
    document.getElementById("changeBgBtn").addEventListener("click", changeBackground);

    // 页面加载完成后启动
    window.addEventListener("DOMContentLoaded", loadInitialBg);
</script>

</body>
</html>
