<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>我的创作启动器</title>
<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1b1b1b;
        color: #e5e5e5;
        display: flex;
        height: 100vh;
    }

    /* 侧边栏 */
    #sidebar {
        width: 220px;
        background: #2a2a2a;
        border-right: 1px solid #3a3a3a;
        padding: 16px;
        overflow-y: auto;
    }

    #sidebar h2 {
        font-size: 14px;
        margin: 0 0 12px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .category {
        margin-bottom: 16px;
    }

    .category-title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #ccc;
    }

    .item {
        padding: 6px 8px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 2px;
    }

    .item:hover {
        background: #3a3a3a;
    }

    .item.active {
        background: #4a6fa5;
        color: #fff;
    }

    /* 主区域 */
    #main {
        flex: 1;
        padding: 32px;
        overflow-y: auto;
    }

    .placeholder {
        color: #777;
        font-size: 14px;
        margin-top: 40px;
    }

    .title {
        font-size: 22px;
        margin-bottom: 8px;
    }

    .meta {
        font-size: 13px;
        color: #888;
        margin-bottom: 16px;
    }

    .desc {
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
        white-space: pre-wrap;
    }

    .launch {
        display: inline-block;
        padding: 10px 20px;
        background: #4a6fa5;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
    }

    .launch:hover {
        background: #5a80b5;
    }
</style>
</head>
<body>

<div id="sidebar">
    <h2>分类</h2>
    <div id="nav"></div>
</div>

<div id="main">
    <div class="placeholder">从左侧选择项目</div>
</div>

<script>
/* ===============================
   数据区（只改这里）
   =============================== */
const DATA = {
    categories: [
        { name: "工具" },
        { name: "游戏" }
    ],
    items: [
        {
            id: "arc",
            name: "A.R.C",
            category: "游戏",
            status: "最后更新于2026/8/18",
            shortDesc: "来自A.R.C.组织的神秘网站(ARG)",
            description: "本游戏为ARG游戏,游玩过程中可能需要一定网页基础",
            url: "https://vancocn.github.io/arg-arc/"
        }
    ]
};
const nav = document.getElementById("nav");
const main = document.getElementById("main");

function renderNav() {
    DATA.categories.forEach(cat => {
        const items = DATA.items.filter(i => i.category === cat.name);
        if (!items.length) return;

        const block = document.createElement("div");
        block.className = "category";

        const title = document.createElement("div");
        title.className = "category-title";
        title.textContent = cat.name;
        block.appendChild(title);

        items.forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.textContent = item.name;
            div.onclick = () => selectItem(item, div);
            block.appendChild(div);
        });

        nav.appendChild(block);
    });
}

function selectItem(item, el) {
    document.querySelectorAll(".item").forEach(i => i.classList.remove("active"));
    el.classList.add("active");

    main.innerHTML = `
        <div class="title">${item.name}</div>
        <div class="meta">${item.category} · ${item.status}</div>
        <div class="desc">${item.description}</div>
        <a class="launch" href="${item.url}" target="_blank">启动</a>
    `;
}

renderNav();
</script>

</body>
</html>
