<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanco的小站</title>
    <style>
        /* 全局样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            padding: 20px 40px;
        }

        /* 网页顶部标题 */
        .page-title {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 5px;
            color: #000;
        }

        .header-line {
            border-top: 3px solid #000;
            margin-bottom: 40px;
        }

        /* 分类标题 */
        .category-title {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        /* 卡片列表布局 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 单个卡片样式 (链接) */
        .tool-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 3px solid #000000;
            border-radius: 12px;
            padding: 18px 25px;
            text-decoration: none;
            color: #111;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        /* 卡片悬停效果 */
        .tool-card:hover {
            background-color: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 卡片左侧：工具名 */
        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            min-width: 100px;
        }

        /* 卡片中间：简介 (支持换行，自适应高度) */
        .card-desc {
            flex: 1;
            text-align: center;
            font-size: 1.05em;
            color: #444;
            line-height: 1.5;
            padding: 0 20px;
        }

        /* 卡片右侧：播放按钮图标 */
        .card-play-btn {
            width: 48px;
            height: 48px;
            border: 3px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 20px;
            transition: all 0.2s ease;
        }
        
        /* 悬停时按钮变实心 */
        .tool-card:hover .card-play-btn {
            background-color: #000;
        }

        .tool-card:hover .card-play-btn svg {
            fill: #fff;
        }

        .card-play-btn svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            .card-title {
                font-size: 1.1em;
                min-width: 70px;
            }
            .card-desc {
                font-size: 0.95em;
                padding: 0 10px;
            }
            .card-play-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- 网页标题与分割线 -->
    <div class="page-title">Vanco的在线工具与游戏</div>
    <div class="header-line"></div>

    <!-- ================== 工具类 ================== -->
    <div class="category-title">工具类</div>
    <div class="card-list">
        
        <!-- 卡片 1 -->
        <a href="https://www.example.com/tool1" class="tool-card" target="_blank">
            <div class="card-title">Arcaea曲包封面处理</div>
            <div class="card-desc">在线裁剪图片使其符合Arcaea曲包样式</div>
            <div class="card-play-btn">
                <!-- 播放图标 SVG -->
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </a>

    </div>

    <!-- ================== 游戏类 ================== -->
    <div class="category-title">游戏类</div>
    <div class="card-list">
        
        <!-- 游戏卡片 1 -->
        <a href="https://vancocn.github.io/arg-arc/" class="tool-card" target="_blank">
            <div class="card-title">A.R.C.</div>
            <div class="card-desc">来自A.R.C.组织的神秘网页(ARG游戏,游玩过程中涉及部分网页解密)</div>
            <div class="card-play-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </a>     

    </div>

</body>
</html>
