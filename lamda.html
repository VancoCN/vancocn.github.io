<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamda</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'WenQuanYi Micro Hei', 'Microsoft YaHei', sans-serif;
    background: #fff;
    color: #111;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; }

  /* ===== 通用 UI 容器 ===== */
  .screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; z-index: 10;
  }
  .screen.hidden { display: none; }

  /* ===== 标题界面 ===== */
  #titleScreen h1 {
    font-size: 96px; font-weight: 900; letter-spacing: 12px;
    margin-bottom: 60px; color: #111;
  }
  #titleScreen .btn-group { display: flex; flex-direction: column; gap: 16px; }
  .btn {
    padding: 14px 48px; font-size: 18px; font-weight: 700;
    border: 3px solid #111; background: #fff; color: #111;
    cursor: pointer; letter-spacing: 4px; transition: all .15s;
    min-width: 220px; text-align: center;
  }
  .btn:hover { background: #111; color: #fff; }

  /* ===== 选曲界面 ===== */
  #songSelectScreen { justify-content: flex-start; padding: 40px 20px; overflow-y: auto; }
  #songSelectScreen h2 {
    font-size: 32px; letter-spacing: 6px; margin-bottom: 30px;
  }
  .song-list { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 760px; }
  .song-card {
    border: 3px solid #111; border-radius: 8px; overflow: hidden;
    background: #fff; transition: box-shadow .15s;
  }
  .song-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
  .song-top {
    display: flex; align-items: center; padding: 16px 20px;
    border-bottom: 2px solid #111; gap: 16px;
  }
  .song-info { flex: 1; }
  .song-name { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .song-artist { font-size: 13px; color: #555; margin-top: 2px; }
  .song-meta { font-size: 12px; color: #777; margin-top: 4px; }
  .song-best {
    text-align: center; padding: 0 16px;
    border-left: 2px solid #ccc; border-right: 2px solid #ccc;
    min-width: 120px;
  }
  .song-best .label { font-size: 10px; color: #888; letter-spacing: 2px; }
  .song-best .value { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .song-best .value.lambda { color: #d00; }
  .play-btn {
    width: 48px; height: 48px; border: 3px solid #111; border-radius: 50%;
    background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0;
  }
  .play-btn:hover { background: #111; }
  .play-btn:hover::after { border-left-color: #fff; }
  .play-btn::after {
    content: ''; width: 0; height: 0;
    border-left: 14px solid #111; border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    margin-left: 4px; transition: border-left-color .15s;
  }
  .song-bottom { display: flex; }
  .diff-tab {
    flex: 1; padding: 10px 8px; text-align: center; cursor: pointer;
    border-right: 2px solid #111; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; transition: all .12s; user-select: none;
    display: flex; flex-direction: column; gap: 3px;
  }
  .diff-tab:last-child { border-right: none; }
  .diff-tab .diff-name { font-size: 13px; }
  .diff-tab .diff-lv { font-size: 11px; color: #666; }
  .diff-tab .diff-best { font-size: 11px; font-weight: 800; margin-top: 1px; }
  .diff-tab:hover { background: #f0f0f0; }
  .diff-tab.active { background: #111; color: #fff; }
  .diff-tab.active .diff-lv { color: #ccc; }
  .diff-tab.active .diff-best { color: #fff; }
  .diff-tab.stable.active { background: #2a8; color: #fff; }
  .diff-tab.fragile.active { background: #d80; color: #fff; }
  .diff-tab.chaos.active { background: #d00; color: #fff; }

  .back-btn {
    margin-top: 24px; padding: 10px 32px; font-size: 14px;
    border: 2px solid #111; background: #fff; cursor: pointer;
    letter-spacing: 3px; transition: all .15s;
  }
  .back-btn:hover { background: #111; color: #fff; }

  /* ===== 游戏 HUD ===== */
  #hud {
    position: fixed; top: 0; left: 0; width: 100vw; padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 5; background: rgba(255,255,255,.92);
    border-bottom: 2px solid #111;
  }
  #hud .hud-left { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  #hud .hud-center { font-size: 24px; font-weight: 900; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #hud .hud-right { font-size: 13px; font-weight: 700; }
  #hud .combo { font-size: 13px; font-weight: 700; color: #555; letter-spacing: 1px; }
  #hud .score-row { display: flex; align-items: baseline; gap: 8px; }

  /* ===== 暂停菜单 ===== */
  #pauseMenu {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(255,255,255,.95); z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
  }
  #pauseMenu.hidden { display: none; }
  #pauseMenu h2 { font-size: 36px; letter-spacing: 6px; margin-bottom: 20px; }

  /* ===== 结算界面 ===== */
  #resultScreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #fff; z-index: 25;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
  }
  #resultScreen.hidden { display: none; }
  #resultScreen .rank {
    font-size: 140px; font-weight: 900; letter-spacing: 4px; line-height: 1;
  }
  #resultScreen .rank.lambda { color: #d00; }
  #resultScreen .score { font-size: 42px; font-weight: 800; margin: 8px 0 20px; }
  #resultScreen .stats { font-size: 16px; line-height: 2; text-align: center; }
  #resultScreen .stats span { font-weight: 700; }

  /* ===== 设置界面 ===== */
  #settingsScreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #fff; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 40px;
  }
  #settingsScreen.hidden { display: none; }
  #settingsScreen h2 { font-size: 28px; letter-spacing: 4px; margin-bottom: 10px; }
  .setting-row { display: flex; align-items: center; gap: 16px; width: 420px; }
  .setting-row label { flex: 0 0 140px; font-size: 14px; font-weight: 700; }
  .setting-row input[type=range] { flex: 1; }
  .setting-row .val { flex: 0 0 70px; text-align: right; font-size: 14px; font-weight: 700; }
  .offset-tester { margin-top: 20px; border: 2px solid #111; border-radius: 8px; padding: 20px; width: 500px; }
  .offset-tester h3 { font-size: 16px; margin-bottom: 12px; letter-spacing: 2px; }
  .offset-tester canvas { width: 100%; height: 80px; border: 1px solid #ccc; }
  .offset-tester .stats-row { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>

<!-- ===== 标题界面 ===== -->
<div id="titleScreen" class="screen">
  <h1>LAMDA</h1>
  <div class="btn-group">
    <button class="btn" id="btnStart">START</button>
    <button class="btn" id="btnSettings">SETTINGS</button>
  </div>
</div>

<!-- ===== 选曲界面 ===== -->
<div id="songSelectScreen" class="screen hidden">
  <h2>SELECT CHART</h2>
  <div class="song-list" id="songList"></div>
  <button class="back-btn" id="btnBackTitle">← BACK</button>
</div>

<!-- ===== 游戏界面 ===== -->
<canvas id="gameCanvas"></canvas>
<div id="hud" style="display:none;">
  <div class="hud-left" id="hudSong">—</div>
  <div class="hud-center">
    <div class="score-row"><span id="hudScore">0</span></div>
    <span class="combo" id="hudCombo"></span>
  </div>
  <div class="hud-right" id="hudDiff">—</div>
</div>

<!-- ===== 暂停菜单 ===== -->
<div id="pauseMenu" class="hidden">
  <h2>PAUSED</h2>
  <button class="btn" id="btnResume">RESUME</button>
  <button class="btn" id="btnRestart">RESTART</button>
  <button class="btn" id="btnQuit">QUIT</button>
</div>

<!-- ===== 结算界面 ===== -->
<div id="resultScreen" class="hidden">
  <div class="rank" id="resultRank">S</div>
  <div class="score" id="resultScore">0</div>
  <div class="stats" id="resultStats"></div>
  <div style="display:flex;gap:16px;margin-top:24px;">
    <button class="btn" id="btnResultRetry">RETRY</button>
    <button class="btn" id="btnResultBack">CHART SELECT</button>
  </div>
</div>

<!-- ===== 设置界面 ===== -->
<div id="settingsScreen" class="hidden">
  <h2>SETTINGS</h2>
  <div class="setting-row">
    <label>Music Offset</label>
    <input type="range" id="setOffset" min="-300" max="300" step="5" value="0">
    <span class="val" id="valOffset">0ms</span>
  </div>
  <div class="setting-row">
    <label>Note Speed</label>
    <input type="range" id="setSpeed" min="0.5" max="3.0" step="0.1" value="1.0">
    <span class="val" id="valSpeed">1.0x</span>
  </div>
  <div class="setting-row">
    <label>Volume</label>
    <input type="range" id="setVolume" min="0" max="1" step="0.05" value="0.5">
    <span class="val" id="valVolume">0.50</span>
  </div>
  <div class="offset-tester">
    <h3>OFFSET DIAGNOSTIC</h3>
    <canvas id="offsetCanvas" width="460" height="80"></canvas>
    <div class="stats-row">
      <span>Avg: <b id="diagAvg">—</b></span>
      <span>Max: <b id="diagMax">—</b></span>
      <span>Count: <b id="diagCount">0</b></span>
    </div>
    <button class="btn" id="btnDiagStart" style="margin-top:12px;padding:8px 24px;font-size:14px;">RUN TEST</button>
  </div>
  <button class="btn" id="btnSettingsBack" style="margin-top:20px;">BACK</button>
</div>

<script>
//====================================================================
//  LAMDA — Minimalist B&W Rhythm Game
//  三首内置乐曲（加长版），独立BGM，四分音采音
//====================================================================

// ============ 音符频率表 ============
const NOTE_FREQ = {
  'C2':130.81,'D2':146.83,'E2':164.81,'F2':174.61,'G2':196.00,'A2':220.00,'B2':246.94,
  'C3':261.63,'D3':293.66,'E3':329.63,'F3':349.23,'G3':392.00,'A3':440.00,'B3':493.88,
  'C4':523.25,'D4':587.33,'E4':659.25,'F4':698.46,'G4':783.99,'A4':880.00,'B4':987.77,
  'C5':1046.50,'D5':1174.66,'E5':1318.51,'F5':1396.91,'G5':1567.98,'A5':1760.00,'B5':1975.53,
  'C6':2093.00,'D6':2349.32,'E6':2637.02,
};

// ============ 乐曲定义（加长版） ============
// 每首乐曲有完整结构：前奏→主歌→副歌→桥段→尾奏
// 采音标准：四分音符 = 1 beat = 60/BPM 秒
// 难度规则：
//   stable  — 四分音采音，稀疏（每2拍1个音符）
//   fragile — 四分音采音，中等密度（每拍1个）
//   chaos   — 四分音采音，高密度（每拍1个 + 八分穿插）

const SONGS = [
  //==================================================================
  // 第一首：Endless Test — BPM 120 — C大调 — 约16小节
  // 结构：前奏(2) → 主歌A(4) → 主歌B(4) → 副歌(4) → 尾奏(2)
  //==================================================================
  {
    id: 'endless',
    name: 'Endless Test',
    artist: 'Lamda',
    bpm: 120,
    // 旋律数据：[音符名, 节拍数] 节拍数=0.5为八分,1为四分,2为二分
    melody: [
      // --- 前奏 (2小节, 8拍) ---
      ['C4',1],['E4',1],['G4',1],['C5',1],
      ['B4',1],['G4',1],['E4',1],['C4',2],

      // --- 主歌A (4小节, 16拍) ---
      ['C4',1],['D4',1],['E4',1],['F4',1],
      ['G4',2],['F4',1],['E4',1],
      ['D4',1],['E4',1],['F4',1],['G4',1],
      ['A4',2],['G4',1],['F4',1],

      // --- 主歌B (4小节, 16拍) ---
      ['E4',1],['F4',1],['G4',1],['A4',1],
      ['G4',2],['F4',1],['E4',1],
      ['D4',1],['E4',1],['C4',1],['D4',1],
      ['E4',2],['D4',1],['C4',1],

      // --- 副歌 (4小节, 16拍) ---
      ['C5',1],['B4',1],['A4',1],['G4',1],
      ['A4',1],['G4',1],['F4',1],['E4',1],
      ['F4',1],['E4',1],['D4',1],['C4',1],
      ['G4',1],['A4',1],['G4',1],['F4',2],

      // --- 尾奏 (2小节, 8拍) ---
      ['E4',1],['C4',1],['G3',1],['C4',1],
      ['E4',2],['C4',2],
    ],
    // 低音伴奏：每小节一个根音（16小节）
    bass: [
      ['C3',4],['F2',4],['G2',4],['C3',4],
      ['F2',4],['G2',4],['A2',4],['G2',4],
      ['F2',4],['G2',4],['C3',4],['F2',4],
      ['G2',4],['C3',4],['F2',4],['C2',4],
    ],
    difficulties: {
      stable:  { level: 3, pattern: 'quarter_sparse' },
      fragile: { level: 6, pattern: 'quarter_dense' },
      chaos:   { level: 9, pattern: 'eighth_mixed' },
    }
  },

  //==================================================================
  // 第二首：First Steps — BPM 100 — F大调 — 约18小节
  // 结构：前奏(2) → 主歌A(4) → 间奏(2) → 主歌B(4) → 副歌(4) → 尾奏(2)
  //==================================================================
  {
    id: 'first_steps',
    name: 'First Steps',
    artist: 'Lamda',
    bpm: 100,
    melody: [
      // --- 前奏 (2小节, 8拍) ---
      ['F4',1],['A4',1],['C5',1],['A4',1],
      ['G4',1],['A4',1],['F4',1],['G4',2],

      // --- 主歌A (4小节, 16拍) ---
      ['F4',1],['G4',1],['A4',2],['A4',1],['G4',1],
      ['A4',1],['C5',1],['D5',2],['C5',1],['A4',1],
      ['G4',1],['A4',1],['F4',2],['F4',1],['G4',1],
      ['A4',1],['G4',1],['F4',2],['F4',2],

      // --- 间奏 (2小节, 8拍) ---
      ['C5',1],['Bb4',1],['A4',1],['G4',1],
      ['A4',1],['G4',1],['F4',1],['G4',2],

      // --- 主歌B (4小节, 16拍) ---
      ['A4',1],['G4',1],['F4',1],['G4',1],
      ['A4',2],['G4',1],['F4',1],
      ['G4',1],['F4',1],['A4',1],['C5',1],
      ['D5',2],['C5',1],['A4',1],

      // --- 副歌 (4小节, 16拍) ---
      ['C5',1],['D5',1],['C5',1],['A4',1],
      ['G4',1],['A4',1],['F4',1],['G4',1],
      ['A4',2],['C5',1],['D5',1],
      ['C5',1],['A4',1],['G4',1],['F4',1],['G4',1],

      // --- 尾奏 (2小节, 8拍) ---
      ['F4',2],['G4',1],['A4',1],
      ['G4',1],['F4',1],['F4',2],
    ],
    bass: [
      ['F2',4],['A2',4],['C3',4],['F2',4],
      ['A2',4],['C3',4],['F2',4],['A2',4],
      ['Bb2',4],['F2',4],['C3',4],['F2',4],
      ['A2',4],['C3',4],['F2',4],['C3',4],
      ['F2',4],['F2',4],
    ],
    difficulties: {
      stable:  { level: 1, pattern: 'quarter_sparse' },
      fragile: { level: 4, pattern: 'quarter_dense' },
      chaos:   { level: 7, pattern: 'eighth_mixed' },
    }
  },

  //==================================================================
  // 第三首：Black & White — BPM 120 — A小调 — 约18小节
  // 结构：前奏(2) → 主歌A(4) → 间奏(2) → 主歌B(4) → 副歌(4) → 桥段(2) → 尾奏(2)
  //==================================================================
  {
    id: 'black_white',
    name: 'Black & White',
    artist: 'Lamda',
    bpm: 120,
    melody: [
      // --- 前奏 (2小节, 8拍) ---
      ['A4',0.5],['C5',0.5],['E5',1],['D5',1],['C5',1],['A4',0.5],['C5',0.5],
      ['E5',1],['D5',1],['C5',1],['A4',2],

      // --- 主歌A (4小节, 16拍) ---
      ['A4',0.5],['C5',0.5],['E5',1],['G5',1],['A5',2],['G5',1],['E5',1],
      ['C5',0.5],['E5',0.5],['G5',1],['E5',1],['D5',1],['C5',0.5],['D5',0.5],
      ['E5',1],['C5',1],['A4',2],['A4',1],['C5',1],
      ['E5',0.5],['D5',0.5],['C5',1],['A4',1],['C5',1],['E5',1],['D5',1],['C5',1],

      // --- 间奏 (2小节, 8拍) ---
      ['E5',0.5],['G5',0.5],['A5',1],['G5',1],['E5',1],['D5',1],
      ['C5',1],['A4',2],

      // --- 主歌B (4小节, 16拍) ---
      ['C5',0.5],['D5',0.5],['E5',1],['F5',1],['E5',1],['D5',0.5],['C5',0.5],
      ['D5',1],['C5',1],['A4',2],['C5',1],['D5',1],
      ['E5',0.5],['G5',0.5],['A5',1],['G5',1],['E5',1],['D5',0.5],['C5',0.5],
      ['D5',1],['C5',1],['A4',2],['A4',1],['C5',1],

      // --- 副歌 (4小节, 16拍) ---
      ['E5',0.5],['G5',0.5],['A5',1],['C6',1],['A5',1],['G5',0.5],['E5',0.5],
      ['A5',1],['G5',1],['E5',1],['D5',1],['C5',1],['A4',1],
      ['C5',0.5],['E5',0.5],['G5',1],['A5',1],['G5',1],['E5',0.5],['D5',0.5],
      ['E5',1],['C5',1],['A4',2],['A4',2],

      // --- 桥段 (2小节, 8拍) ---
      ['C5',0.5],['D5',0.5],['E5',1],['G5',1],['A5',1],['G5',0.5],['E5',0.5],
      ['D5',1],['C5',1],['A4',2],

      // --- 尾奏 (2小节, 8拍) ---
      ['A4',0.5],['C5',0.5],['E5',1],['D5',1],['C5',1],['A4',0.5],['C5',0.5],
      ['A4',2],['A4',2],
    ],
    bass: [
      ['A2',4],['C3',4],['E3',4],['A2',4],
      ['C3',4],['E3',4],['A2',4],['C3',4],
      ['E3',4],['A2',4],['C3',4],['E3',4],
      ['A2',4],['C3',4],['E3',4],['A2',4],
      ['C3',4],['A2',4],
    ],
    difficulties: {
      stable:  { level: 2, pattern: 'quarter_sparse' },
      fragile: { level: 5, pattern: 'quarter_dense' },
      chaos:   { level: 8, pattern: 'eighth_mixed' },
    }
  },
];

// ============ 从旋律生成谱面音符 ============
// pattern 类型：
//   'quarter_sparse' — 每2拍采1个，交替 Tap/Hold
//   'quarter_dense'  — 每个四分音都采
//   'eighth_mixed'   — 每拍一个音符，部分八分穿插，最密
function generateNotes(song, pattern) {
  const notes = [];
  const beatDur = 60 / song.bpm;
  const leadIn = 2.0;

  // 计算总小节数
  const melodyBeats = song.melody.reduce((s, m) => s + m[1], 0);
  const totalMeasures = Math.ceil(melodyBeats / 4);
  const totalBeats = totalMeasures * 4;

  if (pattern === 'quarter_sparse') {
    // 每2拍一个音符，交替 Tap/Hold
    for (let beat = 0; beat < totalBeats; beat += 2) {
      const t = leadIn + beat * beatDur;
      const type = (beat % 4 === 0) ? 'tap' : 'hold';
      notes.push({ time: t, type });
    }
  }
  else if (pattern === 'quarter_dense') {
    // 每拍一个音符（四分音全采）
    for (let beat = 0; beat < totalBeats; beat++) {
      const t = leadIn + beat * beatDur;
      const type = (beat % 4 === 3) ? 'hold' : 'tap';
      notes.push({ time: t, type });
    }
  }
  else if (pattern === 'eighth_mixed') {
    // 高难：跟随旋律节奏，每个音符对应一个谱面音符
    let currentTime = leadIn;
    song.melody.forEach((m, i) => {
      const dur = m[1] * beatDur;
      if (m[1] <= 0.5) {
        // 八分音符：直接采
        const type = (i % 5 === 4) ? 'hold' : 'tap';
        notes.push({ time: currentTime, type });
      } else {
        // 四分/二分：采一个
        const type = (i % 4 === 3) ? 'hold' : 'tap';
        notes.push({ time: currentTime, type });
        // 二分音符中间再插一个（更高密度）
        if (m[1] >= 2) {
          notes.push({ time: currentTime + dur * 0.5, type: 'tap' });
        }
      }
      currentTime += dur;
    });
  }

  return notes;
}

// ============ 从旋律生成 BGM 音频事件 ============
function generateBGM(song) {
  const events = [];
  const beatDur = 60 / song.bpm;
  const leadIn = 2.0;

  // 旋律
  let t = leadIn;
  song.melody.forEach(m => {
    const dur = m[1] * beatDur * 0.9;
    const freq = NOTE_FREQ[m[0]] || 440;
    events.push({ time: t, dur, freq, voice: 'lead' });
    t += m[1] * beatDur;
  });

  // 低音（循环整首时长）
  const melodyTotalTime = t - leadIn;
  const bassLoopBeats = song.bass.reduce((s, b) => s + b[1], 0);
  const bassLoopTime = bassLoopBeats * beatDur;
  const loopCount = Math.ceil(melodyTotalTime / bassLoopTime) || 1;

  for (let loop = 0; loop < loopCount; loop++) {
    let bt = leadIn + loop * bassLoopTime;
    song.bass.forEach(b => {
      const dur = b[1] * beatDur * 0.85;
      const freq = NOTE_FREQ[b[0]] || 130;
      events.push({ time: bt, dur, freq, voice: 'bass' });
      bt += b[1] * beatDur;
    });
  }

  return events;
}

// ============ Canvas ============
const canvas = ui.game;

}

// ============ 工具函数 ============
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

const SFX_FREQS = {
  tap: 880, hold: 660, perfect: 1200, good: 900, lost: 220,
};

// ============ 音频系统 ============
function initAudio() {
  if (state.audioCtx) {
    state.audioCtx.close();
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  state.audioCtx = new AC();
  state.audioStarted = false;
}

function playTone(freq, dur, vol, type, startTime) {
  if (!state.audioCtx) return;
  const ac = state.audioCtx;
  const t0 = startTime !== undefined ? startTime : ac.currentTime;

  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type = type || 'sine';
  osc.frequency.value = freq;

  const v = (vol || 0.3) * state.volume;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(v, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function scheduleChartAudio(chart) {
  if (state.audioStarted) return;
  state.audioStarted = true;

  const ac = state.audioCtx;
  if (!ac) return;

  const offsetSec = state.offset / 1000;
  const playBase = state.audioStartCtxTime - offsetSec;
  const now = ac.currentTime;

  // 调度谱面判定音效
  chart.notes.forEach(note => {
    const startTime = playBase + note.time;
    if (startTime < now) return;
    const freq = note.type === 'hold' ? SFX_FREQS.hold : SFX_FREQS.tap;
    scheduleHitSound(startTime, freq, 0.08, 'square');
  });

  // 调度 BGM（循环覆盖整首谱面）
  scheduleBGM(playBase, now);
}

function scheduleHitSound(startTime, freq, dur, type) {
  if (!state.audioCtx) return;
  const ac = state.audioCtx;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const v = 0.15 * state.volume;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(v, startTime + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(startTime);
  osc.stop(startTime + dur + 0.02);
}

function scheduleBGM(playBase, now) {
  if (!state.audioCtx || state.bgmEvents.length === 0) return;
  const ac = state.audioCtx;

  // 计算需要循环的次数以覆盖整首谱面
  const lastNoteTime = state.notes.length > 0
    ? state.notes[state.notes.length - 1].time : state.bgmLoopLen;
  const chartDuration = lastNoteTime + 4;
  const loopLen = state.bgmLoopLen || 16;
  const loops = Math.ceil(chartDuration / loopLen) + 1;

  for (let loop = 0; loop < loops; loop++) {
    const loopOffset = playBase + loop * loopLen;
    state.bgmEvents.forEach(ev => {
      const t = loopOffset + ev.time;
      if (t < now) return;
      if (t > now + 300) return; // 最多预调度5分钟

      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = ev.voice === 'lead' ? 'triangle' : 'sine';
      osc.frequency.value = ev.freq;

      const v = (ev.voice === 'lead' ? 0.10 : 0.14) * state.volume;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(v, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + ev.dur);

      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + ev.dur + 0.05);
    });
  }
}

function stopAllAudio() {
  if (state.audioCtx) {
    state.audioCtx.close();
    state.audioCtx = null;
  }
  state.audioStarted = false;
}

// ============ 时间计算 ============
function getChartTime() {
  if (!state.audioCtx) return 0;
  return state.audioCtx.currentTime - state.audioStartCtxTime + state.offset / 1000;
}

// ============ 谱面管理 ============
function getSongById(id) {
  return SONGS.find(s => s.id === id);
}

function loadChart(chartId, difficulty) {
  const song = getSongById(chartId);
  if (!song) return null;

  const diffData = song.difficulties[difficulty];
  const notes = generateNotes(song, diffData.pattern);

  return {
    id: chartId,
    name: song.name,
    artist: song.artist,
    bpm: song.bpm,
    difficulty: difficulty,
    level: diffData.level,
    notes: notes.map(n => ({ ...n, hit: false, missed: false, judged: false })),
  };
}

// ============ 判定逻辑 ============
const PERFECT_WINDOW = 0.050;
const GOOD_WINDOW = 0.120;
const HOLD_WINDOW = 0.200;

function attemptHit() {
  if (state.paused || !state.running) return;
  const now = getChartTime();

  for (const note of state.notes) {
    if (note.judged || note.type !== 'tap') continue;
    const diff = now - note.time;
    if (Math.abs(diff) <= PERFECT_WINDOW) {
      judgeNote(note, 'perfect');
      return;
    } else if (Math.abs(diff) <= GOOD_WINDOW) {
      judgeNote(note, 'good');
      return;
    }
  }

  if (state.diagRunning) {
    state.diagHits.push({ expected: 0, actual: now, diff: 0 });
  }
}

function judgeNote(note, result) {
  if (note.judged) return;
  note.judged = true;
  if (result === 'perfect') {
    state.rawScore += 1000;
    state.perfectCount++;
    state.combo++;
    spawnParticles('perfect');
    playTone(SFX_FREQS.perfect, 0.06, 0.2, 'sine');
    pushJudgeText('PERFECT', 'perfect');
    flashRing('perfect');
  } else if (result === 'good') {
    state.rawScore += 500;
    state.goodCount++;
    state.combo++;
    spawnParticles('good');
    playTone(SFX_FREQS.good, 0.06, 0.15, 'sine');
    pushJudgeText('GOOD', 'good');
    flashRing('good');
  }
  state.maxCombo = Math.max(state.maxCombo, state.combo);
}

function judgeHoldPassive(note) {
  if (note.judged) return;
  const now = getChartTime();
  if (now >= note.time && now <= note.time + HOLD_WINDOW) {
    if (state.keysHeld > 0) {
      note.judged = true;
      state.rawScore += 1000;
      state.perfectCount++;
      state.combo++;
      state.maxCombo = Math.max(state.maxCombo, state.combo);
      spawnParticles('perfect');
      playTone(SFX_FREQS.perfect, 0.08, 0.2, 'sine');
      pushJudgeText('PERFECT', 'perfect');
      flashRing('perfect');
    }
  }
}

function checkMissedNotes() {
  const now = getChartTime();
  for (const note of state.notes) {
    if (note.judged) continue;
    if (note.type === 'tap') {
      if (now > note.time + GOOD_WINDOW) {
        note.judged = true;
        state.lostCount++;
        state.combo = 0;
        spawnParticles('lost');
        playTone(SFX_FREQS.lost, 0.1, 0.15, 'sawtooth');
        pushJudgeText('LOST', 'lost');
        flashRing('lost');
      }
    } else if (note.type === 'hold') {
      if (state.keysHeld > 0) {
        if (now > note.time + HOLD_WINDOW + 0.30) {
          note.judged = true;
          state.lostCount++;
          state.combo = 0;
          pushJudgeText('LOST', 'lost');
          flashRing('lost');
        }
      } else {
        if (now > note.time + HOLD_WINDOW) {
          note.judged = true;
          state.lostCount++;
          state.combo = 0;
          spawnParticles('lost');
          playTone(SFX_FREQS.lost, 0.1, 0.15, 'sawtooth');
          pushJudgeText('LOST', 'lost');
          flashRing('lost');
        }
      }
    }
  }
}

// ============ 判定文字 & 特效 ============
function pushJudgeText(text, type) {
  const ringYpx = state.ringY * H;
  const ringX = W * 0.22;
  state.judgeTexts.push({
    text: text,
    type: type,
    x: ringX,
    y: ringYpx - 42,
    life: 0.5,
    maxLife: 0.5,
    vy: -20,
  });
}

function flashRing(type) {
  state.ringFlash = 0.6;
  state.ringFlashType = type;
  state.ringScale = 1.0;
}

function updateJudgeTexts(dt) {
  for (let i = state.judgeTexts.length - 1; i >= 0; i--) {
    const jt = state.judgeTexts[i];
    jt.life -= dt;
    jt.y += jt.vy * dt;
    if (jt.life <= 0) state.judgeTexts.splice(i, 1);
  }
}

function updateRingFlash(dt) {
  state.ringFlash = Math.max(0, state.ringFlash - dt * 5.0);
  state.ringScale = 1.0;
}

// ============ 粒子系统 ============
function spawnParticles(type) {
  const ringYpx = state.ringY * H;
  const ringX = W * 0.22;
  const count = type === 'perfect' ? 5 : (type === 'good' ? 3 : 2);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 40 + Math.random() * 50;
    state.particles.push({
      x: ringX,
      y: ringYpx,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.25 + Math.random() * 0.15,
      maxLife: 0.4,
      size: 1.5 + Math.random() * 1.5,
      type: type,
    });
  }
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
}

// ============ 渲染 ============
function getNoteScreenPos(note, chartTime) {
  const travel = state.travelTime / state.noteSpeed;
  const progress = (chartTime - note.time) / travel + 1;
  const ringX = W * 0.22;
  const spawnX = W * 1.05;
  const x = lerp(spawnX, ringX, clamp(progress, -0.5, 1.5));
  const y = state.ringY * H;
  return { x, y, progress };
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const chartTime = getChartTime();

  // ---- 音轨 ----
  const trackY = state.ringY * H;
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 8]);

  const midX = W * 0.6;
  const ctrlOffset = Math.sin(state.ringPhase * 0.8) * 30;

  ctx.beginPath();
  ctx.moveTo(W * 1.02, trackY);
  ctx.quadraticCurveTo(midX, trackY + ctrlOffset, W * 0.22, trackY);
  ctx.stroke();

  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W * 1.02, trackY - 20);
  ctx.quadraticCurveTo(midX, trackY - 20 + ctrlOffset * 0.7, W * 0.22, trackY - 20);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W * 1.02, trackY + 20);
  ctx.quadraticCurveTo(midX, trackY + 20 + ctrlOffset * 0.7, W * 0.22, trackY + 20);
  ctx.stroke();
  ctx.setLineDash([]);

  // ---- 判定环 ----
  const ringX = W * 0.22;
  const ringR = 36 * state.ringScale;
  const flash = state.ringFlash;

  if (flash > 0.05) {
    const flashColors = {
      perfect: 'rgba(0,0,0,',
      good: 'rgba(100,100,100,',
      lost: 'rgba(180,180,180,',
    };
    const prefix = flashColors[state.ringFlashType] || 'rgba(0,0,0,';
    ctx.beginPath();
    ctx.arc(ringX, trackY, ringR + 4, 0, Math.PI * 2);
    ctx.fillStyle = prefix + (flash * 0.18).toFixed(3) + ')';
    ctx.fill();
  }

  ctx.strokeStyle = '#111';
  ctx.lineWidth = 3 + flash * 1.5;
  ctx.beginPath();
  ctx.arc(ringX, trackY, ringR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(ringX, trackY, 24 * state.ringScale, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // 上下箭头
  ctx.fillStyle = '#111';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('▲', ringX, trackY - 50);
  ctx.fillText('▼', ringX, trackY + 58);

  // ---- 音符 ----
  for (const note of state.notes) {
    if (note.judged) continue;
    const pos = getNoteScreenPos(note, chartTime);
    if (pos.progress < -0.3) continue;

    let alpha = 1.0;
    if (pos.progress > 1.0) {
      alpha = clamp(1.0 - (pos.progress - 1.0) / 0.35, 0, 1);
    }
    if (alpha <= 0.02) continue;

    ctx.save();
    ctx.globalAlpha = alpha;

    if (note.type === 'tap') {
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const s = 16;
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 3;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y - s);
      ctx.lineTo(pos.x + s * 1.2, pos.y);
      ctx.lineTo(pos.x, pos.y + s);
      ctx.lineTo(pos.x - s * 1.2, pos.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- 粒子 ----
  for (const p of state.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.type === 'perfect' ? '#111' : (p.type === 'good' ? '#555' : '#999');
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---- 按键状态指示 ----
  if (state.keysHeld > 0) {
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 3;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(ringX, trackY, 44, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ---- 判定文字 ----
  for (const jt of state.judgeTexts) {
    const a = clamp(jt.life / jt.maxLife, 0, 1) * 0.7;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(jt.x, jt.y);
    let fontSize = 18;
    if (jt.type === 'perfect') {
      ctx.font = `800 ${fontSize}px 'WenQuanYi Micro Hei', sans-serif`;
      ctx.fillStyle = '#222';
    } else if (jt.type === 'good') {
      ctx.font = `700 ${fontSize}px 'WenQuanYi Micro Hei', sans-serif`;
      ctx.fillStyle = '#666';
    } else {
      ctx.font = `700 ${fontSize}px 'WenQuanYi Micro Hei', sans-serif`;
      ctx.fillStyle = '#aaa';
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(jt.text, 0, 0);
    ctx.restore();
  }

  if (state.diagRunning) drawDiagOverlay();
}

function drawDiagOverlay() {
  const y = H - 60;
  const x0 = W * 0.1;
  const x1 = W * 0.9;
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo((x0 + x1) / 2, y - 15);
  ctx.lineTo((x0 + x1) / 2, y + 15);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#111';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('DIAGNOSTIC MODE — Press any key on the beat', (x0 + x1) / 2, y + 35);
}

// ============ 游戏主循环 ============
let animFrameId = null;

function gameLoop(timestamp) {
  if (!state.running) return;
  if (state.paused) return;

  const dt = Math.min((timestamp - state.lastFrame) / 1000, 0.05);
  state.lastFrame = timestamp;

  // 判定环运动（按歌曲情绪）
  updateRingMotion(dt);

  updateParticles(dt);
  updateJudgeTexts(dt);
  updateRingFlash(dt);

  for (const note of state.notes) {
    if (note.type === 'hold' && !note.judged) {
      judgeHoldPassive(note);
    }
  }

  checkMissedNotes();

  const chartTime = getChartTime();
  const lastNote = state.notes[state.notes.length - 1];
  if (lastNote && chartTime > lastNote.time + 3.0) {
    endGame();
    return;
  }

  render();
  updateHUD();
  animFrameId = requestAnimationFrame(gameLoop);
}

function updateRingMotion(dt) {
  // 根据歌曲和难度决定运动幅度
  const song = getSongById(state.chartId);
  if (!song) {
    state.ringPhase += dt * 0.8;
    state.ringY = 0.50 + 0.17 * Math.sin(state.ringPhase);
    return;
  }

  state.ringPhase += dt;

  // 运动参数表
  const motionParams = {
    'endless': {
      stable:  { amp: 0.06, period: 8.0, jitter: 0,    jitterFreq: 0 },
      fragile: { amp: 0.12, period: 6.0, jitter: 0.02, jitterFreq: 2 },
      chaos:   { amp: 0.18, period: 4.0, jitter: 0.04, jitterFreq: 3 },
    },
    'first_steps': {
      stable:  { amp: 0.10, period: 6.0, jitter: 0,    jitterFreq: 0 },
      fragile: { amp: 0.16, period: 4.5, jitter: 0.03, jitterFreq: 2.5 },
      chaos:   { amp: 0.24, period: 3.0, jitter: 0.05, jitterFreq: 4 },
    },
    'black_white': {
      stable:  { amp: 0.18, period: 5.0, jitter: 0.03, jitterFreq: 3 },
      fragile: { amp: 0.26, period: 3.5, jitter: 0.06, jitterFreq: 4 },
      chaos:   { amp: 0.32, period: 2.5, jitter: 0.08, jitterFreq: 5 },
    },
  };

  const params = (motionParams[song.id] && motionParams[song.id][state.difficulty])
    || { amp: 0.15, period: 5.0, jitter: 0.03, jitterFreq: 2 };

  const sinComp = params.amp * Math.sin((state.ringPhase * 2 * Math.PI) / params.period);

  let jitterComp = 0;
  if (params.jitter > 0) {
    const phase = (state.ringPhase * params.jitterFreq) % 1;
    jitterComp = params.jitter * (2 * phase - 1);
  }

  let target = 0.50 + sinComp + jitterComp;
  target = clamp(target, 0.20, 0.85);
  // 平滑过渡
  state.ringY += (target - state.ringY) * Math.min(dt * 8, 1);
}

function updateHUD() {
  const maxScore = state.maxRawScore;
  const normalized = maxScore > 0 ? Math.round((state.rawScore / maxScore) * 1000000) : 0;
  ui.hudScore.textContent = normalized.toLocaleString();
  ui.hudCombo.textContent = state.combo >= 2 ? `Combo x${state.combo}` : '';
}

// ============ 游戏控制 ============
function startChart(chartId, difficulty) {
  const chart = loadChart(chartId, difficulty);
  if (!chart) return;

  const song = getSongById(chartId);

  state.chartId = chartId;
  state.difficulty = difficulty;
  state.chart = chart;
  state.notes = chart.notes;
  state.rawScore = 0;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.perfectCount = 0;
  state.goodCount = 0;
  state.lostCount = 0;
  state.particles = [];
  state.judgeTexts = [];
  state.ringFlash = 0;
  state.ringScale = 1.0;
  state.keysHeld = 0;
  state.holdActive = false;
  state.ringPhase = 0;
  state.ringY = 0.5;
  state.maxRawScore = chart.notes.length * 1000;

  // 生成 BGM 事件
  state.bgmEvents = generateBGM(song);
  // 计算 BGM 时长
  const beatDur = 60 / song.bpm;
  const melodyBeats = song.melody.reduce((s, m) => s + m[1], 0);
  const totalMeasures = Math.ceil(melodyBeats / 4);
  const loopLen = totalMeasures * 4 * beatDur;
  state.bgmDuration = loopLen;
  state.bgmLoopLen = loopLen;
  state.bgmLeadIn = 2.0;

  initAudio();
  if (state.audioCtx) {
    state.audioStartCtxTime = state.audioCtx.currentTime + 0.1;
    scheduleChartAudio(chart);
  }

  ui.select.classList.add('hidden');
  ui.title.classList.add('hidden');
  ui.result.classList.add('hidden');
  ui.pause.classList.add('hidden');
  ui.hud.style.display = 'flex';
  state.running = true;
  state.paused = false;
  state.screen = 'game';

  ui.hudSong.textContent = `${chart.name} / ${chart.artist}`;
  ui.hudDiff.textContent = `${difficulty.toUpperCase()} Lv.${chart.level}`;

  state.lastFrame = performance.now();
  if (animFrameId) cancelAnimationFrame(animFrameId);
  animFrameId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if (!state.running || state.paused) return;
  state.paused = true;
  if (state.audioCtx && state.audioCtx.state === 'running') {
    state.audioCtx.suspend();
  }
  ui.pause.classList.remove('hidden');
}

function resumeGame() {
  if (!state.paused) return;
  state.paused = false;
  if (state.audioCtx && state.audioCtx.state === 'suspended') {
    state.audioCtx.resume();
  }
  ui.pause.classList.add('hidden');
  state.lastFrame = performance.now();
  animFrameId = requestAnimationFrame(gameLoop);
}

function restartChart() {
  stopAllAudio();
  state.audioStarted = false;
  ui.pause.classList.add('hidden');
  ui.result.classList.add('hidden');
  startChart(state.chartId, state.difficulty);
}

function quitToSelect() {
  stopAllAudio();
  state.running = false;
  state.paused = false;
  state.audioStarted = false;
  ui.hud.style.display = 'none';
  ui.pause.classList.add('hidden');
  ui.result.classList.add('hidden');
  ui.game.style.display = 'block';
  buildSongSelect();
  ui.select.classList.remove('hidden');
  state.screen = 'select';
}

function endGame() {
  state.running = false;
  stopAllAudio();
  ui.hud.style.display = 'none';

  const maxScore = state.maxRawScore;
  const normalized = maxScore > 0 ? Math.round((state.rawScore / maxScore) * 1000000) : 0;

  let rank, rankClass;
  if (normalized >= 1000000) { rank = 'λ'; rankClass = 'lambda'; }
  else if (normalized >= 950000) { rank = 'S'; rankClass = ''; }
  else if (normalized >= 880000) { rank = 'A'; rankClass = ''; }
  else if (normalized >= 800000) { rank = 'B'; rankClass = ''; }
  else if (normalized >= 700000) { rank = 'C'; rankClass = ''; }
  else { rank = 'F'; rankClass = ''; }

  const key = `${state.chartId}_${state.difficulty}`;
  const prev = parseInt(localStorage.getItem('lamda_best_' + key) || '0');
  if (normalized > prev) {
    localStorage.setItem('lamda_best_' + key, String(normalized));
  }

  ui.resultRank.textContent = rank;
  ui.resultRank.className = 'rank' + (rankClass ? ' ' + rankClass : '');
  ui.resultScore.textContent = normalized.toLocaleString();
  ui.resultStats.innerHTML = `
    Perfect: <span>${state.perfectCount}</span> &nbsp;
    Good: <span>${state.goodCount}</span> &nbsp;
    Lost: <span>${state.lostCount}</span><br>
    Max Combo: <span>${state.maxCombo}</span> &nbsp;
    Accuracy: <span>${maxScore > 0 ? Math.round(state.rawScore / maxScore * 100) : 0}%</span>
  `;
  ui.result.classList.remove('hidden');
}

// ============ 选曲界面 ============
function buildSongSelect() {
  const container = document.getElementById('songList');
  container.innerHTML = '';

  SONGS.forEach((song, idx) => {
    const selDiff = state.selectedDiff[idx] || 'stable';
    const card = document.createElement('div');
    card.className = 'song-card';

    const best = {
      stable:  localStorage.getItem(`lamda_best_${song.id}_stable`)  || null,
      fragile: localStorage.getItem(`lamda_best_${song.id}_fragile`) || null,
      chaos:   localStorage.getItem(`lamda_best_${song.id}_chaos`)   || null,
    };
    const currentBest = best[selDiff];

    const noteCounts = {
      stable: generateNotes(song, song.difficulties.stable.pattern).length,
      fragile: generateNotes(song, song.difficulties.fragile.pattern).length,
      chaos: generateNotes(song, song.difficulties.chaos.pattern).length,
    };

    // 计算歌曲时长
    const beatDur = 60 / song.bpm;
    const melodyBeats = song.melody.reduce((s, m) => s + m[1], 0);
    const totalSec = Math.round(melodyBeats * beatDur + 2); // +2 for leadIn

    card.innerHTML = `
      <div class="song-top">
        <div class="song-info">
          <div class="song-name">${song.name}</div>
          <div class="song-artist">${song.artist}</div>
          <div class="song-meta">BPM ${song.bpm} / ${noteCounts[selDiff]} Notes / ~${totalSec}s</div>
        </div>
        <div class="song-best">
          <div class="label">BEST</div>
          <div class="value ${currentBest == 1000000 ? 'lambda' : ''}">${currentBest ? parseInt(currentBest).toLocaleString() : '—'}</div>
        </div>
        <button class="play-btn" data-idx="${idx}" title="Play"></button>
      </div>
      <div class="song-bottom">
        <div class="diff-tab stable ${selDiff==='stable'?'active':''}" data-idx="${idx}" data-diff="stable">
          <span class="diff-name">STABLE</span>
          <span class="diff-lv">Lv.${song.difficulties.stable.level}</span>
          <span class="diff-best">${best.stable?parseInt(best.stable).toLocaleString():'—'}</span>
        </div>
        <div class="diff-tab fragile ${selDiff==='fragile'?'active':''}" data-idx="${idx}" data-diff="fragile">
          <span class="diff-name">FRAGILE</span>
          <span class="diff-lv">Lv.${song.difficulties.fragile.level}</span>
          <span class="diff-best">${best.fragile?parseInt(best.fragile).toLocaleString():'—'}</span>
        </div>
        <div class="diff-tab chaos ${selDiff==='chaos'?'active':''}" data-idx="${idx}" data-diff="chaos">
          <span class="diff-name">CHAOS</span>
          <span class="diff-lv">Lv.${song.difficulties.chaos.level}</span>
          <span class="diff-best">${best.chaos?parseInt(best.chaos).toLocaleString():'—'}</span>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  container.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      const diff = state.selectedDiff[idx] || 'stable';
      startChart(SONGS[idx].id, diff);
    });
  });

  container.querySelectorAll('.diff-tab').forEach(tab => {
    tab.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(tab.dataset.idx);
      const diff = tab.dataset.diff;
      state.selectedDiff[idx] = diff;
      buildSongSelect();
    });
  });
}

// ============ 键盘输入 ============
const keyMap = {};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.screen === 'game' && !state.paused) {
      pauseGame();
      return;
    } else if (state.paused) {
      resumeGame();
      return;
    }
  }

  if (state.screen !== 'game' || state.paused) return;
  if (e.repeat) return;

  if (!keyMap[e.code]) {
    keyMap[e.code] = true;
    state.keysHeld++;
    attemptHit();

    if (state.diagRunning) {
      const now = getChartTime();
      const diff = now - state.diagNextBeat;
      state.diagHits.push({ expected: state.diagNextBeat, actual: now, diff: diff });
      state.diagNextBeat += 0.5;
      updateDiagDisplay();
    }
  }
});

window.addEventListener('keyup', e => {
  if (keyMap[e.code]) {
    delete keyMap[e.code];
    state.keysHeld = Math.max(0, state.keysHeld - 1);
  }
});

window.addEventListener('blur', () => {
  for (const k in keyMap) delete keyMap[k];
  state.keysHeld = 0;
});

// ============ 鼠标/触摸 ============
canvas.addEventListener('mousedown', () => {
  if (state.screen !== 'game' || state.paused) return;
  state.keysHeld++;
  attemptHit();
});
canvas.addEventListener('mouseup', () => {
  state.keysHeld = Math.max(0, state.keysHeld - 1);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state.screen !== 'game' || state.paused) return;
  state.keysHeld++;
  attemptHit();
}, { passive: false });
canvas.addEventListener('touchend', () => {
  state.keysHeld = Math.max(0, state.keysHeld - 1);
});

// ============ 按钮事件 ============
document.getElementById('btnStart').addEventListener('click', () => {
  state.screen = 'select';
  ui.title.classList.add('hidden');
  buildSongSelect();
  ui.select.classList.remove('hidden');
});

document.getElementById('btnBackTitle').addEventListener('click', () => {
  ui.select.classList.add('hidden');
  ui.title.classList.remove('hidden');
  state.screen = 'title';
});

document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnRestart').addEventListener('click', restartChart);
document.getElementById('btnQuit').addEventListener('click', quitToSelect);

document.getElementById('btnResultRetry').addEventListener('click', restartChart);
document.getElementById('btnResultBack').addEventListener('click', quitToSelect);

// ============ 设置界面 ============
document.getElementById('btnSettings').addEventListener('click', () => {
  ui.title.classList.add('hidden');
  ui.settings.classList.remove('hidden');
  state.screen = 'settings';
});

document.getElementById('btnSettingsBack').addEventListener('click', () => {
  ui.settings.classList.add('hidden');
  ui.title.classList.remove('hidden');
  state.screen = 'title';
});

const setOffset = document.getElementById('setOffset');
const valOffset = document.getElementById('valOffset');
setOffset.value = state.offset;
valOffset.textContent = state.offset + 'ms';
setOffset.addEventListener('input', () => {
  state.offset = parseInt(setOffset.value);
  valOffset.textContent = state.offset + 'ms';
});

const setSpeed = document.getElementById('setSpeed');
const valSpeed = document.getElementById('valSpeed');
setSpeed.value = state.noteSpeed;
valSpeed.textContent = state.noteSpeed.toFixed(1) + 'x';
setSpeed.addEventListener('input', () => {
  state.noteSpeed = parseFloat(setSpeed.value);
  valSpeed.textContent = state.noteSpeed.toFixed(1) + 'x';
});

const setVolume = document.getElementById('setVolume');
const valVolume = document.getElementById('valVolume');
setVolume.value = state.volume;
valVolume.textContent = state.volume.toFixed(2);
setVolume.addEventListener('input', () => {
  state.volume = parseFloat(setVolume.value);
  valVolume.textContent = state.volume.toFixed(2);
});

// ============ 偏移诊断器 ============
document.getElementById('btnDiagStart').addEventListener('click', () => {
  state.diagRunning = !state.diagRunning;
  if (state.diagRunning) {
    state.diagHits = [];
    state.diagNextBeat = getChartTime() + 1.0;
    document.getElementById('btnDiagStart').textContent = 'STOP TEST';
    if (state.screen !== 'game') {
      startChart('endless', 'stable');
    }
  } else {
    document.getElementById('btnDiagStart').textContent = 'RUN TEST';
  }
});

function updateDiagDisplay() {
  if (state.diagHits.length === 0) return;
  const diffs = state.diagHits.map(h => h.diff * 1000);
  const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  const max = Math.max(...diffs.map(Math.abs));
  document.getElementById('diagAvg').textContent = avg.toFixed(1) + 'ms';
  document.getElementById('diagMax').textContent = max.toFixed(1) + 'ms';
  document.getElementById('diagCount').textContent = state.diagHits.length;

  const dc = document.getElementById('offsetCanvas');
  const dctx = dc.getContext('2d');
  const w = dc.width, h = dc.height;
  dctx.clearRect(0, 0, w, h);

  dctx.strokeStyle = '#111';
  dctx.lineWidth = 2;
  dctx.setLineDash([4, 4]);
  dctx.beginPath();
  dctx.moveTo(w / 2, 0);
  dctx.lineTo(w / 2, h);
  dctx.stroke();
  dctx.setLineDash([]);

  const range = 200;
  diffs.forEach((d, i) => {
    const x = w / 2 + (d / range) * (w / 2) * 0.9;
    const y = (i % 8) * (h / 8) + h / 16;
    dctx.fillStyle = Math.abs(d) < 50 ? '#2a8' : (Math.abs(d) < 120 ? '#d80' : '#d00');
    dctx.beginPath();
    dctx.arc(x, y, 3, 0, Math.PI * 2);
    dctx.fill();
  });
}

// ============ 初始化 ============
function init() {
  ui.title.classList.remove('hidden');
  ui.select.classList.add('hidden');
  ui.game.style.display = 'block';
  ui.hud.style.display = 'none';
  ui.pause.classList.add('hidden');
  ui.result.classList.add('hidden');
  ui.settings.classList.add('hidden');
  state.screen = 'title';
}

init();
</script>
