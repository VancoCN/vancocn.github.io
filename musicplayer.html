<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐播放器</title>
<style>
  :root {
    --bg: #f5f5f5;
    --bg-card: #ffffff;
    --text: #222222;
    --text-sub: #888888;
    --accent: #4a6cf7;
    --accent-hover: #3a5ce7;
    --border: #e0e0e0;
    --progress-bg: #e0e0e0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --btn-bg: #f0f0f0;
    --btn-hover: #e4e4e4;
    --danger: #e74c3c;
  }
  [data-theme="dark"] {
    --bg: #1a1a1a;
    --bg-card: #242424;
    --text: #e8e8e8;
    --text-sub: #999999;
    --accent: #6b8aff;
    --accent-hover: #5a7aef;
    --border: #333333;
    --progress-bg: #333333;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --btn-bg: #2e2e2e;
    --btn-hover: #3a3a3a;
    --danger: #ff6b5b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .topbar h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .topbar-actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    background: var(--btn-bg);
    color: var(--text);
    transition: all 0.2s;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  /* ===== 主体布局 ===== */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 140px;
  }

  /* ===== 播放器卡片 ===== */
  .player-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 28px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    text-align: center;
  }

  .now-playing {
    margin-bottom: 20px;
  }
  .now-playing .cover {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: #fff;
    animation: spin 20s linear infinite;
    animation-play-state: paused;
  }
  .now-playing .cover.playing {
    animation-play-state: running;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .now-playing .song-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .now-playing .song-status {
    font-size: 13px;
    color: var(--text-sub);
  }

  /* 进度条 */
  .progress-area {
    margin: 20px 0;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--progress-bg);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s linear;
  }
  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 6px;
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 20px 0;
  }
  .ctrl-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: var(--btn-hover); }
  .ctrl-btn.play-btn {
    width: 56px;
    height: 56px;
    background: var(--accent);
    color: #fff;
    font-size: 22px;
  }
  .ctrl-btn.play-btn:hover { background: var(--accent-hover); }

  /* 音量 */
  .volume-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
  }
  .volume-area label {
    font-size: 13px;
    color: var(--text-sub);
  }
  .volume-slider {
    width: 120px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--progress-bg);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* ===== 播放列表 ===== */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .song-list {
    list-style: none;
  }
  .song-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-card);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .song-item:hover {
    background: var(--btn-hover);
  }
  .song-item.active {
    border-color: var(--accent);
    background: var(--btn-bg);
  }
  .song-item .item-index {
    width: 32px;
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 600;
    text-align: center;
    flex-shrink: 0;
  }
  .song-item.active .item-index {
    color: var(--accent);
  }
  .song-item .item-info {
    flex: 1;
    min-width: 0;
    padding: 0 12px;
  }
  .song-item .item-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-item .item-meta {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .song-item .item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--text);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    text-decoration: none;
  }
  .icon-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
  }
  .empty-state h3 {
    font-size: 16px;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 13px;
    line-height: 1.6;
  }

  /* 错误提示 */
  .error-msg {
    font-size: 12px;
    color: var(--danger);
    margin-top: 4px;
  }

  /* 底部播放条 (移动端适配) */
  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; }
    .topbar h1 { font-size: 17px; }
    .container { padding: 16px 12px 120px; }
    .player-card { padding: 20px 16px; }
    .now-playing .cover { width: 110px; height: 110px; font-size: 38px; }
    .volume-slider { width: 90px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🎵 音乐播放器</h1>
  <div class="topbar-actions">
    <button class="btn" id="themeToggle">切换深色模式</button>
  </div>
</div>

<div class="container">

  <!-- 播放器主体 -->
  <div class="player-card">
    <div class="now-playing">
      <div class="cover" id="cover">♪</div>
      <div class="song-title" id="currentTitle">未选择歌曲</div>
      <div class="song-status" id="currentStatus">点击列表中的歌曲开始播放</div>
    </div>

    <div class="progress-area">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-times">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" title="播放/暂停">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
    </div>

    <div class="volume-area">
      <label>🔊</label>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>
  </div>

  <!-- 播放列表 -->
  <div class="section-title">播放列表</div>
  <ul class="song-list" id="songList"></ul>

</div>

<!-- ========== 内置歌曲数据（修改这里添加你的歌曲） ========== -->
<script>
var SONGS = [
  {
    "name": "Amidst The Jungle",
    "url": "https://vancocn.github.io/music/Amidst The Jungle.mp3"
  },
  {
    "name": "Beneath The Hel",
    "url": "https://vancocn.github.io/music/Beneath The Hel.mp3"
  },
  {
    "name": "Trader In Desert",
    "url": "https://vancocn.github.io/music/Trader In Desert.mp3"
  },
  {
    "name": "Under The Ocean",
    "url": "https://vancocn.github.io/music/Under The Ocean.mp3"
  },
  {
    "name": "ナイト・オブ・ナイツ (Vanco Remix)",
    "url": "https://vancocn.github.io/music/ナイト・オブ・ナイツ (Vanco Remix).mp3"
  },
  {
    "name": "Waiting In The Dark",
    "url": "https://vancocn.github.io/music/waiting in the dark.mp3"
  }
];
</script>

<!-- ========== 播放器逻辑 ========== -->
<script>
(function () {
  "use strict";

  // ---- DOM ----
  var audio = new Audio();
  var cover = document.getElementById("cover");
  var currentTitle = document.getElementById("currentTitle");
  var currentStatus = document.getElementById("currentStatus");
  var progressBar = document.getElementById("progressBar");
  var progressFill = document.getElementById("progressFill");
  var currentTimeEl = document.getElementById("currentTime");
  var totalTimeEl = document.getElementById("totalTime");
  var playBtn = document.getElementById("playBtn");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var volumeSlider = document.getElementById("volumeSlider");
  var songListEl = document.getElementById("songList");
  var themeToggle = document.getElementById("themeToggle");

  var currentIndex = -1;
  var isPlaying = false;

  // ---- 工具函数 ----
  function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- 渲染列表 ----
  function renderList() {
    if (!SONGS.length) {
      songListEl.innerHTML = '<div class="empty-state"><h3>暂无歌曲</h3><p>请在代码中 SONGS 数组里添加歌曲链接</p></div>';
      return;
    }
    var html = "";
    for (var i = 0; i < SONGS.length; i++) {
      var s = SONGS[i];
      var active = i === currentIndex ? " active" : "";
      html += '<li class="song-item' + active + '" data-index="' + i + '">'
        + '<span class="item-index">' + (i + 1) + '</span>'
        + '<div class="item-info">'
          + '<div class="item-name">' + escapeHtml(s.name) + '</div>'
          + '<div class="item-meta">' + escapeHtml(s.url) + '</div>'
        + '</div>'
        + '<div class="item-actions">'
          + '<a class="icon-btn" href="' + s.url + '" download title="下载" target="_blank" rel="noopener">⬇</a>'
        + '</div>'
      + '</li>';
    }
    songListEl.innerHTML = html;

    // 绑定点击
    var items = songListEl.querySelectorAll(".song-item");
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener("click", function (e) {
        if (e.target.tagName === "A") return; // 下载按钮不触发播放
        var idx = parseInt(this.getAttribute("data-index"), 10);
        loadSong(idx, true);
      });
    }
  }

  // ---- 加载歌曲 ----
  function loadSong(index, autoPlay) {
    if (index < 0 || index >= SONGS.length) return;
    currentIndex = index;
    var song = SONGS[index];

    audio.src = song.url;
    audio.load();

    currentTitle.textContent = song.name;
    currentStatus.textContent = "加载中...";

    // 更新列表高亮
    var items = songListEl.querySelectorAll(".song-item");
    for (var i = 0; i < items.length; i++) {
      items[i].classList.remove("active");
    }
    if (items[index]) items[index].classList.add("active");

    if (autoPlay) {
      audio.play().then(function () {
        setPlaying(true);
      }).catch(function (err) {
        currentStatus.textContent = "播放失败：" + err.message;
        setPlaying(false);
      });
    }
  }

  // ---- 播放状态 ----
  function setPlaying(playing) {
    isPlaying = playing;
    playBtn.textContent = playing ? "⏸" : "▶";
    if (playing) {
      cover.classList.add("playing");
      currentStatus.textContent = "正在播放";
    } else {
      cover.classList.remove("playing");
      if (currentIndex >= 0) currentStatus.textContent = "已暂停";
    }
  }

  // ---- 控制按钮 ----
  playBtn.addEventListener("click", function () {
    if (currentIndex < 0) {
      if (SONGS.length > 0) loadSong(0, true);
      return;
    }
    if (audio.paused) {
      audio.play().then(function () { setPlaying(true); });
    } else {
      audio.pause();
      setPlaying(false);
    }
  });

  prevBtn.addEventListener("click", function () {
    if (!SONGS.length) return;
    var idx = currentIndex <= 0 ? SONGS.length - 1 : currentIndex - 1;
    loadSong(idx, isPlaying);
  });

  nextBtn.addEventListener("click", function () {
    if (!SONGS.length) return;
    var idx = currentIndex >= SONGS.length - 1 ? 0 : currentIndex + 1;
    loadSong(idx, isPlaying);
  });

  // ---- 进度条 ----
  audio.addEventListener("timeupdate", function () {
    if (!audio.duration) return;
    var pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + "%";
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener("loadedmetadata", function () {
    totalTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener("ended", function () {
    nextBtn.click();
  });

  audio.addEventListener("error", function () {
    currentStatus.textContent = "加载失败，请检查链接是否有效";
    setPlaying(false);
  });

  progressBar.addEventListener("click", function (e) {
    if (!audio.duration) return;
    var rect = progressBar.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // ---- 音量 ----
  audio.volume = volumeSlider.value;
  volumeSlider.addEventListener("input", function () {
    audio.volume = volumeSlider.value;
  });

  // ---- 键盘快捷键 ----
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
      e.preventDefault();
      playBtn.click();
    } else if (e.code === "ArrowRight") {
      nextBtn.click();
    } else if (e.code === "ArrowLeft") {
      prevBtn.click();
    }
  });

  // ---- 深浅色模式 ----
  var savedTheme = localStorage.getItem("music-player-theme");
  if (savedTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    themeToggle.textContent = "切换浅色模式";
  }
  themeToggle.addEventListener("click", function () {
    var isDark = document.documentElement.getAttribute("data-theme") === "dark";
    if (isDark) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("music-player-theme", "light");
      themeToggle.textContent = "切换深色模式";
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      localStorage.setItem("music-player-theme", "dark");
      themeToggle.textContent = "切换浅色模式";
    }
  });

  // ---- 初始化 ----
  renderList();

})();
</script>

</body>
</html>
